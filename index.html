<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Riverside Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Riverside Connect" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="maskable_icon_x192.png"
    />
    <meta property="og:title" content="Riverside Connect" />
    <meta
      property="og:description"
      content="Join the conversation – real-time Christian community"
    />
    <meta
      property="og:image"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/maskable_icon_x192.png"
    />
    <meta
      property="og:url"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/The-Riverside-Connect/"
    />
    <script>
      try {
        if (localStorage.getItem("rc_seen2"))
          document.documentElement.classList.add("calm");
        else localStorage.setItem("rc_seen2", "1");
      } catch (e) {}
    </script>
    <style>
      :root {
        --ink: #e2e8f0;
        --paper: #0a0f1e;
        --surface: #0f172a;
        --lift: #1a2540;
        --wire: rgba(96, 165, 250, 0.18);
        --steel: #64748b;
        --lead: #94a3b8;
        --accent: #3b82f6;
        --accent2: #60a5fa;
        --gold: #facc15;
        --danger: #ef4444;
        --green: #10b981;
        --head: "Bebas Neue", Impact, sans-serif;
        --body:
          "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --bar: 54px;
        --top: env(safe-area-inset-top, 0px);
        --bot: env(safe-area-inset-bottom, 0px);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent2);
        outline-offset: 2px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(60vmax 60vmax at 0% 0%, rgba(59, 130, 246, 0.16), transparent 70%),
          radial-gradient(60vmax 60vmax at 100% 100%, rgba(99, 102, 241, 0.16), transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      @keyframes drift {
        to {
          transform: translate(8vmax, 6vmax) scale(1.15);
        }
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.88) translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
        }
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes flt {
        to {
          transform: translateY(-120px) scale(1.4);
          opacity: 0;
        }
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(250, 204, 21, 0);
        }
        50% {
          box-shadow: 0 0 18px 2px rgba(250, 204, 21, 0.25);
        }
      }
      .in {
        animation: up 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: calc(var(--i, 0) * 70ms);
      }

      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(var(--bar) + var(--top));
        padding: var(--top) max(10px, env(safe-area-inset-right)) 0
          max(10px, env(safe-area-inset-left));
        background: rgba(10, 15, 30, 0.85);
        border-bottom: 1px solid var(--wire);
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .logo {
        font-family: var(--head);
        font-size: 1.3rem;
        letter-spacing: 0.08em;
        color: var(--accent2);
        white-space: nowrap;
      }
      .sp {
        flex: 1;
      }
      #net {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 99px;
        background: rgba(16, 185, 129, 0.14);
        color: #34d399;
        transition: 0.3s;
      }
      #net i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        animation: pulse 2s infinite;
      }
      body.offline #net {
        background: rgba(250, 204, 21, 0.14);
        color: var(--gold);
      }
      body.offline #net i {
        background: var(--gold);
        animation: none;
      }
      .ib {
        position: relative;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        background: none;
        border: 0;
        border-radius: 10px;
        color: var(--lead);
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
        text-decoration: none;
      }
      .ib:hover {
        color: var(--accent2);
        background: var(--lift);
      }
      .ib:active {
        transform: scale(0.88);
      }
      .ib svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ib.spinning svg {
        animation: spin 0.8s linear infinite;
      }
      .tb-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 16px;
        height: 16px;
        background: var(--danger);
        color: #fff;
        font-size: 0.58rem;
        font-weight: 800;
        border-radius: 99px;
        display: none;
        place-items: center;
        padding: 0 4px;
        border: 1.5px solid var(--paper);
      }
      .tb-badge.visible {
        display: grid;
        animation: pop 0.4s;
      }
      .av img {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(96, 165, 250, 0.4);
      }

      #chat-list {
        position: fixed;
        top: calc(var(--bar) + var(--top));
        left: 0;
        right: 0;
        bottom: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        z-index: 1;
        padding-bottom: calc(24px + var(--bot));
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 14px max(14px, env(safe-area-inset-left)) 10px
          max(14px, env(safe-area-inset-right));
      }
      .cols {
        display: grid;
        gap: 14px;
      }
      @media (min-width: 900px) {
        .cols {
          grid-template-columns: 1.05fr 1fr;
          align-items: start;
        }
        .col-l {
          position: sticky;
          top: 14px;
        }
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .card {
        background: linear-gradient(
          160deg,
          rgba(26, 37, 64, 0.7),
          rgba(15, 23, 42, 0.8)
        );
        border: 1px solid var(--wire);
        border-radius: 18px;
        padding: 14px;
      }
      .lbl {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--steel);
        margin: 6px 4px;
      }

      /* smart search */
      .searchwrap {
        position: relative;
        z-index: 20;
      }
      .searchbox {
        position: relative;
        display: flex;
        align-items: center;
      }
      .searchbox > svg {
        position: absolute;
        left: 14px;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--steel);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .searchbox input {
        width: 100%;
        min-width: 0;
        height: 44px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--surface);
        border: 1px solid var(--wire);
        border-radius: 99px;
        padding: 0 44px 0 42px;
        font-size: 0.95rem;
        transition: 0.2s;
      }
      .searchbox input::-webkit-search-cancel-button,
      .searchbox input::-webkit-search-decoration {
        -webkit-appearance: none;
        display: none;
      }
      .searchbox input:focus {
        border-color: var(--accent2);
        outline: 0;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
      }
      #s-clear {
        position: absolute;
        right: 6px;
        width: 32px;
        height: 32px;
        display: none;
        place-items: center;
        background: none;
        border: 0;
        border-radius: 50%;
        color: var(--lead);
        cursor: pointer;
      }
      #s-clear.show {
        display: grid;
      }
      #s-clear:hover {
        background: var(--lift);
        color: var(--accent2);
      }
      #s-clear svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      #results {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        max-height: min(60vh, 420px);
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--wire);
        border-radius: 16px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      }
      #results.show {
        display: flex;
      }
      .hit {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 9px;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.15s;
      }
      .hit:hover,
      .hit.act {
        border-color: var(--accent2);
        background: rgba(59, 130, 246, 0.14);
      }
      .hit:active {
        transform: scale(0.98);
      }
      .hit img,
      .hit .ico {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--lift);
      }
      .hit .ico {
        display: grid;
        place-items: center;
        font-size: 1.05rem;
      }
      .hit .tx {
        flex: 1;
        min-width: 0;
      }
      .hit .t {
        font-weight: 700;
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hit .s {
        font-size: 0.74rem;
        color: var(--lead);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hit .tag {
        max-width: 96px;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--accent2);
        background: rgba(59, 130, 246, 0.12);
        padding: 3px 9px;
        border-radius: 99px;
        flex-shrink: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hit .tag.gr {
        color: var(--gold);
        background: rgba(250, 204, 21, 0.1);
      }
      .list-empty.in-res {
        padding: 10px;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 8px;
      }
      .chip {
        padding: 7px 13px;
        border-radius: 99px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.28);
        color: var(--accent2);
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
      }
      .chip:hover {
        background: rgba(59, 130, 246, 0.22);
      }
      .btn {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 9px 16px;
        font-weight: 700;
        font-size: 0.82rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn:hover {
        background: #2563eb;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: scale(0.94);
      }
      .btn.ghost {
        background: rgba(96, 165, 250, 0.1);
        color: var(--accent2);
        border: 1px solid var(--wire);
      }

      .v-act {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .mut {
        color: var(--lead);
        font-size: 0.82rem;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 9px;
        margin-top: 10px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 13px 6px;
        border-radius: 14px;
        background: var(--lift);
        border: 1px solid var(--wire);
        cursor: pointer;
        transition: 0.25s;
        font-size: 0.8rem;
        font-weight: 500;
      }
      .tile span {
        font-size: 1.5rem;
        transition: 0.25s;
      }
      .tile:hover {
        transform: translateY(-3px);
        border-color: var(--accent2);
      }
      .tile:hover span {
        transform: scale(1.2) rotate(-6deg);
      }
      .tile:active {
        transform: scale(0.94);
      }
      a.tile {
        text-decoration: none;
        color: inherit;
        text-align: center;
      }
      .tile img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        transition: 0.25s;
      }
      .tile:hover img {
        transform: scale(1.12) rotate(-4deg);
      }

      /* rows */
      .list-section-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--steel);
        padding: 12px 6px 6px;
      }
      .chat-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        cursor: pointer;
        width: 100%;
        text-align: left;
        text-decoration: none;
        color: inherit;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--wire);
        border-radius: 14px;
        margin-bottom: 8px;
        transition: 0.22s;
        animation: up 0.5s both;
        animation-delay: calc(var(--i, 0) * 55ms);
      }
      .chat-row:hover {
        background: var(--lift);
        transform: translateX(4px);
        border-color: rgba(96, 165, 250, 0.4);
      }
      .chat-row:active {
        transform: scale(0.98);
      }
      .row-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--lift);
        border: 2px solid rgba(96, 165, 250, 0.18);
        flex-shrink: 0;
      }
      .row-map-thumb {
        width: 64px;
        aspect-ratio: 16/9;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid var(--wire);
        background: var(--lift);
      }
      .row-content {
        flex: 1;
        min-width: 0;
      }
      .row-title-line,
      .row-sub-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .row-title {
        font-weight: 700;
        font-size: 0.94rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-time {
        font-size: 0.65rem;
        color: var(--steel);
        flex-shrink: 0;
      }
      .row-sub-line {
        margin-top: 2px;
      }
      .row-subtitle {
        font-size: 0.8rem;
        color: var(--lead);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-badge {
        min-width: 20px;
        height: 20px;
        background: var(--accent);
        color: #fff;
        font-size: 0.65rem;
        font-weight: 800;
        border-radius: 99px;
        display: none;
        place-items: center;
        padding: 0 6px;
        flex-shrink: 0;
      }
      .row-badge.visible {
        display: grid;
        animation: pop 0.4s;
      }
      .row-badge.on {
        background: rgba(16, 185, 129, 0.18);
        color: #34d399;
      }
      .row-badge.off {
        background: rgba(100, 116, 139, 0.18);
        color: var(--steel);
      }
      .list-empty {
        padding: 8px 8px 14px;
        color: var(--steel);
        font-size: 0.78rem;
      }

      /* sheet */
      #scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 1000;
      }
      #scrim.show {
        opacity: 1;
        pointer-events: auto;
      }
      #sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        width: min(640px, 100%);
        max-height: 86dvh;
        background: var(--surface);
        border: 1px solid var(--wire);
        border-radius: 22px 22px 0 0;
        z-index: 1001;
        transform: translate(-50%, 105%);
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1);
        display: flex;
        flex-direction: column;
      }
      #sheet.show {
        transform: translate(-50%, 0);
      }
      .grab {
        width: 42px;
        height: 4px;
        border-radius: 9px;
        background: var(--steel);
        margin: 9px auto 4px;
        opacity: 0.5;
      }
      .sh-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 18px;
      }
      .sh-h h3 {
        font-family: var(--head);
        font-size: 1.5rem;
        letter-spacing: 0.08em;
        color: var(--accent2);
        font-weight: 400;
      }
      #sh-b {
        overflow-y: auto;
        padding: 4px 16px calc(20px + var(--bot));
      }
      .vc {
        background: var(--lift);
        border-radius: 14px;
        padding: 13px;
        margin-bottom: 10px;
        animation: up 0.45s both;
        animation-delay: calc(var(--i, 0) * 90ms);
      }
      .vc p {
        line-height: 1.6;
        font-size: 0.94rem;
        font-weight: 300;
      }
      .vc .ref {
        color: var(--gold);
        font-weight: 700;
        font-size: 0.82rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }
      .vc button {
        background: none;
        border: 0;
        color: var(--accent2);
        cursor: pointer;
        font-size: 0.78rem;
      }
      .pray {
        border-left: 3px solid var(--gold);
        padding: 8px 12px;
        font-style: italic;
        color: var(--lead);
        margin: 10px 0;
        line-height: 1.55;
        font-size: 0.9rem;
      }

      /* toast, install, pending */
      #toast-area {
        position: fixed;
        top: calc(var(--bar) + var(--top) + 10px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        align-items: center;
      }
      .toast-msg {
        padding: 9px 16px;
        border-radius: 99px;
        font-size: 0.78rem;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        animation: pop 0.3s;
        max-width: 92vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast-msg.ok {
        background: rgba(16, 185, 129, 0.94);
      }
      .toast-msg.err {
        background: rgba(239, 68, 68, 0.94);
      }
      .toast-msg.inf {
        background: rgba(59, 130, 246, 0.94);
      }
      #install-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 10px 16px calc(10px + var(--bot));
        background: rgba(10, 15, 30, 0.96);
        border-top: 1px solid var(--wire);
        z-index: 700;
        display: none;
      }
      #install-bar.show {
        display: block;
        animation: up 0.4s;
      }
      .install-btn {
        display: block;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        padding: 11px;
        background: rgba(59, 130, 246, 0.12);
        color: var(--accent2);
        border: 1px solid rgba(96, 165, 250, 0.3);
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      #pending-screen {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--paper);
        z-index: 1500;
        flex-direction: column;
        align-items: center;

      .chat-row {

              "I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.",
            ],
          ],
        },
      };

      /* ══════════ SHEET ══════════ */
      function openSheet(t, h) {
        $("#sh-t").textContent = t;
        $("#sh-b").innerHTML = h;
        $("#scrim").classList.add("show");
        $("#sheet").classList.add("show");
        $("#sh-b").scrollTop = 0;
      }
      function closeSheet() {
        $("#scrim").classList.remove("show");
        $("#sheet").classList.remove("show");
      }
      $("#scrim").onclick = $("#sh-x").onclick = closeSheet;
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSheet();
      });

      /* ══════════ SMART SEARCH ══════════
         Indexes every link/tile/row on the page automatically, so any new
         page you add is searchable with no code change. Optional extras on
         any element:  data-keywords="word1 word2"  data-title="Name"
         data-tag="Label"  (and data-search on non-link elements). */
      const input = $("#msg"),
        box = $("#results"),
        clr = $("#s-clear");
      const SYN = [
        "song songs hymn hymns worship lyrics music sing singing praise choir",
        "pledge pledges give giving offering tithe contribute contribution contributions money",
        "map maps mapping location locations fellowship fellowships directions near nearby",
        "chat chats message messages dm inbox talk",
        "announcement announcements news update updates notice notices",
        "notification notifications alert alerts push reminder reminders",
        "profile account settings",
        "split cash expenses bill share",
      ].map((s) => s.split(" "));
      const STOP = new Set(
        "go to open the me take find show my a an i want please on in for of and with page tab section is are can you".split(
          " ",
        ),
      );
      const norm = (s) =>
        (s || "")
          .toLowerCase()
          .replace(/[^a-z0-9&\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      const stem = (t) => (t.length > 3 && t.endsWith("s") ? t.slice(0, -1) : t);
      function lev1(a, b) {
        if (Math.abs(a.length - b.length) > 1) return false;
        let i = 0,
          j = 0,
          e = 0;
        while (i < a.length && j < b.length) {
          if (a[i] === b[j]) {
            i++;
            j++;
            continue;
          }
          if (++e > 1) return false;
          if (a.length > b.length) i++;
          else if (a.length < b.length) j++;
          else {
            i++;
            j++;
          }
        }
        return e + (a.length - i) + (b.length - j) <= 1;
      }
      function sectionLabel(el) {
        const g = el.closest("[data-tag]");
        return g ? g.dataset.tag : "Page";
      }
      function describe(el) {
        const href = el.getAttribute("href") || "";
        if (/^(#|javascript:)/i.test(href)) return null;
        const img = el.querySelector("img");
        const title = (
          el.dataset.title ||
          el.querySelector(".row-title")?.textContent ||
          el.getAttribute("aria-label") ||
          el.getAttribute("title") ||
          el.textContent ||
          (img && img.alt) ||
          ""
        )
          .replace(/\s+/g, " ")
          .trim();
        if (!title) return null;
        const file = href
          .split("?")[0]
          .split("/")
          .pop()
          .replace(/\.\w+$/, "")
          .replace(/[-_]+/g, " ");
        return {
          title,
          href,
          key: href || el.id || title,
          sub:
            el.dataset.sub ||
            el.querySelector(".row-subtitle")?.textContent.trim() ||
            "",
          img: img ? img.getAttribute("src") || "" : "",
          tag: sectionLabel(el),
          kw: `${el.dataset.keywords || ""} ${file} ${(img && img.alt) || ""}`,
        };
      }
      const RKEY = "rc_recent";
      function remember(d) {
        if (!d || !d.href) return;
        const r = LS.get(RKEY, []).filter((x) => x.href !== d.href);
        r.unshift({ title: d.title, href: d.href, img: d.img });
        LS.set(RKEY, r.slice(0, 4));
      }
      function buildIndex() {
        const seen = new Set(),
          out = [];
        [
          ...document.querySelectorAll(
            "#chat-list a[href], #chat-list button.chat-row, #chat-list [data-search]",
          ),
          ...document.querySelectorAll("#topbar a[href]"),
        ].forEach((el) => {
          if (el.closest(".searchwrap") || el.closest("[hidden]")) return;
          const d = describe(el);
          if (!d || seen.has(d.key)) return;
          seen.add(d.key);
          out.push({
            ...d,
            go: () => {
              if (el.tagName === "A") {
                remember(d);
                el.target === "_blank"
                  ? window.open(el.href, "_blank")
                  : (location.href = el.href);
              } else el.click();
            },
          });
        });
        return out;
      }
      function tokScore(t, tw, kw, sw, title) {
        if (tw.includes(t)) return 45;
        if (tw.some((w) => w.startsWith(t))) return 38;
        if (kw.includes(t)) return 34;
        if (kw.some((w) => w.startsWith(t))) return 28;
        if (sw.some((w) => w.startsWith(t))) return 12;
        if (t.length >= 4 && tw.concat(kw).some((w) => lev1(w, t))) return 20;
        if (t.length >= 3 && title.includes(t)) return 15;
        return 0;
      }
      function score(item, q) {
        const toks = norm(q)
          .split(" ")
          .filter((t) => t && !STOP.has(t));
        if (!toks.length) return 0;
        const joined = toks.join(" "),
          title = norm(item.title),
          tw = title.split(" "),
          kw = norm(item.kw).split(" "),
          sw = norm(item.sub).split(" ");
        let s = 0,
          hit = 0;
        if (title === joined) s += 100;
        else if (title.startsWith(joined)) s += 80;
        for (const t of toks) {
          const st = stem(t);
          let p = Math.max(
            tokScore(t, tw, kw, sw, title),
            tokScore(st, tw, kw, sw, title),
          );
          SYN.forEach((g) => {
            if (g.includes(t) || g.includes(st))
              g.forEach((w) => {
                if (w !== t && w !== st)
                  p = Math.max(
                    p,
                    Math.round(tokScore(w, tw, kw, sw, title) * 0.8),
                  );
              });
          });
          if (p) {
            hit++;
            s += p;
          }
        }
        return hit ? s + (hit === toks.length ? 10 : 0) : 0;
      }
      const search = (q) =>
        buildIndex()
          .map((item) => ({ item, s: score(item, q) }))
          .filter((r) => r.s > 0)
          .sort((a, b) => b.s - a.s);
      const topicOf = (txt) =>
        Object.keys(T).find((k) =>
          new RegExp(T[k].k, "i").test(txt.toLowerCase()),
        );
      const HELP_RE = /^\?$|\bhelp\b|what can|how (do|can|to)/i,
        VERSE_RE = /\b(verse|scripture|bible|pray|prayer)\b/i;

      /* ── Bible guide + help open in the bottom sheet ── */
      function topicSheet(k) {
        const t = T[k];
        openSheet(
          t.e + " " + t.n,
          t.v
            .map(
              (v, i) =>
                `<div class="vc" style="--i:${i}"><p>${esc(v[1])}</p><div class="ref"><span>${esc(v[0])} · KJV</span><button data-c="${esc(v[0] + " — " + v[1])}">Copy</button></div></div>`,
            )
            .join("") + `<div class="pray">${esc(t.p)}</div>`,
        );
        $("#sh-b")
          .querySelectorAll("[data-c]")
          .forEach((b) => (b.onclick = () => copy(b.dataset.c)));
      }
      function helpSheet() {
        const idx = buildIndex();
        openSheet(
          "Help",
          `<div class="pray" style="font-style:normal">Type the name of any page, channel or Q&amp;A to open it. Or type how you feel — anxious, sad, grateful — for a verse and prayer. You can also type “verse” or “pray”.</div><div class="lbl">OPEN</div><div class="pills">${idx.map((it, i) => `<button class="chip" data-i="${i}">${esc(it.title)}</button>`).join("")}</div>`,
        );
        $("#sh-b")
          .querySelectorAll("[data-i]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                closeSheet();
                idx[b.dataset.i].go();
              }),
          );
      }

      /* ── live results (floating, takes no layout space) ── */
      let hits = [],
        active = -1;
      function setActive(i) {
        active = i;
        [...box.querySelectorAll(".hit")].forEach((b, n) =>
          b.classList.toggle("act", n === i),
        );
        box.querySelectorAll(".hit")[i]?.scrollIntoView({ block: "nearest" });
      }
      function paint(head) {
        box.innerHTML = "";
        if (head) {
          const h = document.createElement("div");
          h.className = "res-h";
          h.textContent = head;
          box.appendChild(h);
        }
        hits.forEach((h) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "hit";
          b.setAttribute("role", "option");
          const tx = document.createElement("div");
          tx.className = "tx";
          const tag = document.createElement("span");
          tag.className = "tag";
          let lead;
          if (h.item) {
            lead = document.createElement("img");
            lead.alt = "";
            lead.src = h.item.img || fb(h.item.title);
            lead.onerror = () => {
              lead.onerror = null;
              lead.src = fb(h.item.title);
            };
            tx.innerHTML = `<div class="t">${esc(h.item.title)}</div><div class="s">${esc(h.item.sub)}</div>`;
            tag.textContent = h.item.tag;
          } else {
            lead = document.createElement("div");
            lead.className = "ico";
            tag.classList.add("gr");
            if (h.help) {
              lead.textContent = "💡";
              tx.innerHTML =
                '<div class="t">What can I search?</div><div class="s">Tips and everything you can open</div>';
              tag.textContent = "Help";
            } else {
              lead.textContent = T[h.k].e;
              tx.innerHTML = `<div class="t">${h.rand ? "A verse &amp; prayer for you" : "A word for feeling " + esc(T[h.k].n.toLowerCase())}</div><div class="s">Verse &amp; prayer</div>`;
              tag.textContent = "Verse";
            }
          }
          b.append(lead, tx, tag);
          b.onclick = () => activate(h);
          box.appendChild(b);
        });
        box.classList.add("show");
      }
      function renderHits() {
        const q = input.value.trim();
        clr.classList.toggle("show", !!input.value);
        hits = [];
        active = -1;
        if (!q) {
          /* empty + focused: show the last few pages opened */
          const rec = LS.get(RKEY, []);
          if (!rec.length || document.activeElement !== input) {
            box.classList.remove("show");
            box.innerHTML = "";
            return;
          }
          hits = rec.map((r) => ({
            item: {
              title: r.title,
              img: r.img,
              sub: "",
              tag: "Recent",
              go: () => (location.href = r.href),
            },
          }));
          return paint("Recent");
        }
        const nav = search(q).slice(0, 6),
          extras = [],
          k = topicOf(q);
        if (HELP_RE.test(q)) extras.push({ help: 1 });
        if (k) extras.push({ k });
        else if (VERSE_RE.test(q))
          extras.push({ k: rnd(Object.keys(T)), rand: 1 });
        hits =
          nav[0] && nav[0].s >= 60 ? [...nav, ...extras] : [...extras, ...nav];
        if (!hits.length) {
          box.innerHTML = '<div class="list-empty in-res">No match</div>';
          box.classList.add("show");
          return;
        }
        paint();
      }
      function resetInput(open) {
        input.value = "";
        renderHits();
        if (!open) box.classList.remove("show");
      }
      function activate(h) {
        if (h.item) return h.item.go();
        resetInput();
        h.help ? helpSheet() : topicSheet(h.k);
      }

      /* ── Enter: open a page when it's clear, otherwise guide / help ── */
      function submit() {
        const t = input.value.trim();
        if (!t) return;
        const res = search(t),
          top = res[0],
          nxt = res[1],
          clear = top && (!nxt || top.s >= nxt.s * 1.25),
          k = topicOf(t),
          help = HELP_RE.test(t),
          verse = VERSE_RE.test(t);
        if (clear && (top.s >= 60 || (top.s >= 34 && !k && !help && !verse)))
          return top.item.go();
        if (help) {
          resetInput();
          return helpSheet();
        }
        if (k || verse) {
          resetInput();
          return topicSheet(k || rnd(Object.keys(T)));
        }
        toast(
          res.length ? "A few matches — tap one to open it" : "Nothing found",
          "inf",
          2200,
        );
      }
      input.addEventListener("input", renderHits);
      input.addEventListener("focus", renderHits);
      input.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" && hits.length) {
          e.preventDefault();
          setActive((active + 1) % hits.length);
        } else if (e.key === "ArrowUp" && hits.length) {
          e.preventDefault();
          setActive((active - 1 + hits.length) % hits.length);
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (active >= 0 && hits[active]) activate(hits[active]);
          else submit();
        } else if (e.key === "Escape") {
          resetInput();
        }
      });
      clr.onclick = () => {
        resetInput();
        input.focus();
      };
      document.addEventListener("click", (e) => {
        /* remember pages opened by tapping tiles/rows directly */
        const a = e.target.closest("#chat-list a[href]");
        if (a && !a.closest(".searchwrap")) remember(describe(a));
        if (!e.target.closest(".searchwrap")) box.classList.remove("show");
      });

      /* ══════════ NOTIFICATIONS ══════════ */
      function updateNotifRowUI() {
        const b = $("#notif-row-badge");
        b.textContent = isNotificationEnabled ? "ON" : "OFF";
        b.className =
          "row-badge visible " + (isNotificationEnabled ? "on" : "off");
      }
      updateNotifRowUI();
      $("#notif-row").addEventListener("click", toggleNotifications);
      async function toggleNotifications() {
        if (!("serviceWorker" in navigator) || !("Notification" in window)) {
          toast("Notifications not supported", "err");
          return;
        }
        isNotificationEnabled = !isNotificationEnabled;
        localStorage.setItem("notificationsEnabled", isNotificationEnabled);
        updateNotifRowUI();
        if (!isNotificationEnabled)
          return toast("Notifications turned off", "inf");
        if (!navigator.onLine)
          return toast("Saved — will turn on when you're online", "inf");
        try {
          await registerFcmToken(true);
          toast("Notifications enabled", "ok");
        } catch (err) {
          console.error(err);
          toast("Failed to enable notifications", "err");
          isNotificationEnabled = false;
          localStorage.setItem("notificationsEnabled", "false");
          updateNotifRowUI();
        }
      }
      async function registerFcmToken(force) {
        if (
          !("serviceWorker" in navigator) ||
          !("Notification" in window) ||
          !navigator.onLine
        )
          return;
        if (Notification.permission === "denied" && !force) return;
        const { initializeApp } =
          await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js");
        const { getMessaging, getToken } =
          await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-messaging.js");
        const app = initializeApp(FIREBASE_CONFIG),
          msg = getMessaging(app);
        const swReg = await navigator.serviceWorker.register("./sw.js", {
          scope: "./",
        });
        let perm = Notification.permission;
        if (perm === "default") perm = await Notification.requestPermission();
        if (perm !== "granted") return;
        const token = await getToken(msg, {
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: swReg,
        });
        if (!token) return;
        await api(null, {
          operation: "saveFcmToken",
          username: userName,
          fcmToken: token,
        });
      }

      /* ══════════ INSTALL ══════════ */
      let deferred = null;

      $("#install-btn").onclick = async () => {

          deferred = null;
        }
      };
      addEventListener("appinstalled", () => (bar.classList.remove("show"), document.body.classList.remove("has-install")));

      /* ══════════ DATA (cached for offline) ══════════ */
      function buildRow({ id, href, avatarSrc, name, subtitle, i }) {
        const el = document.createElement("a");

        return el;
      }
      async function loadStatus() {
        try {
          const d = await api({ operation: "getUserStatus", name: userName });

          LS.set("rc_status", s);

      }
      async function loadAnnBadge() {

            (await api({ operation: "getUnseenAnnCount", name: userName }))
              .unseenCount || 0;

      }
      function previewText(p) {
        if (!p) return "No posts yet";
        const t = (p.content || "")
          .replace(/https?:\/\/drive\.google\.com\/[^\s<>"']*/gi, "")
          .replace(/\/view\b\S*/gi, "")
          .replace(/usp=\S+/gi, "")
          .replace(/\s{2,}/g, " ")

      function setPreview(id, p) {

      /* show only the first few rows, with "See all (N)" */
      const LIMIT = 5,

      [

          expanded[slot] = !expanded[slot];
          applyCollapse(slot, btn, cnt);
        };
      });

      async function loadList(
        slot,
        btn,
        cnt,
        key,
        op,
        hrefFn,
        subtitle,
        emptyMsg,
        withPreview,
      ) {
        const el = $(slot),
          cached = LS.get(key, null);
        if (cached) {
          el.innerHTML = cached;
          applyCollapse(slot, btn, cnt);
        }
        try {
          const { channels = [] } = await api({ operation: op });
          if (!channels.length) {
            el.innerHTML = `<div class="list-empty">${emptyMsg}</div>`;
            LS.set(key, null);
            applyCollapse(slot, btn, cnt);
            return;
          }
          el.innerHTML = "";
          channels.forEach((c, i) =>
            el.appendChild(
              buildRow({
                id: withPreview ? "ch-row-" + c.id : "",
                href: hrefFn(c.id),
                avatarSrc: c.picLink ? lh3(c.picLink) : fb(c.name),
                name: c.name,
                subtitle: withPreview ? "Loading…" : subtitle,
                i,
              }),
            ),
          );
          applyCollapse(slot, btn, cnt);
          LS.set(key, el.innerHTML);
          if (withPreview) {
            await Promise.all(
              channels.map(async (c) => {
                try {
                  const d = await api({
                    operation: "getChannelPosts",
                    channelId: c.id,
                    username: userName,
                  });
                  setPreview(
                    c.id,
                    (d.posts || [])
                      .slice()
                      .sort(
                        (a, b) => new Date(b.created) - new Date(a.created),
                      )[0] || null,
                  );
                } catch {
                  setPreview(c.id, null);
                }
              }),
            );
            /* most recently active channels first */
            [...el.querySelectorAll(".chat-row")]
              .sort((a, b) => (+b.dataset.ts || 0) - (+a.dataset.ts || 0))
              .forEach((r) => el.appendChild(r));
            applyCollapse(slot, btn, cnt);
            LS.set(key, el.innerHTML);
          }
        } catch {
          if (!cached)
            el.innerHTML = `<div class="list-empty">${navigator.onLine ? "Couldn't load — pull down to refresh" : "You're offline — this will load when you reconnect"}</div>`;
        }

      const loadChannels = () =>
        loadList(
          "#channels-slot",
          "#ch-more",
          "#cnt-ch",
          "rc_channels",
          "getAllChannels",

          "No channels available yet",

      const loadQnA = () =>

          "#qa-more",
          "#cnt-qa",
          "rc_qna",
          "getAllQnAChannels",
          (id) => `Q&A.html?channelId=${encodeURIComponent(id)}`,
          "Tap to interact with the questions",
          "No Q&A spaces yet",
          false,
        );

      /* ── tabs ── */
      const tabs = [...document.querySelectorAll(".tab")];
      function setTab(n) {

      tabs.forEach((t) => (t.onclick = () => setTab(t.dataset.t)));
      setTab(LS.get("rc_tab", "channels"));

      /* ── refresh: automatic on return to the app + pull down at the top ── */
      let refreshing = false,
        lastRefresh = Date.now();
      async function refreshAll(quiet) {
        if (refreshing) return;
        refreshing = true;
        lastRefresh = Date.now();
        if (!navigator.onLine) {
          refreshing = false;
          if (!quiet) toast("Offline — showing saved content", "inf");
          return;
        }
        await Promise.all([
          loadStatus(),
          loadChannels(),
          loadQnA(),
          loadAnnBadge(),
        ]);
        refreshing = false;
        if (!quiet) toast("Refreshed", "ok", 1400);
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && Date.now() - lastRefresh > 60000)
          refreshAll(true);
      });
      (() => {
        const sc = $("#chat-list");
        let y0 = null,
          dy = 0;
        sc.addEventListener(
          "touchstart",
          (e) => {
            y0 = sc.scrollTop === 0 ? e.touches[0].clientY : null;
            dy = 0;
          },
          { passive: true },
        );
        sc.addEventListener(
          "touchmove",
          (e) => {
            if (y0 != null) dy = e.touches[0].clientY - y0;
          },
          { passive: true },
        );
        sc.addEventListener("touchend", () => {
          if (y0 != null && dy > 90) {
            toast("Refreshing…", "inf", 1200);
            refreshAll(false);
          }
          y0 = null;
          dy = 0;
        });
      })();

      /* ══════════ INIT ══════════ */
      addEventListener("DOMContentLoaded", () => {
        loadStatus();
        loadChannels();
        loadQnA();
        loadAnnBadge();
        registerFcmToken(false).catch((e) => console.error("FCM:", e));
        setInterval(() => {
          if (!document.hidden) loadAnnBadge();
        }, 30000);
      });
    </script>
  </body>
</html>
