<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pledge Handler · Riverside Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <style>
      :root {
        --ink: #e2e8f0;
        --paper: #0a0f1e;
        --surface: #0f172a;
        --lift: #1a2540;
        --wire: rgba(96, 165, 250, 0.18);
        --steel: #64748b;
        --lead: #94a3b8;
        --accent: #3b82f6;
        --accent2: #60a5fa;
        --gold: #facc15;
        --danger: #ef4444;
        --green: #10b981;
        --head: "Bebas Neue", Impact, sans-serif;
        --body:
          "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --bar: 54px;
        --top: env(safe-area-inset-top, 0px);
        --bot: env(safe-area-inset-bottom, 0px);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent2);
        outline-offset: 2px;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.18;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        background: var(--accent);
        top: -25vmax;
        left: -20vmax;
        animation: drift 18s ease-in-out infinite alternate;
      }
      body::after {
        background: #6366f1;
        bottom: -30vmax;
        right: -20vmax;
        animation: drift 22s ease-in-out infinite alternate-reverse;
      }
      @keyframes drift {
        to {
          transform: translate(8vmax, 6vmax) scale(1.15);
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes flash {
        0% {
          color: var(--gold);
          transform: scale(1.12);
        }
        100% {
          transform: none;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(var(--bar) + var(--top));
        padding: var(--top) max(10px, env(safe-area-inset-right)) 0
          max(10px, env(safe-area-inset-left));
        background: rgba(10, 15, 30, 0.85);
        border-bottom: 1px solid var(--wire);
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(16px);
      }
      .logo {
        font-family: var(--head);
        font-size: 1.3rem;
        letter-spacing: 0.08em;
        color: var(--accent2);
        white-space: nowrap;
      }
      .sp {
        flex: 1;
      }
      .ib {
        position: relative;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        background: none;
        border: 0;
        border-radius: 10px;
        color: var(--lead);
        cursor: pointer;
        transition: 0.2s;
        flex-shrink: 0;
        text-decoration: none;
      }
      .ib:hover {
        color: var(--accent2);
        background: var(--lift);
      }
      .ib:active {
        transform: scale(0.88);
      }
      .ib svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .ib.spinning svg {
        animation: spin 0.8s linear infinite;
      }

      #main {
        position: fixed;
        top: calc(var(--bar) + var(--top));
        left: 0;
        right: 0;
        bottom: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        z-index: 1;
        padding-bottom: calc(30px + var(--bot));
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 14px max(14px, env(safe-area-inset-left)) 10px
          max(14px, env(safe-area-inset-right));
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        background: linear-gradient(
          160deg,
          rgba(26, 37, 64, 0.7),
          rgba(15, 23, 42, 0.8)
        );
        border: 1px solid var(--wire);
        border-radius: 18px;
        padding: 14px;
        backdrop-filter: blur(8px);
      }
      .lbl {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--steel);
        margin: 10px 2px 6px;
      }
      .mut {
        color: var(--lead);
        font-size: 0.82rem;
      }

      .chips {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        padding: 8px 14px;
        border-radius: 99px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.28);
        color: var(--accent2);
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
      }
      .chip small {
        font-size: 0.74rem;
        opacity: 0.7;
      }
      .c-av {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }
      .s-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .s-av {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        object-fit: cover;
        border: 2px solid var(--wire);
        flex-shrink: 0;
      }
      .prev {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        object-fit: cover;
        border: 2px solid var(--wire);
        margin: 10px auto 0;
        display: block;
      }
      .chip:active {
        transform: scale(0.94);
      }
      .chip.hl {
        border-color: var(--gold);
        color: var(--gold);
        background: rgba(250, 204, 21, 0.08);
      }
      .btn {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 10px 16px;
        font-weight: 700;
        font-size: 0.84rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn:hover {
        background: #2563eb;
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .btn.ghost {
        background: rgba(96, 165, 250, 0.1);
        color: var(--accent2);
        border: 1px solid var(--wire);
      }
      .btn.danger {
        background: rgba(239, 68, 68, 0.14);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .btn.wide {
        width: 100%;
        margin-top: 10px;
      }

      /* summary */
      .s-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .cname {
        font-family: var(--head);
        font-size: 1.5rem;
        letter-spacing: 0.08em;
        color: var(--accent2);
        line-height: 1.1;
      }
      .total {
        font-family: var(--head);
        font-size: 3rem;
        letter-spacing: 0.04em;
        line-height: 1;
        margin-top: 6px;
        color: #fff;
      }
      .total.fl {
        animation: flash 0.7s;
      }
      .trio {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .trio div {
        background: var(--lift);
        border-radius: 12px;
        padding: 8px 10px;
        min-width: 0;
      }
      .trio span {
        display: block;
        font-size: 0.68rem;
        color: var(--steel);
        font-weight: 700;
      }
      .trio b {
        display: block;
        font-size: 0.88rem;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar {
        height: 7px;
        border-radius: 9px;
        background: var(--lift);
        overflow: hidden;
        margin-top: 12px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 9px;
        background: linear-gradient(90deg, var(--accent), var(--green));
        transition: width 0.5s cubic-bezier(0.2, 0.9, 0.25, 1);
      }

      /* toolbar + pager */
      #tools {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav .cnt {
        flex: 1;
        text-align: center;
        font-size: 0.8rem;
        color: var(--lead);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acts {
        display: flex;
        gap: 8px;
      }
      .acts .btn {
        flex: 1;
        padding: 10px 8px;
      }
      #pager {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        align-items: flex-start;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      #pager::-webkit-scrollbar {
        display: none;
      }
      .slide {
        flex: 0 0 100%;
        min-width: 0;
        scroll-snap-align: center;
        scroll-snap-stop: always;
      }
      .p-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .p-av {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #6366f1);
        display: grid;
        place-items: center;
        font-family: var(--head);
        font-size: 1.5rem;
        flex-shrink: 0;
      }
      .p-name {
        font-weight: 700;
        font-size: 1.05rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .p-top > div:nth-child(2) {
        flex: 1;
        min-width: 0;
      }
      .nums {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .nums div {
        background: var(--lift);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .nums span {
        font-size: 0.7rem;
        color: var(--steel);
        font-weight: 700;
      }
      .nums b {
        display: block;
        font-size: 1.08rem;
        margin-top: 2px;
      }
      .nums .bal b {
        color: var(--gold);
      }
      .nums .bal.done b {
        color: #34d399;
      }
      .plus {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin: 16px auto 4px;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--lead);
        font-size: 0.78rem;
      }
      .plus b {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #6366f1);
        color: #fff;
        font-size: 2rem;
        font-weight: 300;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 22px rgba(59, 130, 246, 0.35);
        transition: 0.2s;
      }
      .plus:active b {
        transform: scale(0.9);
      }
      .note {
        margin-top: 12px;
        padding: 8px 10px;
        background: var(--lift);
        border-radius: 10px;
        font-size: 0.82rem;
        color: var(--lead);
      }
      .rcpt {
        background: var(--paper);
        border: 1px dashed rgba(96, 165, 250, 0.35);
        border-radius: 12px;
        padding: 12px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.74rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--ink);
        user-select: text;
      }
      .row2 {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .row2 .btn {
        flex: 1;
      }
      .empty {
        text-align: center;
        padding: 26px 10px;
        color: var(--lead);
        line-height: 1.6;
        font-size: 0.9rem;
      }
      .empty b {
        display: block;
        font-family: var(--head);
        font-size: 1.6rem;
        letter-spacing: 0.08em;
        color: var(--accent2);
        font-weight: 400;
        margin-bottom: 4px;
      }

      /* sheet */
      #scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 1000;
      }
      #scrim.show {
        opacity: 1;
        pointer-events: auto;
      }
      #sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        width: min(640px, 100%);
        max-height: 86dvh;
        background: var(--surface);
        border: 1px solid var(--wire);
        border-radius: 22px 22px 0 0;
        z-index: 1001;
        transform: translate(-50%, 105%);
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.25, 1);
        display: flex;
        flex-direction: column;
      }
      #sheet.show {
        transform: translate(-50%, 0);
      }
      .grab {
        width: 42px;
        height: 4px;
        border-radius: 9px;
        background: var(--steel);
        margin: 9px auto 4px;
        opacity: 0.5;
      }
      .sh-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 18px;
      }
      .sh-h h3 {
        font-family: var(--head);
        font-size: 1.5rem;
        letter-spacing: 0.08em;
        color: var(--accent2);
        font-weight: 400;
      }
      #sh-b {
        overflow-y: auto;
        padding: 4px 16px calc(20px + var(--bot));
      }
      .fld {
        width: 100%;
        background: var(--paper);
        border: 1px solid var(--wire);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 0.95rem;
        margin-top: 8px;
        transition: 0.2s;
      }
      .fld:focus {
        border-color: var(--accent2);
        outline: 0;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
      }
      .fl-l {
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--steel);
        margin: 12px 2px 0;
        display: block;
      }
      .after {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(250, 204, 21, 0.08);
        color: var(--gold);
        font-size: 0.86rem;
      }
      .lrow {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        background: var(--lift);
        border: 1px solid var(--wire);
        border-radius: 14px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .lrow .p-av {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        font-size: 1.2rem;
      }
      .lrow > div:not(.p-av) {
        flex: 1;
        min-width: 0;
      }
      .lrow b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.94rem;
      }
      .lrow small {
        color: var(--lead);
        font-size: 0.78rem;
      }
      .tag {
        font-size: 0.7rem;
        font-weight: 800;
        padding: 3px 9px;
        border-radius: 99px;
        background: rgba(250, 204, 21, 0.12);
        color: var(--gold);
        white-space: nowrap;
      }
      .tag.ok {
        background: rgba(16, 185, 129, 0.18);
        color: #34d399;
      }

      #toast-area {
        position: fixed;
        top: calc(var(--bar) + var(--top) + 10px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        align-items: center;
      }
      .toast-msg {
        padding: 9px 16px;
        border-radius: 99px;
        font-size: 0.78rem;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        animation: pop 0.3s;
        max-width: 92vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast-msg.ok {
        background: rgba(16, 185, 129, 0.94);
      }
      .toast-msg.err {
        background: rgba(239, 68, 68, 0.94);
      }
      .toast-msg.inf {
        background: rgba(59, 130, 246, 0.94);
      }

      #gate {
        position: fixed;
        inset: 0;
        background: var(--paper);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      #gate .g-title {
        font-family: var(--head);
        font-size: 2rem;
        letter-spacing: 0.08em;
        color: var(--lead);
      }
      #gate .btn {
        width: 100%;
        max-width: 260px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        #pager {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <a href="index.html" class="ib" aria-label="Back"
        ><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg
      ></a>
      <div class="logo">PLEDGE HANDLER</div>
      <div class="sp"></div>
      <button class="ib" id="refresh-btn" data-a="refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
      </button>
    </header>

    <main id="main">
      <div class="wrap">
        <div class="chips" id="cats"></div>
        <section class="card" id="sum"></section>
        <div id="tools" hidden>
          <div class="nav">
            <button class="ib" data-a="prev" aria-label="Previous person">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
            </button>
            <div class="cnt" id="cnt"></div>
            <button class="ib" data-a="next" aria-label="Next person">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
            </button>
          </div>
          <div class="acts">
            <button class="btn ghost" data-a="list">All names</button>
            <button class="btn ghost" data-a="report">Report</button>
            <button class="btn" id="add-btn" data-a="adduser">+ Person</button>
          </div>
        </div>
        <div id="pager"></div>
      </div>
    </main>

    <div id="scrim"></div>
    <div id="sheet" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <div class="sh-h">
        <h3 id="sh-t"></h3>
        <button class="ib" id="sh-x" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div id="sh-b"></div>
    </div>

    <div id="gate">
      <div style="font-size: 3rem">🔐</div>
      <div class="g-title" id="g-t">CHECKING ACCESS</div>
      <p class="mut" id="g-s" style="max-width: 290px">
        Verifying your treasurer role…
      </p>
      <button class="btn" id="g-btn" hidden>Try again</button>
      <a href="index.html" class="mut" style="margin-top: 6px"
        >Back to Riverside Connect</a
      >
    </div>
    <div id="toast-area"></div>

    <script>
      "use strict";
      const API =
        "https://script.google.com/macros/s/AKfycbwWv2rfL2mpy-62lwwPDBFVvTklnu43tVQ-IHMz-FW_h58slnPLSRWQ8HhS2UJoVIym/exec";
      const ME = localStorage.getItem("userName") || "";
      if (!ME) location.href = "login.html";

      const $ = (s) => document.querySelector(s);
      const CUR = "KES",
        GAP = 12,
        CK = "rc_pl_cache";
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const num = (v) => {
        const n = parseFloat(String(v).replace(/,/g, ""));
        return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0;
      };
      const n2 = (n) =>
        (+n).toLocaleString("en-KE", { maximumFractionDigits: 2 });
      const fmt = (n) => CUR + " " + n2(n);
      const short = (n) => {
        const f = (v, u) => v / 10 + u;
        return n >= 1e6
          ? f(Math.floor(n / 1e5), "M")
          : n >= 1e3
            ? f(Math.floor(n / 100), "K")
            : String(Math.floor(n));
      };
      const same = (a, b) => String(a) === String(b);
      const gdrive = (l) => {
        const id = (l || "").match(/[-\w]{25,}/)?.[0];
        return id ? `https://lh3.googleusercontent.com/d/${id}` : "";
      };
      const ft = (ts) =>
        new Date(ts).toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        }) +
        ", " +
        new Date(ts).toLocaleTimeString("en-GB", {
          hour: "2-digit",
          minute: "2-digit",
        });
      function toast(m, t = "inf", d = 2600) {
        const e = document.createElement("div");
        e.className = "toast-msg " + t;
        e.textContent = m;
        $("#toast-area").appendChild(e);
        setTimeout(() => e.remove(), d);
      }
      async function copy(t) {
        try {
          await navigator.clipboard.writeText(t);
          toast("Report copied", "ok", 1500);
        } catch {
          const a = document.createElement("textarea");
          a.value = t;
          document.body.appendChild(a);
          a.select();
          try {
            document.execCommand("copy");
            toast("Report copied", "ok", 1500);
          } catch {
            toast("Could not copy", "err");
          }
          a.remove();
        }
      }

      /* ── backend (same API + operations as user.html) ── */
      async function get(params) {
        const r = await fetch(API + "?" + new URLSearchParams(params));
        return r.json();
      }
      async function post(body) {
        const r = await fetch(API, {
          method: "POST",
          body: JSON.stringify(body),
        });
        const d = await r.json();
        if (d.status !== "success") throw new Error(d.message || "Failed");
        return d;
      }

      /* ── state ── */
      let sets = [],
        ents = {},
        failed = {},
        idx = 0,
        lastTotal = null,
        Q = Promise.resolve();
      let active = localStorage.getItem("rc_pl_active") || "";
      const cur = () => sets.find((s) => same(s.id, active)) || sets[0];
      const canEdit = (s) => !!s && s.creator === ME;
      const ent = (id) => (ents[cur()?.id] || []).find((e) => same(e.id, id));
      const tot = (es, k) => es.reduce((a, e) => a + e[k], 0);
      const outst = (es) =>
        es.reduce((a, e) => a + Math.max(0, e.pledged - e.contributed), 0);
      const queue = (fn) => (Q = Q.then(fn, fn));
      const saveCache = () => {
        try {
          localStorage.setItem(CK, JSON.stringify({ sets, ents }));
        } catch {}
      };
      function loadCache() {
        try {
          const c = JSON.parse(localStorage.getItem(CK));
          if (c) {
            sets = c.sets || [];
            ents = c.ents || {};
          }
        } catch {}
      }

      async function fetchSets() {
        const d = await get({ operation: "getContributionSets" });
        sets = (d.sets || []).map((s) => ({
          id: s.id,
          name: s.name || "",
          description: s.description || "",
          creator: s.creator || "",
          picLink: s.picLink || "",
        }));
        Object.keys(ents).forEach((k) => {
          if (!sets.some((s) => same(s.id, k))) delete ents[k];
        });
        saveCache();
        render();
      }
      async function loadEntries(id) {
        try {
          const d = await get({
            operation: "getContributionEntries",
            contributionId: id,
          });
          ents[id] = (d.entries || []).map((e) => ({
            id: e.id,
            participant: e.participant || "",
            pledged: +e.pledged || 0,
            contributed: +e.contributed || 0,
            notes: e.notes || "",
          }));
          delete failed[id];
          saveCache();
        } catch {
          failed[id] = true;
        }
        renderChips();
        if (same(cur()?.id, id)) renderMain();
      }
      async function loadAll() {
        await fetchSets();
        await Promise.all(sets.map((s) => loadEntries(s.id)));
      }

      /* ── access (same rule as user.html: role must be treasurer) ── */
      function gate(t, s, retry) {
        $("#g-t").textContent = t;
        $("#g-s").textContent = s;
        $("#g-btn").hidden = !retry;
        $("#gate").hidden = false;
      }
      async function init() {
        gate("CHECKING ACCESS", "Verifying your treasurer role…", false);
        try {
          const d = await get({ operation: "getUserStatus", name: ME });
          const role = (d.role || "").trim().toLowerCase();
          if (role !== "treasurer")
            return gate(
              "TREASURER ONLY",
              "This page is for treasurers. Ask an admin to update your role.",
              false,
            );
        } catch {
          return gate(
            "NO CONNECTION",
            "Couldn't verify your access. Check your internet and try again.",
            true,
          );
        }
        $("#gate").hidden = true;
        loadCache();
        render();
        loadAll().catch(() => toast("Couldn't reach the server", "err"));
      }
      $("#g-btn").onclick = init;

      /* ── sheet ── */
      function openSheet(t, h) {

        $("#sh-b").innerHTML = h;

        $("#sheet").classList.add("show");

        $("#scrim").classList.remove("show");
        $("#sheet").classList.remove("show");
      }
      $("#scrim").onclick = $("#sh-x").onclick = closeSheet;
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSheet();

        if (e.key === "Enter" && e.target.tagName === "INPUT")

      /* ── report (one for the whole category) ── */
      function report(s, es) {
        const L = "━━━━━━━━━━━━━━━━━━━━━━",
          l = "──────────────────────";
        const P = tot(es, "pledged"),
          C = tot(es, "contributed"),
          O = outst(es);
        const rows = es.length
          ? es
              .map((e, i) => {
                const b = e.pledged - e.contributed;
                const bal = e.pledged > 0 ? n2(Math.max(0, b)) : "-";
                return `${i + 1}. ${e.participant}${e.pledged > 0 && b <= 0 ? " ✅" : ""}\n    Pledged ${e.pledged > 0 ? n2(e.pledged) : "-"} | Paid ${n2(e.contributed)} | Bal ${bal}`;
              })
              .join("\n")
          : "No members yet";
        const out = [
          L,
          "   RIVERSIDE CONNECT",
          "   CONTRIBUTION REPORT",
          L,
          `Category: ${s.name}`,
          `Date: ${ft(Date.now())}`,
          `Amounts in ${CUR}`,
          l,
          rows,
          l,
          `Members:      ${es.length}`,
          `Pledged:      ${n2(P)}`,
          `Contributed:  ${n2(C)}`,
          `Outstanding:  ${n2(O)}`,
        ];
        if (P > 0)
          out.push(
            `Collected:    ${Math.min(100, Math.round((C / P) * 100))}% of pledges`,
          );
        out.push(L, "Thank you & God bless 🙏");
        return out.join("\n");
      }

      /* ── render ── */

        renderChips();
        renderMain();

        sum.innerHTML = `<div class="s-head"><div class="s-left">${s.picLink ? `<img class="s-av" src="${esc(gdrive(s.picLink))}" alt="" onerror="this.remove()">` : ""}<div><div class="cname">${esc(s.name)}</div><div class="mut">Total contributed · by ${esc(s.creator || "—")}</div></div></div>${ce ? `<button class="ib" data-a="delcat" aria-label="Delete category"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" /></svg></button>` : ""}</div>
          <div class="total${lastTotal !== null && es && lastTotal !== total ? " fl" : ""}">${es ? fmt(total) : "…"}</div>
          <div class="trio"><div><span>Pledged</span><b>${es ? fmt(tot(es, "pledged")) : "…"}</b></div><div><span>Outstanding</span><b>${es ? fmt(outst(es)) : "…"}</b></div><div><span>People</span><b>${es ? es.length : "…"}</b></div></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          ${s.description ? `<div class="mut" style="margin-top:10px">${esc(s.description)}</div>` : ""}
          ${ce ? "" : `<div class="note">View only — this category was created by ${esc(s.creator)}.</div>`}`;
        if (es) lastTotal = total;
        if (!es) {
          pager.innerHTML = `<div class="card empty" style="flex:0 0 100%">${failed[s.id] ? "Couldn't load this category. Tap refresh to retry." : "Loading…"}</div>`;
          $("#cnt").textContent = "";
          return;
        }
        if (!es.length) {
          pager.innerHTML = `<div class="card empty" style="flex:0 0 100%"><b>NO ONE YET</b>${ce ? `Tap “+ Person” to add the first name in ${esc(s.name)}.` : "No members have been added yet."}</div>`;
          $("#cnt").textContent = "";
          return;
        }
        idx = Math.min(idx, es.length - 1);
        pager.innerHTML = es
          .map((e) => {
            const b = e.pledged - e.contributed,
              done = e.pledged > 0 && b <= 0;
            const pc =
              e.pledged > 0
                ? Math.min(100, (e.contributed / e.pledged) * 100)
                : e.contributed > 0
                  ? 100
                  : 0;
            return `<div class="slide"><div class="card">
            <div class="p-top"><div class="p-av">${esc((e.participant[0] || "?").toUpperCase())}</div><div><div class="p-name">${esc(e.participant)}</div><div class="mut">${e.pledged > 0 ? "Pledge " + fmt(e.pledged) : "No pledge set"}</div></div>${ce ? `<button class="ib" data-a="editm" data-m="${esc(e.id)}" aria-label="Edit person"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg></button>` : ""}</div>
            <div class="nums"><div><span>Contributed</span><b>${fmt(e.contributed)}</b></div><div class="bal${done ? " done" : ""}"><span>${e.pledged > 0 && b < 0 ? "Overpaid" : "Balance"}</span><b>${e.pledged <= 0 ? "—" : fmt(Math.abs(b))}</b></div></div>
            <div class="bar"><i style="width:${pc}%"></i></div>
            ${ce ? `<button class="plus" data-a="addamt" data-m="${esc(e.id)}"><b>+</b>Add amount</button>` : ""}
            ${e.notes ? `<div class="note">📝 ${esc(e.notes)}</div>` : ""}
          </div></div>`;
          })
          .join("");
        pager.scrollLeft = idx * (pager.clientWidth + GAP);
        updNav();
      }
      function updNav() {
        const es = ents[cur()?.id] || [];
        $("#cnt").textContent = es.length
          ? `${idx + 1} / ${es.length} · ${es[idx]?.participant || ""}`
          : "";
      }
      function goTo(i) {
        const n = (ents[cur()?.id] || []).length;
        if (!n) return;
        idx = Math.max(0, Math.min(n - 1, i));
        updNav();
        const p = $("#pager");
        p.scrollTo({ left: idx * (p.clientWidth + GAP), behavior: "smooth" });
      }
      let st;
      $("#pager").addEventListener("scroll", () => {
        clearTimeout(st);
        st = setTimeout(() => {
          const p = $("#pager"),
            i = Math.round(p.scrollLeft / (p.clientWidth + GAP));
          if (i !== idx && (ents[cur()?.id] || [])[i]) {
            idx = i;
            updNav();
          }
        }, 80);
      });

      /* ── sheets ── */
      function shrink(file) {
        return new Promise((res, rej) => {
          const img = new Image(),
            u = URL.createObjectURL(file);
          img.onload = () => {
            const k = Math.min(1, 640 / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            const x = c.getContext("2d");
            x.fillStyle = "#fff";
            x.fillRect(0, 0, c.width, c.height);
            x.drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(u);
            res({
              data: c.toDataURL("image/jpeg", 0.85).split(",")[1],
              name: file.name.replace(/\.[^.]+$/, "") + ".jpg",
            });
          };
          img.onerror = () => {
            URL.revokeObjectURL(u);
            rej(new Error("Could not read that image"));
          };
          img.src = u;
        });
      }
      function newCat() {
        openSheet(
          "New category",
          `<label class="fl-l" for="f1">Name</label><input class="fld" id="f1" placeholder="e.g. Building Fund" maxlength="40" />
          <label class="fl-l" for="f2">Description (optional)</label><input class="fld" id="f2" placeholder="What is it for?" maxlength="120" />
          <label class="fl-l" for="f3">Profile image (optional)</label><input class="fld" id="f3" type="file" accept="image/*" /><img id="prev" class="prev" alt="" hidden />
          <button class="btn wide" id="ok">Create category</button>`,
        );
        $("#f3").onchange = (ev) => {
          const f = ev.target.files[0],
            p = $("#prev");
          if (f) {
            p.src = URL.createObjectURL(f);
            p.hidden = false;
          } else p.hidden = true;
        };
        $("#ok").onclick = async () => {
          const name = $("#f1").value.trim();
          if (!name) return toast("Enter a category name", "err");
          const b = $("#ok");
          b.disabled = true;
          b.textContent = "Creating…";
          try {
            const file = $("#f3").files[0],
              img = file ? await shrink(file) : null;
            const before = sets.map((s) => String(s.id));
            await post({
              operation: "createContributionSet",
              creator: ME,
              name,
              description: $("#f2").value.trim(),
              imageData: img ? img.data : null,
              imageName: img ? img.name : null,
            });
            await fetchSets();
            const nw =
              sets.find((s) => !before.includes(String(s.id))) ||
              sets[sets.length - 1];
            if (nw) {
              active = nw.id;
              localStorage.setItem("rc_pl_active", active);
              ents[nw.id] = [];
              idx = 0;
              lastTotal = null;
              render();
            }
            closeSheet();
            toast("Category created", "ok");
          } catch (e) {
            toast("Error: " + e.message, "err");
            b.disabled = false;
            b.textContent = "Create category";
          }
        };
      }
      function addUser() {
        const s = cur();
        if (!canEdit(s)) return;
        openSheet(
          "Add person",
          `<label class="fl-l" for="f1">Name</label><input class="fld" id="f1" placeholder="Full name" maxlength="50" />
          <label class="fl-l" for="f2">Pledge amount (optional)</label><input class="fld" id="f2" inputmode="decimal" placeholder="${CUR} 0" />
          <label class="fl-l" for="f3">Already contributed (optional)</label><input class="fld" id="f3" inputmode="decimal" placeholder="${CUR} 0" />
          <button class="btn wide" id="ok">Add to ${esc(s.name)}</button><button class="btn ghost wide" id="next">Save &amp; add another</button>`,
        );
        const submit = async (more) => {
          const name = $("#f1").value.trim();
          if (!name) return toast("Enter a name", "err");
          const bs = [$("#ok"), $("#next")];
          bs.forEach((b) => (b.disabled = true));
          try {
            await post({
              operation: "addMultipleContributionEntries",
              contributionId: s.id,
              entries: [
                {
                  participantName: name,
                  pledged: num($("#f2").value),
                  contributed: num($("#f3").value),
                  notes: "",
                },
              ],
            });
            idx = (ents[s.id] || []).length;

            toast(name + " added", "ok");
            if (more) {
              ["#f1", "#f2", "#f3"].forEach((q) => ($(q).value = ""));
              bs.forEach((b) => (b.disabled = false));
              $("#f1").focus();
            } else closeSheet();
          } catch (e) {
            toast("Error: " + e.message, "err");
            bs.forEach((b) => (b.disabled = false));
          }

        $("#ok").onclick = () => submit(false);
        $("#next").onclick = () => submit(true);

      function addAmt(id) {
        const s = cur(),
          e = ent(id);
        if (!canEdit(s) || !e) return;
        const bal = e.pledged - e.contributed;
        openSheet(
          "Add amount",
          `<div class="mut"><b style="color:var(--ink)">${esc(e.participant)}</b>${e.pledged > 0 ? " · balance " + fmt(Math.max(0, bal)) : ""}</div>
          <input class="fld" id="f1" inputmode="decimal" placeholder="${CUR} 0" />
          <div class="after" id="aft" ${e.pledged > 0 ? "" : "hidden"}></div>
          ${bal > 0 ? `<button class="btn ghost wide" id="full">Pay full balance (${fmt(bal)})</button>` : ""}
          <button class="btn wide" id="ok">Save amount</button>`,
        );
        const upd = () => {
          const r = bal - num($("#f1").value);
          $("#aft").textContent =
            r >= 0 ? `Balance after: ${fmt(r)}` : `Overpaid by ${fmt(-r)}`;
        };
        $("#f1").oninput = upd;
        upd();
        if ($("#full"))
          $("#full").onclick = () => {
            $("#f1").value = bal;
            upd();
          };
        $("#ok").onclick = () => {
          const a = num($("#f1").value);
          if (!a) return toast("Enter an amount above 0", "err");
          e.contributed = Math.round((e.contributed + a) * 100) / 100; // live update
          const val = e.contributed,
            sid = s.id;

          renderChips();
          renderMain();
          saveCache();

            try {
              await post({
                operation: "bulkUpdateContributionEntries",

                updates: [
                  {
                    entryId: e.id,
                    participantName: e.participant,
                    pledged: e.pledged,
                    contributed: val,
                    notes: e.notes,

        $("#rp").textContent = report(s, es);
      }

      /* ── actions ── */
      const A = {
        cat: (t) => {
          active = t.dataset.id;
          localStorage.setItem("rc_pl_active", active);
          idx = 0;
          lastTotal = null;
          render();
        },
        newcat: newCat,
        adduser: addUser,
        list: listAll,
        report: openReport,
        addamt: (t) => addAmt(t.dataset.m),
        editm: (t) => editM(t.dataset.m),
        prev: () => goTo(idx - 1),
        next: () => goTo(idx + 1),
        go: (t) => {
          closeSheet();
          goTo(+t.dataset.i);
        },
        refresh: async () => {
          const b = $("#refresh-btn");
          b.classList.add("spinning");
          try {
            await loadAll();
            toast("Refreshed", "ok", 1400);
          } catch {
            toast("Couldn't reach the server", "err");
          }
          b.classList.remove("spinning");
        },
        delcat: async () => {
          const s = cur();
          if (
            !canEdit(s) ||
            !confirm(`Delete “${s.name}” with all its people and amounts?`)
          )
            return;
          try {
            await post({
              operation: "deleteContributionSet",
              contributionId: s.id,
              user: ME,
            });
            active = "";
            idx = 0;
            lastTotal = null;
            await fetchSets();
            toast("Category deleted", "inf");
          } catch (e) {
            toast("Error: " + e.message, "err");
          }
        },
        copyrep: () => {
          const s = cur();
          if (ents[s?.id]) copy(report(s, ents[s.id]));
        },
        sharerep: () => {
          const s = cur();
          if (!ents[s?.id]) return;
          const t = report(s, ents[s.id]);
          if (navigator.share) navigator.share({ text: t }).catch(() => {});
          else copy(t);
        },
      };
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-a]");
        if (t && A[t.dataset.a]) A[t.dataset.a](t);
      });

      init();
    </script>
  </body>
</html>
