<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Riverside Connect</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Riverside Connect" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="maskable_icon_x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="maskable_icon_x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="maskable_icon_x192.png"
    />
    <link rel="apple-touch-icon" href="maskable_icon_x192.png" />
    <meta property="og:title" content="Riverside Connect" />
    <meta
      property="og:description"
      content="Join the conversation in Riverside Connect – share thoughts, photos and videos with the community."
    />
    <meta
      property="og:image"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/maskable_icon_x192.png"
    />
    <meta
      property="og:url"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Riverside Connect" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Riverside Connect" />
    <meta
      name="twitter:image"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/maskable_icon_x192.png"
    />
    <style>
      :root {
        --bg-deep: #080d17;
        --bg-mid: #0d1525;
        --bg-surface: #111d30;
        --bg-glass: rgba(20, 32, 55, 0.65);
        --border-subtle: rgba(255, 255, 255, 0.07);
        --border-med: rgba(255, 255, 255, 0.12);
        --border-blue: rgba(80, 140, 240, 0.22);
        --accent: #e8a84c;
        --accent-dim: rgba(232, 168, 76, 0.18);
        --blue-main: #4a90e2;
        --blue-bright: #6babf5;
        --blue-dim: rgba(74, 144, 226, 0.18);
        --text-primary: #eef2f8;
        --text-secondary: #8a9cbf;
        --text-muted: #5a6a8c;
        --own-bg: linear-gradient(135deg, #1c3a6e, #1a4080);
        --own-border: rgba(107, 171, 245, 0.25);
        --danger: #e05252;
        --ok: #4ade80;
        --comp-h: 76px;
        --font-ui: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        --font-serif: "Instrument Serif", Georgia, serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        height: 100dvh;
        font-family: var(--font-ui);
        background: var(--bg-deep);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 80% 50% at 20% 10%,
            rgba(30, 60, 120, 0.35),
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 40% at 80% 90%,
            rgba(15, 40, 90, 0.25),
            transparent 55%
          );
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* header */
      header {
        position: relative;
        z-index: 100;
        flex-shrink: 0;
        background: rgba(8, 13, 23, 0.85);
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        border-bottom: 1px solid var(--border-subtle);
        padding: env(safe-area-inset-top, 0) 16px 0;
      }
      .hin {
        max-width: 860px;
        margin: 0 auto;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      #user-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid var(--accent);
        cursor: pointer;
        flex-shrink: 0;
        transition: box-shadow 0.2s;
      }
      #user-avatar:hover {
        box-shadow: 0 0 0 3px var(--accent-dim);
      }
      .logo {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 1.25rem;
        flex: 1;
        white-space: nowrap;
      }
      .logo span {
        color: var(--accent);
      }
      .hbtn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border-med);
        background: var(--bg-glass);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        text-decoration: none;
        flex-shrink: 0;
        position: relative;
        transition: 0.2s;
      }
      .hbtn:hover {
        border-color: var(--border-blue);
        color: var(--text-primary);
        background: var(--blue-dim);
      }
      .hbtn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .badge {
        position: absolute;
        top: -3px;
        right: -3px;
        background: var(--danger);
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
        min-width: 16px;
        height: 16px;
        border-radius: 8px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        border: 1.5px solid var(--bg-deep);
      }

      /* sub bar */
      #subbar {
        flex-shrink: 0;
        z-index: 10;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        max-width: 860px;
        width: 100%;
        margin: 0 auto;
        padding: 10px 20px 4px;
        font-size: 0.78rem;
        color: var(--text-muted);
      }
      #subbar b {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 1.15rem;
        color: var(--text-primary);
      }
      .sright {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sbtn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--border-med);
        background: var(--bg-glass);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .sbtn:hover,
      .sbtn.on {
        border-color: var(--border-blue);
        color: var(--blue-bright);
        background: var(--blue-dim);
      }
      .sbtn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5);
        animation: live 2.2s infinite;
      }
      #status.off i {
        background: var(--danger);
        animation: none;
      }
      @keyframes live {
        70% {
          box-shadow: 0 0 0 7px rgba(74, 222, 128, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
        }
      }

      /* search */
      #searchbar {
        display: none;
        flex-shrink: 0;
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: 4px 20px 6px;
      }
      #searchbar.open {
        display: block;
        animation: panelIn 0.25s both;
      }
      .sin {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-surface);
        border: 1px solid var(--border-med);
        border-radius: 999px;
        padding: 4px 6px 4px 14px;
        transition: 0.2s;
      }
      .sin:focus-within {
        border-color: var(--border-blue);
        box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.08);
      }
      #searchIn {
        flex: 1;
        min-width: 0;
        background: none;
        border: 0;
        outline: 0;
        color: var(--text-primary);
        font: inherit;
        font-size: 0.92rem;
        padding: 7px 0;
      }
      #searchIn::placeholder {
        color: var(--text-muted);
      }
      #scount {
        font-size: 0.72rem;
        color: var(--accent);
        white-space: nowrap;
      }

      /* feed */
      #feed {
        flex: 1;
        overflow-y: auto;
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: 10px 20px 90px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overscroll-behavior: contain;
      }
      #feed::-webkit-scrollbar {
        width: 5px;
      }
      #feed::-webkit-scrollbar-thumb {
        background: var(--border-subtle);
        border-radius: 3px;
      }
      .thread {
        background: var(--bg-glass);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 14px 14px 10px;
        backdrop-filter: blur(10px);
        flex-shrink: 0;
      }
      #feed.anim .thread {
        animation: rise 0.5s cubic-bezier(0.22, 0.68, 0, 1.15) both;
        animation-delay: calc(var(--i) * 55ms);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .msg {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        position: relative;
      }
      .msg.own .bub {
        background: var(--own-bg);
        border: 1px solid var(--own-border);
        border-radius: 16px;
        padding: 10px 12px;
      }
      .av {
        position: relative;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex-shrink: 0;
        background: hsl(var(--h) 45% 32%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
        border: 1.5px solid var(--border-med);
        overflow: hidden;
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .who {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 3px;
        font-size: 0.84rem;
        font-weight: 700;
      }
      .role {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.66rem;
        font-weight: 700;
        padding: 2px 8px 2px 6px;
        border-radius: 999px;
        letter-spacing: 0.02em;
      }
      .role svg {
        width: 11px;
        height: 11px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .role.admin {
        color: var(--accent);
        background: var(--accent-dim);
        border: 1px solid rgba(232, 168, 76, 0.35);
      }
      .role.member {
        color: var(--blue-bright);
        background: var(--blue-dim);
        border: 1px solid var(--border-blue);
      }
      .when {
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-left: auto;
      }
      .txt {
        font-size: 0.95rem;
        line-height: 1.55;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .txt a {
        color: var(--blue-bright);
      }
      .quote {
        border-left: 2.5px solid var(--blue-bright);
        background: rgba(0, 0, 0, 0.2);
        padding: 5px 10px;
        border-radius: 0 8px 8px 0;
        margin-bottom: 7px;
        font-size: 0.78rem;
        color: var(--text-secondary);
      }
      .quote b {
        color: var(--blue-bright);
      }
      .pic {
        display: block;
        max-width: 100%;
        max-height: 340px;
        border-radius: 12px;
        margin: 8px 0 4px;
        cursor: zoom-in;
        object-fit: cover;
        background: var(--bg-mid);
      }
      .vid {
        margin: 8px 0 4px;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        max-width: 520px;
      }
      .vid iframe {
        width: 100%;
        aspect-ratio: 16/9;
        min-height: 180px;
        border: 0;
        display: block;
      }
      .aud iframe {
        width: 100%;
        height: 80px;
        border: 0;
        margin-top: 8px;
      }
      .acts {
        display: flex;
        gap: 2px;
        margin-top: 5px;
        flex-wrap: wrap;
      }
      .acts button {
        background: none;
        border: 0;
        color: var(--text-muted);
        font-size: 0.74rem;
        font-weight: 600;
        padding: 5px 9px;
        border-radius: 8px;
        transition: 0.15s;
      }
      .acts button:hover {
        background: var(--blue-dim);
        color: var(--blue-bright);
      }
      .acts button.d:hover {
        background: rgba(224, 82, 82, 0.12);
        color: var(--danger);
      }
      .replies {
        margin: 8px 0 0 19px;
        padding-left: 16px;
        border-left: 2px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .replies .av {
        width: 30px;
        height: 30px;
        font-size: 0.78rem;
      }
      .more {
        align-self: flex-start;
        background: none;
        border: 0;
        color: var(--blue-bright);
        font-size: 0.78rem;
        font-weight: 600;
        padding: 2px 0;
      }
      .pending .bub,
      .pending .txt {
        opacity: 0.55;
      }
      .pending .when {
        color: var(--accent);
      }
      .failed .when {
        color: var(--danger);
      }
      .edit {
        width: 100%;
        min-height: 80px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-blue);
        border-radius: 10px;
        color: var(--text-primary);
        font: inherit;
        padding: 9px;
        resize: vertical;
        outline: 0;
      }
      .erow {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .erow button {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--border-med);
        background: none;
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.8rem;
      }
      .erow button.s {
        background: rgba(74, 222, 128, 0.15);
        border-color: rgba(74, 222, 128, 0.35);
        color: var(--ok);
      }
      .erow button.g {
        margin-left: auto;
        color: var(--accent);
        border-color: rgba(232, 168, 76, 0.35);
        background: var(--accent-dim);
      }
      .loadmore {
        align-self: center;
        padding: 9px 22px;
        border-radius: 999px;
        border: 1px solid var(--border-med);
        background: var(--bg-glass);
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.82rem;
      }
      .empty {
        margin: auto;
        text-align: center;
        padding: 50px 24px;
        color: var(--text-muted);
        font-size: 0.9rem;
        max-width: 320px;
        line-height: 1.55;
      }
      .empty .big {
        font-size: 2.6rem;
        display: block;
        margin-bottom: 10px;
        animation: float 3.5s ease-in-out infinite;
      }
      .empty h3 {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 1.4rem;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .empty .loadmore {
        margin-top: 14px;
        color: var(--accent);
        border-color: rgba(232, 168, 76, 0.35);
        background: var(--accent-dim);
      }
      .skel {
        height: 96px;
        border-radius: 20px;
        background: linear-gradient(
          100deg,
          var(--bg-glass) 30%,
          rgba(60, 90, 150, 0.25) 50%,
          var(--bg-glass) 70%
        );
        background-size: 200% 100%;
        animation: sh 1.4s infinite;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      #newpill {
        display: none;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 92px;
        z-index: 20;
        background: var(--accent);
        color: #1a1205;
        border: 0;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 8px 18px;
        border-radius: 999px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
        animation: pop 0.35s both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translate(-50%, -10px) scale(0.8);
        }
      }
      @keyframes float {
        50% {
          transform: translateY(-4px);
        }
      }
      @keyframes talk {
        50% {
          transform: scale(1.1) rotate(-6deg);
        }
      }

      /* composer (collapsible) */
      .composer {
        flex-shrink: 0;
        position: relative;
        z-index: 30;
        background: rgba(6, 10, 18, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--border-subtle);
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      }
      .cin {
        max-width: 860px;
        margin: 0 auto;
        border: 1px solid var(--border-med);
        border-radius: 22px;
        background: var(--bg-surface);
        overflow: hidden;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .cin:focus-within {
        border-color: var(--border-blue);
        box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.08);
      }
      #reply-preview,
      #preview-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        font-size: 0.8rem;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(74, 144, 226, 0.06);
      }
      #reply-preview strong {
        color: var(--blue-bright);
      }
      #reply-preview em,
      #reply-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .x {
        background: none;
        border: 0;
        color: var(--text-muted);
        font-size: 1rem;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .x:hover {
        color: var(--danger);
      }
      .x.g:hover {
        color: var(--accent);
      }
      #preview-bar img,
      #preview-bar video {
        height: 54px;
        border-radius: 8px;
      }
      .crow {
        display: flex;
        align-items: flex-start;
      }
      textarea#comment {
        display: block;
        flex: 1;
        min-width: 0;
        min-height: clamp(84px, 14vh, 130px);
        max-height: 38vh;
        padding: 14px 16px 6px;
        background: none;
        border: 0;
        outline: 0;
        resize: none;
        color: var(--text-primary);
        font: inherit;
        font-size: 1rem;
        line-height: 1.55;
      }
      textarea#comment::placeholder {
        color: var(--text-muted);
      }
      #colBtn {
        margin: 10px 10px 0 0;
        font-size: 1.1rem;
      }
      .cin.collapsed textarea#comment {
        min-height: 48px;
        height: 48px;
        padding: 12px 16px;
        overflow: hidden;
        cursor: text;
      }
      .cin.collapsed .tools,
      .cin.collapsed #colBtn {
        display: none;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px 10px 12px;
      }
      .tbtn {
        height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--border-subtle);
        background: none;
        color: var(--text-secondary);
        font-size: 0.82rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: 0.2s;
      }
      .tbtn:hover {
        border-color: var(--border-blue);
        color: var(--blue-bright);
        background: var(--blue-dim);
      }
      .tbtn.gr {
        color: var(--accent);
        border-color: rgba(232, 168, 76, 0.3);
      }
      .tbtn.gr:hover {
        background: var(--accent-dim);
        color: var(--accent);
      }
      .tbtn svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #count {
        margin-left: auto;
        font-size: 0.72rem;
        color: var(--text-muted);
      }
      #sendBtn {
        height: 42px;
        padding: 0 20px;
        border-radius: 999px;
        border: 0;
        color: #fff;
        font-weight: 700;
        font-size: 0.9rem;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }
      #sendBtn svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.4s;
      }
      #sendBtn:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        transform: translateY(-1px);
      }
      #sendBtn:hover svg {
        transform: translate(3px, -3px);
      }
      #sendBtn.fly svg {
        animation: fly 0.6s ease-in;
      }
      @keyframes fly {
        to {
          transform: translate(40px, -40px);
          opacity: 0;
        }
      }
      #sendBtn:disabled {
        opacity: 0.45;
      }
      .composer.locked .cin {
        opacity: 0.5;
        pointer-events: none;
      }

      /* ===== Grace: floating guide ===== */
      .gfab {
        position: fixed;
        right: 16px;
        bottom: calc(var(--comp-h) + 14px);
        z-index: 40;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 1.5px solid rgba(232, 168, 76, 0.55);
        background: radial-gradient(
          circle at 30% 25%,
          rgba(232, 168, 76, 0.4),
          rgba(17, 29, 48, 0.96)
        );
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        animation: float 3.8s ease-in-out infinite;
        transition: bottom 0.25s;
      }
      .gfab.on {
        animation: none;
        transform: scale(0.92);
      }
      .gfab::before {
        content: "";
        position: absolute;
        right: 1px;
        bottom: 3px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--ok);
        border: 2px solid var(--bg-deep);
      }
      .gfab.ping::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        animation: ring 1.4s ease-out infinite;
      }
      @keyframes ring {
        to {
          transform: scale(1.5);
          opacity: 0;
        }
      }
      #gwhisper {
        position: fixed;
        right: 78px;
        bottom: calc(var(--comp-h) + 20px);
        z-index: 41;
        max-width: min(270px, calc(100vw - 100px));
        background: rgba(17, 29, 48, 0.97);
        border: 1px solid rgba(232, 168, 76, 0.4);
        border-radius: 16px 16px 4px 16px;
        padding: 10px 14px;
        font-size: 0.82rem;
        line-height: 1.4;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateX(10px) scale(0.95);
        pointer-events: none;
        transition: 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
        cursor: pointer;
      }
      #gwhisper.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .gsheet {
        position: fixed;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: min(calc(100% - 24px), 500px);
        bottom: calc(var(--comp-h) + 76px);
        z-index: 45;
        background: rgba(14, 22, 38, 0.97);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--border-med);
        border-radius: 22px;
        padding: 14px 16px 10px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        max-height: 56vh;
        overflow-y: auto;
        opacity: 0;
        transform: translateY(16px) scale(0.97);
        pointer-events: none;
        transition: 0.28s cubic-bezier(0.22, 0.68, 0, 1.2);
      }
      .gsheet.open {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .ghead {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .gav {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        background: var(--accent-dim);
        border: 1.5px solid rgba(232, 168, 76, 0.5);
      }
      .gav.talk {
        animation: talk 0.5s ease-in-out infinite;
      }
      .gtitle {
        flex: 1;
        line-height: 1.2;
      }
      .gtitle b {
        font-size: 0.9rem;
        color: var(--accent);
        display: block;
      }
      .gtitle span {
        font-size: 0.7rem;
        color: var(--text-muted);
      }
      #gb {
        font-size: 0.92rem;
        line-height: 1.55;
        min-height: 2.8em;
      }
      .dots {
        display: inline-flex;
        gap: 4px;
        padding: 8px 0;
      }
      .dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: bounce 1s infinite;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: none;
          opacity: 0.4;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 12px;
      }
      .chips:empty {
        display: none;
      }
      .chip {
        border: 1px solid rgba(232, 168, 76, 0.35);
        background: var(--accent-dim);
        color: var(--accent);
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        animation: pop2 0.4s cubic-bezier(0.3, 1.5, 0.5, 1) both;
        animation-delay: calc(var(--c) * 60ms);
        transition: 0.15s;
      }
      .chip:hover {
        background: rgba(232, 168, 76, 0.3);
        transform: translateY(-1px);
      }
      .chip.pri {
        background: var(--accent);
        color: #1a1205;
        border-color: var(--accent);
      }
      @keyframes pop2 {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
      }
      .gfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border-subtle);
        font-size: 0.72rem;
        color: var(--text-muted);
      }
      #gback {
        background: none;
        border: 0;
        color: var(--text-secondary);
        font-size: 0.74rem;
        font-weight: 600;
        padding: 4px 6px;
        border-radius: 6px;
      }
      #gback:hover {
        color: var(--text-primary);
      }
      .gspot {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        animation: gring 1.2s ease-out 4;
        scroll-margin: 80px 0 280px;
      }
      @keyframes gring {
        0% {
          box-shadow: 0 0 0 0 rgba(232, 168, 76, 0.55);
        }
        100% {
          box-shadow: 0 0 0 14px rgba(232, 168, 76, 0);
        }
      }

      /* overlays */
      .ov {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(4, 8, 16, 0.82);
        backdrop-filter: blur(12px);
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .panel {
        background: var(--bg-surface);
        width: 100%;
        max-width: 400px;
        border-radius: 20px;
        padding: 26px 22px;
        border: 1px solid var(--border-med);
        animation: panelIn 0.3s cubic-bezier(0.22, 0.68, 0, 1.2) both;
        max-height: 90vh;
        overflow-y: auto;
      }
      @keyframes panelIn {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(20px);
        }
      }
      .ptitle {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 1.4rem;
        text-align: center;
        margin-bottom: 18px;
      }
      .opt {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px;
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.15s;
      }
      .opt.on {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .opt b {
        display: block;
        font-size: 0.9rem;
      }
      .opt small {
        color: var(--text-secondary);
        font-size: 0.78rem;
        line-height: 1.4;
      }
      .opt input {
        accent-color: var(--accent);
        margin-top: 3px;
      }
      .avr {
        width: 110px;
        height: 110px;
        margin: 0 auto 18px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid var(--accent);
        position: relative;
      }
      .avr img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avr label {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.8rem;
        font-weight: 700;
      }
      .avr:hover label {
        opacity: 1;
      }
      .lbl {
        font-size: 0.74rem;
        font-weight: 600;
        color: var(--text-muted);
        margin: 12px 0 6px;
        display: block;
      }
      .inp {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-med);
        color: var(--text-primary);
        font: inherit;
        outline: 0;
      }
      .code {
        font-family: "Courier New", monospace;
        color: var(--accent);
        background: rgba(0, 0, 0, 0.25);
        padding: 8px 12px;
        border-radius: 7px;
        display: inline-block;
        word-break: break-all;
      }
      .btns {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .btn {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border-med);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.88rem;
      }
      .btn.p {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border: 0;
        color: #fff;
      }
      .btn.r {
        background: var(--danger);
        border: 0;
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.55;
      }
      #lb img {
        max-width: 96vw;
        max-height: 90vh;
        border-radius: 12px;
        animation: panelIn 0.3s both;
      }
      #toasts {
        position: fixed;
        top: calc(70px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        width: max-content;
        max-width: 92vw;
      }
      .toast {
        background: var(--bg-surface);
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid var(--border-med);
        border-left: 3px solid var(--blue-main);
        font-size: 0.84rem;
        animation: tin 0.25s both;
      }
      .toast.error {
        border-left-color: var(--danger);
      }
      .toast.info {
        border-left-color: var(--accent);
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(-12px);
        }
      }
      @media (max-width: 520px) {
        #feed {
          padding: 8px 12px 90px;
        }
        .hin {
          gap: 7px;
        }
        .logo {
          font-size: 1.1rem;
        }
        .composer {
          padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        }
        #subbar {
          padding: 8px 14px 2px;
        }
        #searchbar {
          padding: 4px 14px 6px;
        }
        .tbtn span {
          display: none;
        }
        .tbtn {
          padding: 0 11px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="toasts"></div>

    <header>
      <div class="hin">
        <img id="user-avatar" src="" alt="Your profile" title="Your profile" />
        <div class="logo">Riverside <span>Connect</span></div>
        <button
          class="hbtn"
          id="setBtn"
          title="Data &amp; offline settings"
          aria-label="Settings"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
        </button>
        <a href="index.html" class="hbtn" title="Home" aria-label="Home"
          ><svg viewBox="0 0 24 24">
            <path d="M3 11l9-8 9 8" />
            <path d="M5 10v10h14V10" /></svg
        ></a>
        <a
          href="announce.html"
          class="hbtn"
          title="Announcements"
          aria-label="Announcements"
          ><svg viewBox="0 0 24 24">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg
          ><span id="ann-badge" class="badge">0</span></a
        >
        <button
          id="installAppBtn"
          class="hbtn"
          title="Install app"
          style="display: none"
          aria-label="Install app"
        >
          <svg viewBox="0 0 24 24">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" />
          </svg>
        </button>
      </div>
    </header>

    <div id="subbar">
      <b>Community pool</b>
      <div class="sright">
        <button
          class="sbtn"
          id="searchBtn"
          title="Search the pool"
          aria-label="Search the pool"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
        </button>
        <span id="status"><i></i><span id="stxt">Live</span></span>
      </div>
    </div>
    <div id="searchbar">
      <div class="sin">
        <input
          id="searchIn"
          type="search"
          placeholder="Search names or words…"
          autocomplete="off"
        />
        <span id="scount"></span>
        <button class="x" id="sclear" aria-label="Clear search">✕</button>
        <button
          class="x g"
          data-grace="search"
          aria-label="Search help from Grace"
          title="Ask Grace"
        >
          🕊️
        </button>
      </div>
    </div>
    <button id="newpill">↑ New messages</button>
    <main id="feed" aria-live="polite">
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
    </main>

    <section class="composer" id="composer">
      <div class="cin collapsed" id="cin">
        <div id="reply-preview">
          <span id="reply-text">Replying…</span
          ><button class="x" id="cancelReply" aria-label="Cancel reply">
            ✕
          </button>
        </div>
        <div id="preview-bar">
          <span id="fprev"></span
          ><button class="x" id="removeFile" aria-label="Remove file">✕</button>
        </div>
        <div class="crow">
          <textarea
            id="comment"
            placeholder="Share with the community…"
            rows="1"
          ></textarea>
          <button
            class="x"
            id="colBtn"
            aria-label="Collapse the writing box"
            title="Collapse"
          >
            ⌄
          </button>
        </div>
        <div class="tools">
          <input
            type="file"
            id="fileInput"
            accept="image/*,video/*,audio/*"
            hidden
          />
          <button class="tbtn" id="addFileBtn" title="Add photo or video">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="9" cy="9" r="2" />
              <path d="M21 15l-5-5L5 21" /></svg
            ><span>Photo / video</span>
          </button>
          <button
            class="tbtn gr"
            data-grace="compose"
            title="Writing help from Grace"
          >
            🕊️<span>Writing help</span>
          </button>
          <span id="count"></span>
          <button id="sendBtn">
            <span>Post</span
            ><svg viewBox="0 0 24 24">
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4z" />
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Grace -->
    <div id="gwhisper" role="status"></div>
    <button
      class="gfab"
      id="graceFab"
      data-grace="menu"
      aria-label="Ask Grace for help"
      title="Ask Grace"
    >
      🕊️
    </button>
    <aside class="gsheet" id="gsheet" aria-live="polite">
      <div class="ghead">
        <div class="gav" id="gav">🕊️</div>
        <div class="gtitle"><b>Grace</b><span>Riverside guide</span></div>
        <button
          class="x"
          id="gquiet"
          title="Mute or unmute Grace's little nudges"
          aria-label="Toggle nudges"
        >
          🔔
        </button>
        <button class="x" id="gclose" aria-label="Close Grace">✕</button>
      </div>
      <div id="gb"></div>
      <div class="chips" id="chips"></div>
      <div class="gfoot">
        <button id="gback">☰ All topics</button><span id="gstep"></span>
      </div>
    </aside>

    <div class="ov" id="profile-modal">
      <div class="panel">
        <h2 class="ptitle">Your profile</h2>
        <div class="avr">
          <img id="modal-avatar" src="" alt="" /><label for="modal-avatar-input"
            >Change</label
          ><input type="file" id="modal-avatar-input" accept="image/*" hidden />
        </div>
        <span class="lbl">Display name</span
        ><input class="inp" id="modal-name-input" placeholder="Your name" />
        <div
          id="modal-error"
          style="
            color: var(--danger);
            font-size: 0.8rem;
            min-height: 18px;
            margin-top: 6px;
          "
        ></div>
        <span class="lbl">Recovery code</span>
        <code id="recovery-code-display" class="code">…</code>
        <button
          class="btn"
          id="copy-recovery-btn"
          style="flex: none; padding: 7px 12px"
        >
          Copy
        </button>
        <p
          style="margin-top: 8px; font-size: 0.76rem; color: var(--text-muted)"
        >
          Save this code to recover your account.
        </p>
        <div class="btns">
          <button class="btn" id="modal-cancel-btn">Cancel</button
          ><button class="btn p" id="modal-save-btn">Save changes</button>
        </div>
      </div>
    </div>

    <div class="ov" id="settings">
      <div class="panel">
        <h2 class="ptitle">Loading &amp; offline</h2>
        <label class="opt" id="o-fast"
          ><input type="radio" name="dm" value="fast" /><span
            ><b>Fastest — show saved messages first</b
            ><small
              >Opens instantly from your phone's saved copy, then refreshes
              quietly.</small
            ></span
          ></label
        >
        <label class="opt" id="o-fresh"
          ><input type="radio" name="dm" value="fresh" /><span
            ><b>Always fetch fresh on open</b
            ><small
              >Waits for the latest messages every time. Falls back to saved
              copy when offline.</small
            ></span
          ></label
        >
        <small
          id="cacheinfo"
          style="color: var(--text-muted); display: block; margin: 4px 0 0"
        ></small>
        <div class="btns">
          <button class="btn r" id="clearCache">Clear saved data</button
          ><button class="btn p" id="setClose">Done</button>
        </div>
      </div>
    </div>

    <div class="ov" id="confirm">
      <div class="panel" style="max-width: 300px; text-align: center">
        <p style="font-weight: 700; margin-bottom: 6px" id="cq">
          Delete message?
        </p>
        <p style="font-size: 0.82rem; color: var(--text-muted)">
          This cannot be undone.
        </p>
        <div class="btns">
          <button class="btn" id="cxn">Cancel</button
          ><button class="btn r" id="cyes">Delete</button>
        </div>
      </div>
    </div>
    <div class="ov" id="lb" style="z-index: 3000">
      <img id="lbimg" alt="" />
    </div>
    <div class="ov" id="installModal" style="z-index: 9999">
      <div class="panel" style="max-width: 320px; text-align: center">
        <h2 class="ptitle">Install app</h2>
        <p style="font-size: 0.88rem; color: var(--text-secondary)">
          Add Riverside Connect to your home screen for faster access.
        </p>
        <div class="btns">
          <button id="installYes" class="btn p">Install</button
          ><button id="installNo" class="btn">Cancel</button>
        </div>
      </div>
    </div>
    <canvas id="cropCanvas" hidden></canvas>

    <script>
      const scriptUrl =
        "https://script.google.com/macros/s/AKfycby3qdljC5TNQo2xOFth13eMUm4JvpSA9yewJJ6n3xgc6J26pV_jzAeia6TGRI6ylZIe/exec";
      const $ = (id) => document.getElementById(id);
      const lsGet = (k) => {
        try {
          return localStorage.getItem(k);
        } catch (e) {
          return null;
        }
      };
      const lsSet = (k, v) => {
        try {
          localStorage.setItem(k, v);
          return true;
        } catch (e) {
          return false;
        }
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      const linkify = (s) =>
        esc(s).replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener">$1</a>',
        );
      const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

      let userName = lsGet("userName");
      if (!userName) location.href = "login.html";
      const CACHE_KEY = "rc_cached_comments_v1",
        PENDING_KEY = "rc_pending_drafts_v1",
        MODE_KEY = "rc_data_mode";
      const DEF_PH = "Share with the community…";
      let dataMode = lsGet(MODE_KEY) || "fast";
      let allComments = [],
        memberMap = {},
        cmap = {},
        isApproved = false,
        isOnline = navigator.onLine;
      let replyingTo = null,
        selectedFile = null,
        pollTimer = null,
        lastSig = "",
        editing = false,
        shown = 25,
        flushing = false,
        searchQ = "",
        lastCount = 0;
      const openT = new Set();
      const ICON_ADMIN =
        '<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>';
      const ICON_MEM =
        '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';

      /* ---------- helpers ---------- */
      const fileId = (u) => {
        const m = (u || "").match(/[-\w]{25,}/);
        return m ? m[0] : "";
      };
      const lh3 = (u) => {
        const i = fileId(u);
        return i ? `https://lh3.googleusercontent.com/d/${i}` : "";
      };
      const hue = (n) =>
        [...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
      function ago(t) {
        const m = Math.floor((Date.now() - t) / 6e4);
        if (m < 1) return "just now";
        if (m < 60) return m + "m ago";
        const h = Math.floor(m / 60);
        if (h < 24) return h + "h ago";
        const d = Math.floor(h / 24);
        return d < 7
          ? d + "d ago"
          : new Date(t).toLocaleDateString([], {
              month: "short",
              day: "numeric",
            });
      }
      function toast(m, t = "success") {
        const e = document.createElement("div");
        e.className = "toast " + t;
        e.textContent = m;
        $("toasts").appendChild(e);
        setTimeout(() => {
          e.style.opacity = "0";
          e.style.transition = ".3s";
          setTimeout(() => e.remove(), 300);
        }, 3200);
      }
      function ask(q, yes) {
        $("cq").textContent = q;
        $("confirm").style.display = "flex";
        $("cxn").onclick = () => ($("confirm").style.display = "none");
        $("cyes").onclick = () => {
          $("confirm").style.display = "none";
          yes();
        };
      }
      function avatar(name, pic) {
        const i = fileId(pic || memberMap[name]?.picLink);
        return `<span class="av" style="--h:${hue(name)}">${esc((name || "?")[0].toUpperCase())}${i ? `<img src="https://lh3.googleusercontent.com/d/${i}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
      }

      /* own avatar */
      const ua = $("user-avatar"),
        sp = lsGet("userPicLink");
      ua.src = sp
        ? lh3(sp) || sp
        : "data:image/svg+xml," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38"><rect width="38" height="38" fill="#1c3a6e"/><text x="19" y="25" font-size="18" text-anchor="middle" fill="#e8a84c" font-family="sans-serif">' +
              esc(userName[0] || "?").toUpperCase() +
              "</text></svg>",
          );

      /* ---------- threads: newest conversation first, newest reply first ---------- */
      function buildThreads(list) {
        const roots = [],
          byTs = {},
          byKey = {};
        const reg = (c, t) => {
          byTs[String(c.timestamp)] = t;
          byKey[c.name + "|" + c.comment] = t;
        };
        [...list]
          .sort((a, b) => a.timestamp - b.timestamp)
          .forEach((c) => {
            let t = null;
            if (c.replyTo)
              t =
                (c.replyTo.ts && byTs[String(c.replyTo.ts)]) ||
                byKey[c.replyTo.name + "|" + c.replyTo.text] ||
                null;
            if (t) {
              t.replies.push(c);
              t.last = Math.max(t.last, c.timestamp);
            } else {
              t = { root: c, replies: [], last: c.timestamp };
              roots.push(t);
            }
            reg(c, t);
          });
        roots.forEach((t) => t.replies.sort((a, b) => b.timestamp - a.timestamp));
        return roots.sort((a, b) => b.last - a.last);
      }

      /* ---------- rendering ---------- */
      function mediaHtml(c) {
        if (c.hasFile && !c.fileLink)
          return '<div class="quote">📎 Media waiting to upload…</div>';
        const l = c.fileLink;
        if (!l) return "";
        const t = c.fileType || "",
          x = l.toLowerCase();
        if (t.includes("video") || /\.(mp4|mov|webm|m4v)$/.test(x))
          return `<div class="vid"><iframe src="${esc(l)}" allowfullscreen loading="lazy" allow="autoplay;fullscreen;picture-in-picture"></iframe></div>`;
        if (t.includes("audio") || /\.(mp3|wav|ogg|aac|m4a)$/.test(x))
          return `<div class="aud"><iframe src="${esc(l)}" loading="lazy" allow="autoplay"></iframe></div>`;
        const s = lh3(l);
        return s
          ? `<img class="pic" data-a="zoom" data-src="${s}" src="${s}" alt="Shared photo" loading="lazy">`
          : "";
      }
      function msgHtml(c, isReply, rootText) {
        const own = c.name === userName,
          m = memberMap[c.name] || {},
          adm = !!m.isAdmin;
        const q =
          c.replyTo && c.replyTo.text !== rootText
            ? `<div class="quote"><b>@${esc(c.replyTo.name)}</b> ${esc((c.replyTo.text || "").slice(0, 70))}${(c.replyTo.text || "").length > 70 ? "…" : ""}</div>`
            : "";
        const when = c.failed
          ? "Failed — will retry"
          : c.pending
            ? "Sending…"
            : ago(c.timestamp);
        const acts = c.pending
          ? ""
          : `<div class="acts"><button data-a="reply" data-ts="${c.timestamp}">↩ Reply</button>${own ? `<button data-a="edit" data-ts="${c.timestamp}">Edit</button><button class="d" data-a="del" data-ts="${c.timestamp}">Delete</button>` : ""}</div>`;
        return `<div class="msg ${own ? "own" : ""} ${c.pending ? "pending" : ""} ${c.failed ? "failed" : ""}">${avatar(c.name, c.picLink)}<div class="body"><div class="bub"><div class="who"><span>${esc(c.name)}${own ? " (you)" : ""}</span><span class="role ${adm ? "admin" : "member"}">${adm ? ICON_ADMIN + "Admin" : ICON_MEM + "Member"}</span><span class="when" title="${new Date(c.timestamp).toLocaleString()}">${when}</span></div>${q}${mediaHtml(c)}<div class="txt" id="t-${c.timestamp}">${linkify(c.comment || "")}</div></div>${acts}</div></div>`;
      }
      function threadHtml(t, i) {
        const rs = t.replies,
          ts = String(t.root.timestamp),
          open = openT.has(ts),
          vis = open || rs.length <= 2 ? rs : rs.slice(0, 2);
        const rt = t.root.comment;
        return `<article class="thread" style="--i:${Math.min(i, 8)}">${msgHtml(t.root, false)}${rs.length ? `<div class="replies">${vis.map((r) => msgHtml(r, true, rt)).join("")}${rs.length > vis.length ? `<button class="more" data-a="more" data-ts="${ts}">View ${rs.length - vis.length} older ${rs.length - vis.length === 1 ? "reply" : "replies"}</button>` : ""}</div>` : ""}</article>`;
      }
      function matches(c, q) {
        if (q === ":media") return !!(c.fileLink || c.hasFile);
        return ((c.comment || "") + " " + (c.name || ""))
          .toLowerCase()
          .includes(q);
      }
      function render(keep, animate) {
        const f = $("feed"),
          y = f.scrollTop;
        const msgs = allComments.filter(
          (c) => !(c.comment || "").startsWith('{"type":"call"'),
        );
        cmap = {};
        msgs.forEach((c) => (cmap[c.timestamp] = c));
        let th = buildThreads(msgs);
        const q = searchQ.trim().toLowerCase();
        if (q)
          th = th.filter((t) => [t.root, ...t.replies].some((c) => matches(c, q)));
        lastCount = th.length;
        $("scount").textContent = q ? th.length + " found" : "";
        f.classList.toggle("anim", !!animate && !reduce);
        if (!th.length) {
          f.innerHTML = q
            ? `<div class="empty"><span class="big">🔎</span><h3>No match</h3>Nothing for “${esc(searchQ.trim())}”. Try one word, or a name.<br><button class="loadmore" data-grace="search">Ask Grace</button></div>`
            : `<div class="empty"><span class="big">🕊️</span><h3>Be the first to speak</h3>The pool is quiet. Share a thought, a prayer request or a photo.<br><button class="loadmore" data-grace="write">Ask Grace to help you start</button></div>`;
          return;
        }
        f.innerHTML =
          th.slice(0, shown).map(threadHtml).join("") +
          (th.length > shown
            ? `<button class="loadmore" data-a="older">Load older conversations</button>`
            : "");
        f.scrollTop = keep ? y : 0;
      }

      /* ---------- feed interactions ---------- */
      $("feed").addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        const a = b.dataset.a,
          ts = b.dataset.ts,
          c = cmap[ts];
        if (a === "reply" && c) setReply(c);
        else if (a === "more") {
          openT.add(ts);
          render(true);
        } else if (a === "older") {
          shown += 25;
          render(true);
        } else if (a === "zoom") {
          $("lbimg").src = b.dataset.src;
          $("lb").style.display = "flex";
        } else if (a === "edit" && c) {
          editing = true;
          $("t-" + ts).innerHTML =
            `<textarea class="edit" id="ef">${esc(c.comment)}</textarea><div class="erow"><button class="s" data-a="save" data-ts="${ts}">Save</button><button data-a="cancel">Cancel</button><button class="g" data-grace="editctx">🕊️ Help</button></div>`;
          $("ef").focus();
          whisper(
            "Edit mode: change the words, then tap Save. Cancel keeps the original.",
            "editctx",
            "edit",
          );
        } else if (a === "cancel") {
          editing = false;
          render(true);
        } else if (a === "save") saveEdit(ts);
        else if (a === "del")
          ask("Delete this message?", () =>
            post(
              { operation: "deleteComment", name: userName, timestamp: ts },
              "Message deleted",
            ),
          );
      });
      $("lb").onclick = () => ($("lb").style.display = "none");
      async function post(body, okMsg) {
        try {
          const r = await (
            await fetch(scriptUrl, {
              method: "POST",
              body: JSON.stringify(body),
            })
          ).json();
          if (r.status === "success") {
            toast(okMsg);
            editing = false;
            loadComments(false);
          } else toast(r.message || "Something went wrong", "error");
        } catch {
          toast("No connection. Try again when you are online.", "error");
        }
      }
      function saveEdit(ts) {
        const v = ($("ef")?.value || "").trim();
        if (v)
          post(
            {
              operation: "editComment",
              name: userName,
              timestamp: ts,
              newText: v,
            },
            "Message updated",
          );
      }

      /* ---------- search ---------- */
      let sT, sW;
      function openSearch(focus) {
        $("searchbar").classList.add("open");
        $("searchBtn").classList.add("on");
        if (focus) $("searchIn").focus();
      }
      function doSearch(q) {
        searchQ = q;
        $("searchIn").value = q;
        render(false);
      }
      $("searchBtn").onclick = () => {
        if ($("searchbar").classList.contains("open")) {
          $("searchbar").classList.remove("open");
          $("searchBtn").classList.remove("on");
          if (searchQ) doSearch("");
        } else openSearch(true);
      };
      $("searchIn").addEventListener("input", function () {
        clearTimeout(sT);
        clearTimeout(sW);
        sT = setTimeout(() => {
          searchQ = this.value;
          render(false);
        }, 180);
        sW = setTimeout(searchWhisper, 1000);
      });
      $("sclear").onclick = () => {
        doSearch("");
        $("searchIn").focus();
      };
      function searchWhisper() {
        if (!searchQ.trim()) return;
        whisper(
          lastCount
            ? lastCount +
                " conversation" +
                (lastCount > 1 ? "s" : "") +
                " found, newest first."
            : "Nothing matches. Try one word or a name.",
          "search",
          "sw" + searchQ,
        );
      }

      /* ---------- data: cache / load / poll ---------- */
      function saveCache(c) {
        lsSet(
          CACHE_KEY,
          JSON.stringify({
            comments: c.filter((x) => !x.pending),
            cachedAt: Date.now(),
          }),
        );
      }
      function readCache() {
        try {
          return JSON.parse(lsGet(CACHE_KEY) || "null");
        } catch (e) {
          return null;
        }
      }
      function getDrafts() {
        try {
          return JSON.parse(lsGet(PENDING_KEY) || "[]");
        } catch (e) {
          return [];
        }
      }
      function mergePending() {
        allComments = allComments.filter((c) => !c.pending);
        const ids = new Set(allComments.map((c) => String(c.timestamp)));
        getDrafts().forEach((p) => {
          if (!ids.has(String(p.timestamp)))
            allComments.push({
              name: userName,
              comment: p.comment,
              timestamp: p.timestamp,
              picLink: lsGet("userPicLink") || "",
              fileLink: "",
              fileType: "",
              hasFile: !!p.file,
              replyTo: p.replyTo || null,
              pending: true,
              failed: !!p.failed,
            });
        });
        allComments.sort((a, b) => a.timestamp - b.timestamp);
      }
      function setOnline(v) {
        const was = isOnline;
        isOnline = v;
        $("status").classList.toggle("off", !v);
        $("stxt").textContent = v ? "Live" : "Offline · saved copy";
        if (!was && v) flushDrafts();
        if (was !== v)
          whisper(
            v
              ? "Back online — syncing everything now."
              : "You're offline. Keep writing; I'll hold your posts safe and send them later.",
            "menu",
            "net" + v,
          );
      }
      async function loadComments(silent = true) {
        try {
          const d = await (
            await fetch(`${scriptUrl}?operation=getData`)
          ).json();
          if (d.offline || !d.comments) throw 0;
          setOnline(true);
          const fresh = [...d.comments].reverse(),
            sig = fresh.length + ":" + JSON.stringify(fresh).length;
          const changed = sig !== lastSig;
          lastSig = sig;
          allComments = fresh;
          saveCache(fresh);
          mergePending();
          if (changed && !editing) {
            const f = $("feed"),
              away = silent && f.scrollTop > 200;
            render(away, !silent);
            if (away && changed && allComments.length)
              $("newpill").style.display = "block";
          }
          if (getDrafts().length) flushDrafts();
        } catch (e) {
          setOnline(false);
          if (!allComments.length) loadCache();
        }
      }
      function loadCache() {
        const c = readCache();
        if (!c) {
          $("feed").innerHTML =
            '<div class="empty"><span class="big">📡</span><h3>No saved messages yet</h3>Connect once and everything will be saved for offline reading.</div>';
          return;
        }
        allComments = c.comments || [];
        mergePending();
        render(false, true);
      }
      $("newpill").onclick = () => {
        $("feed").scrollTo({ top: 0, behavior: "smooth" });
        $("newpill").style.display = "none";
      };
      $("feed").addEventListener("scroll", () => {
        if ($("feed").scrollTop < 80) $("newpill").style.display = "none";
      });
      function startPolling() {
        clearInterval(pollTimer);
        pollTimer = setInterval(() => loadComments(true), 8000);
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearInterval(pollTimer);
        else if (isApproved) {
          loadComments(true);
          startPolling();
        }
      });
      addEventListener("online", () => {
        toast("Back online — syncing…", "info");
        setOnline(true);
        if (isApproved) {
          loadComments(true);
          startPolling();
        }
      });
      addEventListener("offline", () => {
        setOnline(false);
        clearInterval(pollTimer);
      });
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.addEventListener("message", (e) => {
          if (e.data?.type === "FLUSH_PENDING_MESSAGES") flushDrafts();
        });

      /* ---------- composer collapse ---------- */
      const ta = $("comment"),
        sendBtn = $("sendBtn"),
        cin = $("cin"),
        composerEl = $("composer");
      function autoGrow() {
        if (cin.classList.contains("collapsed")) ta.style.height = "";
        else {
          ta.style.height = "auto";
          ta.style.height =
            Math.min(ta.scrollHeight, innerHeight * 0.38) + "px";
        }
        const n = ta.value.length;
        $("count").textContent = n > 200 ? n + " characters" : "";
      }
      function setComposer(open) {
        cin.classList.toggle("collapsed", !open);
        autoGrow();
      }
      function maybeCollapse() {
        if (ta.value.trim() || selectedFile || replyingTo) return;
        if (cin.contains(document.activeElement)) return;
        if ($("gsheet").classList.contains("open")) return;
        setComposer(false);
      }
      cin.addEventListener("click", () => {
        if (cin.classList.contains("collapsed")) {
          setComposer(true);
          ta.focus();
        }
      });
      cin.addEventListener("focusin", () => {
        if (cin.classList.contains("collapsed")) setComposer(true);
        if (!ta.value.trim() && !replyingTo && !selectedFile)
          whisper(
            "Stuck for words? Tap Writing help for starters.",
            "compose",
            "co",
          );
      });
      cin.addEventListener("focusout", () => setTimeout(maybeCollapse, 200));
      document.addEventListener("pointerdown", (e) => {
        if (!cin.contains(e.target)) setTimeout(maybeCollapse, 150);
      });
      $("colBtn").onclick = () => {
        ta.blur();
        setComposer(false);
      };
      new ResizeObserver(() =>
        document.documentElement.style.setProperty(
          "--comp-h",
          composerEl.offsetHeight + "px",
        ),
      ).observe(composerEl);

      /* ---------- sending + offline queue ---------- */
      function queueDraft(text, file) {
        const p = getDrafts();
        p.push({
          localId: "l" + Date.now(),
          timestamp: Date.now(),
          comment: text,
          replyTo: replyingTo,
          file: file || null,
          failed: false,
        });
        if (!lsSet(PENDING_KEY, JSON.stringify(p))) {
          p.pop();
          if (file) {
            toast(
              "Not enough space to save this media offline. Send it when online.",
              "error",
            );
            return false;
          }
          lsSet(PENDING_KEY, JSON.stringify(p));
        }
        mergePending();
        render(false);
        try {
          navigator.serviceWorker.ready.then(
            (r) => r.sync && r.sync.register("sync-pending-messages"),
          );
        } catch (e) {}
        return true;
      }
      async function flushDrafts() {
        if (flushing) return;
        flushing = true;
        try {
          let p = getDrafts();
          for (const d of [...p]) {
            try {
              const r = await (
                await fetch(scriptUrl, {
                  method: "POST",
                  body: JSON.stringify({
                    operation: "postComment",
                    name: userName,
                    comment: d.comment,
                    file: d.file,
                    replyTo: d.replyTo,
                  }),
                })
              ).json();
              if (r.status === "success") {
                p = p.filter((x) => x.localId !== d.localId);
                lsSet(PENDING_KEY, JSON.stringify(p));
              } else if (r.status === "queued" || r.offline) break;
              else d.failed = true;
            } catch (e) {
              break;
            }
          }
          lsSet(PENDING_KEY, JSON.stringify(p));
        } finally {
          flushing = false;
        }
        loadComments(false);
      }
      let okShown = false;
      async function sendMessage() {
        const text = ta.value.trim();
        if (!text && !selectedFile) return;
        if (!isApproved) {
          toast("Your account is awaiting approval", "error");
          return;
        }
        const file = selectedFile,
          reply = replyingTo;
        sendBtn.disabled = true;
        sendBtn.classList.add("fly");
        const done = () => {
          ta.value = "";
          ta.placeholder = DEF_PH;
          clearFile();
          cancelReply();
          okShown = false;
          ta.blur();
          setComposer(false);
        };
        if (!isOnline) {
          if (queueDraft(text, file)) {
            done();
            toast(
              "Offline — saved. It will post automatically when you reconnect.",
              "info",
            );
          }
        } else
          try {
            const r = await (
              await fetch(scriptUrl, {
                method: "POST",
                body: JSON.stringify({
                  operation: "postComment",
                  name: userName,
                  comment: text,
                  file,
                  replyTo: reply,
                }),
              })
            ).json();
            if (r.status === "success") {
              done();
              toast("Posted");
              await loadComments(false);
              $("feed").scrollTop = 0;
            } else if (r.status === "queued" || r.offline) {
              setOnline(false);
              if (queueDraft(text, file)) {
                done();
                toast("Saved to send later", "info");
              }
            } else toast(r.message || "Could not post", "error");
          } catch (e) {
            setOnline(false);
            if (queueDraft(text, file)) {
              done();
              toast("Connection lost — saved to send later", "info");
            }
          }
        setTimeout(() => {
          sendBtn.classList.remove("fly");
          sendBtn.disabled = false;
        }, 650);
      }
      sendBtn.onclick = sendMessage;
      ta.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          !e.shiftKey &&
          !/Mobi|Android/i.test(navigator.userAgent)
        ) {
          e.preventDefault();
          sendMessage();
        }
      });
      let gT;
      ta.addEventListener("input", () => {
        autoGrow();
        clearTimeout(gT);
        gT = setTimeout(typingWhisper, 900);
      });

      /* ---------- reply + media ---------- */
      function setReply(c, noFocus) {
        replyingTo = { name: c.name, text: c.comment || "", ts: c.timestamp };
        $("reply-text").innerHTML =

        $("reply-preview").style.display = "flex";
        setComposer(true);

          "Replying to " + c.name + ". Tap me for a kind opener.",

      function cancelReply() {
        replyingTo = null;

      $("cancelReply").onclick = cancelReply;
      function clearFile() {
        selectedFile = null;

      $("removeFile").onclick = clearFile;
      $("addFileBtn").onclick = () => $("fileInput").click();
      function compress(file) {
        return new Promise((res) => {
          if (!file.type.startsWith("image/") || file.type === "image/gif") {
            const r = new FileReader();
            r.onload = (e) => res({ url: e.target.result, type: file.type });
            r.readAsDataURL(file);
            return;
          }
          const img = new Image(),
            u = URL.createObjectURL(file);
          img.onload = () => {
            const s = Math.min(1, 1400 / Math.max(img.width, img.height)),
              c = document.createElement("canvas");
            c.width = img.width * s;
            c.height = img.height * s;
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(u);
            res({ url: c.toDataURL("image/jpeg", 0.82), type: "image/jpeg" });
          };
          img.src = u;
        });
      }
      $("fileInput").addEventListener("change", async function () {
        const f = this.files[0];

          this.value = "";
          return;
        }
        const { url, type } = await compress(f);
        selectedFile = {
          base64: url.split(",")[1],
          type,
          name:
            f.name.replace(/\.\w+$/, "") +
            (type === "image/jpeg" && !/jpe?g$/i.test(f.name)

          ? `<video src="${url}" muted></video>`
          : type.startsWith("audio")
            ? `<audio src="${url}" controls style="height:36px"></audio>`
            : `<img src="${url}" alt="">`;
        $("preview-bar").style.display = "flex";
        setComposer(true);
        whisper(
          "Lovely! Add a few words so people know the story behind it.",
          "compose",
          "file",

      /* =====================================================
         GRACE — rule-based, human-like guide
         • whispers: short, rare, contextual nudges (auto-fade)
         • sheet: opens on tap, walks the user through a topic
         • spotlight: glows on the exact control she talks about
         ===================================================== */
      const gb = $("gb"),
        chipsEl = $("chips"),
        gav = $("gav"),
        sheet = $("gsheet"),
        wh = $("gwhisper"),
        gfab = $("graceFab");
      const first = () => (userName || "friend").split(" ")[0];
      const greet = () => {
        const h = new Date().getHours();
        return h < 12
          ? "Good morning"
          : h < 18
            ? "Good afternoon"
            : "Good evening";
      };
      let gTyping,
        whT,
        lastWh = "",
        lastWhAt = 0,
        spotEl = null,
        spotT,
        quiet = lsGet("rc_grace_quiet") === "1";
      $("gquiet").textContent = quiet ? "🔕" : "🔔";

      /* ----- tone helpers ----- */
      const kindOf = (t) => {
        t = (t || "").toLowerCase();
        if (/\?|how |why |what |where |who |anyone|can i|should/.test(t))
          return "q";
        if (
          /pray|sick|heal|sad|hurt|struggl|lost|grief|tired|worr|anxi|difficult|hard time/.test(
            t,
          )
        )
          return "p";
        if (
          /thank|praise|glory|blessed|amen|grateful|testimon|god is good/.test(
            t,
          )
        )
          return "g";
        if (
          /birthday|congrat|wedding|born|graduat|promot|anniversar|new job/.test(
            t,
          )
        )
          return "c";
        return "x";
      };
      const REPLY = {
        q: [
          "asked something. A clear, kind answer helps most.",
          [
            "Great question — ",
            "Here is what I think: ",
            "I am not sure, but ",
          ],
        ],
        p: [
          "may need some care right now. Keep it short, warm and honest.",
          ["Praying for you, ", "You are not alone, ", "Standing with you 🙏 "],
        ],
        g: [
          "is sharing good news. Celebrate with them!",
          ["Amen! ", "Glory to God 🙌 ", "So glad to hear this, "],
        ],
        c: [
          "has something to celebrate. A little joy goes a long way.",
          ["Congratulations, ", "So happy for you! 🎉 ", "God bless you, "],
        ],
        x: [
          "shared a thought. Say what stood out to you so the reply feels personal.",
          [
            "Thanks for sharing, ",
            "Well said — ",
            "I see it a bit differently: ",
          ],
        ],
      };
      const MODES = [
        {
          l: "💭 Share a thought",
          t: "Something on my heart today: ",
          ph: "What is on your heart?",
        },
        { l: "❓ Ask a question", t: "Question: ", ph: "Ask the community…" },
        {
          l: "🙏 Prayer request",
          t: "Prayer request: ",
          ph: "How can we pray with you?",
        },
        {
          l: "🎉 Testimony",
          t: "Testimony: ",
          ph: "Tell us what God has done…",
        },
        { l: "💛 Encourage", t: "Be encouraged: ", ph: "Lift someone up…" },
        { l: "🖼️ Photo / video", act: "attach" },
      ];
      const sentence = (v) =>
        v
          .toLowerCase()
          .replace(/(^\s*|[.!?]\s+)([a-z])/g, (m, a, b) => a + b.toUpperCase());
      function analyze(t) {
        const rn = replyingTo ? replyingTo.name : "";
        if (t.length > 12 && t === t.toUpperCase() && /[A-Z]/.test(t))
          return {
            k: "caps",
            text: "All caps can sound like shouting. Lowercase reads warmer.",
            fix: { l: "Soften it", fn: sentence },
          };
        if ((t.match(/!/g) || []).length > 3)
          return {
            k: "exc",
            text: "So much energy! One or two exclamation marks carry it just as well.",
            fix: {
              l: "Tone down the !",
              fn: (v) => {
                let n = 0;
                return v.replace(/!/g, () => (++n <= 2 ? "!" : "."));
              },
            },
          };
        if (t.length < 12)
          return {
            k: "short",
            text: replyingTo
              ? "Add a little more for " +
                rn +
                " — even one extra sentence makes it personal."
              : "A bit more detail helps people respond. What's the story behind it?",
          };
        if (t.length > 350 && !/\n/.test(t))
          return {
            k: "long",
            text: "That's a lot in one block. Short paragraphs are easier to read (Shift + Enter makes a new line).",
            fix: {
              l: "Split into paragraphs",
              fn: (v) => {
                let c = 0;
                return v.replace(/([.!?])\s+/g, (m, p) =>
                  ++c % 3 === 0 ? p + "\n\n" : m,
                );
              },
            },
          };
        if (/\?\s*$/.test(t))
          return {
            k: "qq",
            text: "Clear questions get quicker answers. Looks good — ready when you are.",
          };
        return {
          k: "ok",
          text: replyingTo
            ? "That feels kind, " + first() + ". Tap Post to reply to " + rn + "."
            : "Looks good, " + first() + ". Tap Post when you're ready to share.",

      /* ----- whispers ----- */
      function whisper(text, topic, key) {
        if (quiet || sheet.classList.contains("open")) return;
        const now = Date.now();
        if (key && key === lastWh && now - lastWhAt < 20000) return;
        lastWh = key || text;
        lastWhAt = now;
        wh.textContent = text;
        wh.dataset.topic = topic || "menu";

      wh.onclick = () => gOpen(wh.dataset.topic);
      function typingWhisper() {
        const t = ta.value.trim();

          whisper(a.text, "compose", "t" + a.k);
        else if (t.length > 25 && !okShown) {
          okShown = true;

      /* ----- spotlight ----- */

      /* ----- sheet engine ----- */
      function setChips(list) {

          const b = document.createElement("button");
          b.className = "chip" + (c.cls ? " " + c.cls : "");
          b.style.setProperty("--c", i);
