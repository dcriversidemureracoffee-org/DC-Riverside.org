   <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
html, body {
  width: 100%;
  overflow-x: hidden; /* This kills the horizontal swipe */
  position: relative;
  margin: 0;
  padding: 0;
}

   body {
  height: 100dvh;                   /* modern phones — dynamic viewport */
  min-height: -webkit-fill-available;  /* important iOS fallback */
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      border-bottom: 1px solid rgba(96, 165, 250, 0.15);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #60a5fa;
      font-weight: 600;
    }

   .chat-container {
      flex: 1; /* Takes up all available space between header and input */
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 20px;
      overflow-y: auto; /* Scroll happens here */
      display: flex;
      flex-direction: column;
      gap: 1rem;
      /* Remove the large padding-bottom since input is no longer floating */
    }

    .message {
      display: flex;
      align-items: flex-start;
      max-width: 80%;
      gap: 12px;
      animation: fadeIn 0.4s ease-out;
    }

    .message.own {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #60a5fa;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25);
    }

    .message-content {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(6px);
      padding: 12px 16px;
      border-radius: 18px;
      border-top-left-radius: 4px;
      max-width: calc(100% - 54px);
      position: relative;
    }

    .message.own .message-content {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: white;
      border-top-left-radius: 18px;
      border-top-right-radius: 4px;
    }

    .name {
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .message.own .name {
      color: white;
      opacity: 0.9;
    }

    .text {
      word-break: break-word;
      line-height: 1.4;
    }

    .time {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 6px;
      opacity: 0.8;
      display: block;
    }

    .message.own .time {
      color: rgba(255,255,255,0.7);
    }

  .input-area {
  background: rgba(15, 23, 42, 0.98);
  padding: 12px; /* Uniform padding */
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid rgba(96, 165, 250, 0.3);
  flex-shrink: 0;
  width: 100%;
  box-sizing: border-box; /* Crucial: includes padding in the 100% width */
}

.input-wrapper {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  gap: 8px; /* Slightly tighter for mobile */
  align-items: center;
  width: 100%;
}

#comment {
  flex: 1;
  min-width: 0; /* Prevents input from pushing flex container wide */
  padding: 12px 16px;
  border-radius: 24px;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 16px; /* Prevents iOS zoom-on-focus */
  border: none;
  outline: none;
}
    #comment:focus {
      background: rgba(255,255,255,0.14);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.3);
    }

    #comment::placeholder {
      color: #94a3b8;
    }

    button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar styling */
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }

    .chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(96, 165, 250, 0.4);
      border-radius: 3px;
    }
/* Media Rendering in Chat */
  .media-content {
    margin-top: 10px;
    border-radius: 8px;
    overflow: hidden;
    max-width: 100%;
    display: block;
  }
  .media-content img, .media-content video {
    max-width: 100%;
    max-height: 300px;
    display: block;
    border-radius: 8px;
  }

  /* Preview bar above input */
  #preview-bar {
    display: none;
    padding: 10px 20px;
    background: rgba(30, 41, 59, 0.9);
    border-top: 1px solid #60a5fa;
    align-items: center;
    gap: 15px;
  }
  #preview-bar img, #preview-bar video {
    height: 50px;
    border-radius: 4px;
  }
  .msg-actions {
  display: flex;
  gap: 10px;
  margin-top: 5px;
  opacity: 0;
  transition: opacity 0.2s;
}
.message.own:hover .msg-actions {
  opacity: 1;
}
.action-btn {
  font-size: 0.75rem;
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  width: auto; height: auto; /* Reset global button styles */
  padding: 2px 5px;
}
.action-btn:hover {
  color: white;
  transform: none; box-shadow: none; /* Reset global hover */
}
.delete-btn:hover { color: #f87171; }

/* Toast Notifications Container */
#toast-container {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 1000; display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: #1e293b; color: white; padding: 12px 24px; border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-left: 4px solid #3b82f6;
  animation: slideDown 0.3s ease forwards; min-width: 250px;
  display: flex; align-items: center; gap: 10px;
}
.toast.error { border-left-color: #ef4444; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

/* Inline Edit Field */
.edit-input {
  width: 100%; background: rgba(255,255,255,0.1); border: 1px solid #60a5fa;
  color: white; border-radius: 8px; padding: 8px; font-family: inherit;
  outline: none; margin-bottom: 5px; resize: none;
}
.edit-controls { display: flex; gap: 5px; }
.message-content .text {
  margin-top: 10px;
  line-height: 1.55;
}
/* Make video messages wider than text-only messages */
.message:has(.video-container) {
  max-width: 92%;               /* ← wider than normal 80% */
}

.message:has(.video-container) .message-content {
  max-width: 100%;              /* let it take full available width */
  min-width: 260px;             /* minimum comfortable size for vertical videos */
  width: 100%;
}

/* Center the video nicely when it's pushed */
.video-container {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  margin: 8px 0;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

/* Remove forced positioning - let iframe be normal block */
.video-container iframe {
  width: 100%;
  height: auto;
  min-height: 200px;
  max-height: 65vh;
  aspect-ratio: 16/9;           /* fallback for horizontal */
  display: block;
  border: none;
}

/* Reply Preview Bar above input */
#reply-preview {
  display: none;
  background: rgba(30, 41, 59, 0.95);
  padding: 10px 20px;
  border-left: 4px solid #60a5fa;
  justify-content: space-between;
  align-items: center;
}

.reply-info {
  font-size: 0.85rem;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.reply-info b { color: #60a5fa; }

/* Quoted message inside a comment */
.quoted-msg {
  background: rgba(0, 0, 0, 0.2);
  border-left: 3px solid #60a5fa;
  padding: 6px 10px;
  border-radius: 4px;
  margin-bottom: 8px;
  font-size: 0.85rem;
  color: #94a3b8;
}
.message.own .quoted-msg {
  background: rgba(255, 255, 255, 0.15);
  border-left-color: white;
  color: #e2e8f0;
}

/* Update this part to make buttons show for all messages on hover */
.message:hover .msg-actions {
  opacity: 1;
}

/* Optional: Make the reply button a slightly different color to stand out */
.reply-btn:hover {
  color: #60a5fa;
}

/* Audio container - similar to video for embedding Drive preview */
.audio-container {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  margin: 8px 0;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}

.audio-container iframe {
  width: 100%;
  height: 80px; /* Shorter height for audio players */
  border: none;
}

/* Make audio messages take appropriate width */
.message:has(.audio-container) {
  max-width: 85%; /* Moderate width, between text and video */
}

.message:has(.audio-container) .message-content {
  max-width: 100%;
  min-width: 220px;
  width: 100%;
}

/* ==============================================
   RESPONSIVE ADJUSTMENTS - Mobile-first
   ============================================== */

/* Extra small phones (portrait) - up to ~390px (iPhone SE, etc.) */
@media (max-width: 390px) {
  body {
    font-size: 0.95rem; /* Slightly smaller base font */
  }

  header {
    padding: 10px 14px;
  }

  h1 {
    font-size: 1.3rem;
  }

  .chat-container {
    padding: 12px 14px;
    gap: 0.8rem;
  }

  .message {
    max-width: 92%;          /* Even wider on tiny screens */
    gap: 8px;
  }

  .avatar {
    width: 36px;
    height: 36px;
  }

  .message-content {
    padding: 10px 14px;
    max-width: calc(100% - 50px);
  }

  .input-area {
    padding: 12px 14px;
  }

  #comment {
    font-size: 0.95rem;
    padding: 12px 16px;
  }

  button {
    width: 46px;
    height: 46px;
    font-size: 1.1rem;
  }

  .media-content img,
  .media-content video {
    max-height: 240px;      /* Smaller media on very small screens */
  }

  .video-container iframe {
    min-height: 160px;
  }

  .audio-container iframe {
    height: 70px;
  }
}

/* Small phones & typical mobile landscape (up to ~480-500px) */
@media (max-width: 500px) {
  .header-content {
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
  }

  .header-content > div:last-child {
    gap: 12px;
  }

  .message {
    max-width: 90%;
  }

  .name {
    font-size: 0.85rem;
  }

  .time {
    font-size: 0.68rem;
  }

  .msg-actions {
    font-size: 0.7rem;
  }

  .input-wrapper {
    gap: 8px;
  }

  #preview-bar,
  #reply-preview {
    padding: 8px 14px;
    font-size: 0.85rem;
  }

  #preview-bar img,
  #preview-bar video {
    height: 45px;
  }
}

/* General mobile adjustments (up to tablets ~767px) */
@media (max-width: 767px) {
  body {
    overflow: hidden; /* already have, but reinforce */
  }

  .chat-container {
    padding: 16px;
  }

  .message {
    max-width: 88%;           /* Wider bubbles on mobile */
  }

  .message.own {
    max-width: 90%;
  }

  .message:has(.video-container) {
    max-width: 96%;
  }

  .message:has(.audio-container) {
    max-width: 92%;
  }

  .message-content {
    border-radius: 16px;
  }

  .message.own .message-content {
    border-radius: 16px;
  }

  .video-container iframe {
    max-height: 55vh;         /* Prevent huge videos on mobile */
  }

  .input-area {
    padding: 14px 16px;
  }

  #comment {
    font-size: 1rem;
  }

  /* Hide or shrink less important elements if needed */
  .header-content > div:first-child h1 {
    font-size: 1.4rem;
  }
}

/* Tablets & small landscape phones (optional fine-tuning) */
@media (min-width: 768px) and (max-width: 1024px) {
  .chat-container {
    padding: 24px;
  }

  .message {
    max-width: 80%;           /* Back to original on tablets */
  }
}

/* Optional: Prevent zoom issues & improve touch targets */
@media (max-width: 767px) {
  button,
  .action-btn {
    min-width: 44px;           /* iOS Human Interface Guidelines touch target */
    min-height: 44px;
  }

  input,
  textarea,
  button {
    font-size: 16px;           /* Prevent iOS zoom on focus */
  }
}

/* Fix for iOS Safari – respects notch, dynamic island, home indicator */
@supports (padding-top: env(safe-area-inset-top)) {
  header {
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .input-area {
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
}

/* Prevent last messages from being hidden under the input bar */
.chat-container {
  padding-bottom: 90px;           /* ← add or increase this value */
}


  </style>
</head>

const canvas = document.getElementById('cropCanvas');
const ctx = canvas.getContext('2d');
let processedAvatarBase64 = ""; // Holds the clean circular image

modalAvatarInput.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    modalError.textContent = "Please select an image file";
    return;
  }

  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = function() {
      const size = 300; // Standard resolution for profile pics
      canvas.width = size;
      canvas.height = size;

      // Create Circular Mask
      ctx.clearRect(0, 0, size, size);
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      // Center-Crop Logic
      let drawW, drawH, dx, dy;
      if (img.width > img.height) {
        drawH = size;
        drawW = img.width * (size / img.height);
        dx = -(drawW - size) / 2;
        dy = 0;
      } else {
        drawW = size;
        drawH = img.height * (size / img.width);
        dx = 0;
        dy = -(drawH - size) / 2;
      }

      ctx.drawImage(img, dx, dy, drawW, drawH);
      
      const dataUrl = canvas.toDataURL('image/png');
      processedAvatarBase64 = dataUrl.split(',')[1];

      // Update Modal Preview
      modalAvatar.src = dataUrl;
      modalAvatar.style.opacity = '1';
      modalError.textContent = '';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);

  function formatSmartTime(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  
  const isToday = date.toDateString() === now.toDateString();
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  const isYesterday = date.toDateString() === yesterday.toDateString();
  
  let dayPart;
  if (isToday) dayPart = "Today";
  else if (isYesterday) dayPart = "Yesterday";
  else dayPart = date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  
  const timePart = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  
  return `${dayPart} • ${timePart}`;
}

async function updateAnnBadge() {
    const badge = document.getElementById('ann-badge');

    try {
        // Primary method: get real unseen count from server
        const res = await fetch(`${scriptUrl}?operation=getUnseenAnnCount&name=${encodeURIComponent(userName)}`);
        const data = await res.json();

        if (data.status === 'error') throw new Error(data.message || 'Server error');

        const unseen = data.unseenCount || 0;

        if (unseen > 0) {
            badge.textContent = unseen > 99 ? '99+' : unseen;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }

        // Keep localStorage in sync as fallback / offline support
        localStorage.setItem('lastSeenAnnCount', data.seenUpTo || 0);

    } catch (err) {
        console.warn('Could not fetch unseen count → using local fallback', err);

        // Fallback: old localStorage method (still works if server is down)
        const totalResponse = await fetch(`${scriptUrl}?operation=getData`).catch(() => null);
        let total = 0;
        if (totalResponse?.ok) {
            const data = await totalResponse.json();
            total = data.announcements?.length || 0;
        }

        const lastSeen = parseInt(localStorage.getItem('lastSeenAnnCount') || '0', 10);
        const unseen = Math.max(0, total - lastSeen);

        if (unseen > 0) {
            badge.textContent = unseen > 99 ? '99+' : unseen;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

function buildCallCard(c, callData) {
  // Check if call is still active (simple: no "ended" status in card)
  const isEnded  = callData.status === 'ended';
  const isOwn    = c.name === userName;
  const isInvited = callData.isAllUsers ||
    (callData.invitees || []).some(inv => inv.username === userName);
  const canJoin  = !isEnded && (isInvited || isOwn);
 
  const callUrl  = `call.html?callId=${encodeURIComponent(callData.callId)}`;
  const iconClass = isEnded ? 'ended' : '';
  const btnHtml   = canJoin
    ? `<a href="${callUrl}" class="join-call-btn">
        <i class="fas fa-phone"></i> Join
       </a>`
    : `<span class="join-call-btn ended">Ended</span>`;
 
  const inviteeText = callData.isAllUsers
    ? 'Everyone'
    : (callData.invitees || []).map(i => i.username).slice(0,3).join(', ') +
      ((callData.invitees || []).length > 3 ? ` +${callData.invitees.length - 3}` : '');
 
  const picHtml = c.picLink
    ? `<img src="https://lh3.googleusercontent.com/d/${extractFileId(c.picLink)}" class="avatar">`
    : '';
 
  return `
    ${picHtml}
    <div class="message-content" style="padding:10px 12px; background:transparent;">
      <div class="name">${c.name}</div>
     <div class="call-card ${isEnded ? 'ended-card' : ''}">
        <div class="call-card-icon ${iconClass}">
          <i class="fas fa-${isEnded ? 'phone-slash' : 'phone-volume'}"></i>
        </div>
        <div class="call-card-body">
          <div class="call-card-title">${callData.title || 'Call'}</div>
          <div class="call-card-sub">
            <i class="fas fa-users" style="font-size:0.72rem;margin-right:4px;"></i>
            ${inviteeText}
          </div>
        </div>
        ${btnHtml}
      </div>
      <span class="time">${formatSmartTime(c.timestamp)}</span>
    </div>
  `;
}

<script>
  let deferredPrompt;
  const installBtn = document.getElementById('installAppBtn');
  const installModal = document.getElementById('installModal');

  // --- NEW: Hide button immediately if already in "standalone" (installed) mode ---
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    if (installBtn) installBtn.style.display = 'none';
  }

  // 1. Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.error('SW failed:', err));
    });
  }

  // 2. Capture the install event
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Only show button if not already installed
    if (installBtn) installBtn.style.display = 'block';
  });

  // 3. The "Yes" Button Logic
  document.getElementById('installYes').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      
      if (outcome === 'accepted') {
        console.log('User accepted install');
        if (installBtn) installBtn.style.display = 'none'; // Hide button
      }
      deferredPrompt = null;
      installModal.style.display = 'none';
    }
  });

  // 4. Manual Modal Trigger
  if (installBtn) {
    installBtn.addEventListener('click', () => {
      installModal.style.display = 'flex';
    });
  }

  // 5. Cancel Button
  document.getElementById('installNo').addEventListener('click', () => {
    installModal.style.display = 'none';
  });

  // 6. --- NEW: Final safeguard to hide button when installation finishes ---
  window.addEventListener('appinstalled', () => {
    console.log('App installed successfully');
    if (installBtn) installBtn.style.display = 'none';
    installModal.style.display = 'none';
    deferredPrompt = null;
  });
</script>
