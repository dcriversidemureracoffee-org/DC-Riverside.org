      function gShow(text, chips, step, isMenu) {
        $("gstep").textContent = step || "";
        $("gback").style.visibility = isMenu ? "hidden" : "visible";
        clearTimeout(gTyping);
        chipsEl.innerHTML = "";
        gb.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
        gav.classList.add("talk");

          () => {
            let i = 0;

        );

      function tour(steps, i) {
        i = i || 0;
        const s = steps[i];

        else nav.push({ l: "Done ✓", go: gClose, cls: "pri" });
        const text = typeof s.text === "function" ? s.text() : s.text;
        gShow(text, [...(s.chips || []), ...nav], i + 1 + " of " + steps.length);

      function latestMsg() {

      TOPICS.write = () =>
        tour([

      TOPICS.me = () =>

      /* ---------- account status ---------- */
      async function checkUser() {
        try {
          const [s, m] = await Promise.allSettled([
            fetch(
              `${scriptUrl}?operation=getUserStatus&name=${encodeURIComponent(userName)}`,
            ).then((r) => r.json()),
            fetch(`${scriptUrl}?operation=getMembers`).then((r) => r.json()),
          ]);
          if (m.status === "fulfilled")
            (m.value.users || []).forEach(
              (u) =>
                (memberMap[u.name] = {
                  isAdmin: u.isAdmin,
                  role: u.role,
                  picLink: u.picLink || "",
                }),
            );
          if (s.status !== "fulfilled" || s.value.status !== "success") throw 0;
          memberMap[userName] = {
            isAdmin: s.value.isAdmin,
            role: s.value.role,
            picLink: lsGet("userPicLink") || "",
          };
          isApproved = String(s.value.userStatus).toLowerCase() === "approved";
          lsSet("rc_last_approved", isApproved ? "1" : "0");
          setOnline(true);
        } catch (e) {
          setOnline(false);
          isApproved = lsGet("rc_last_approved") === "1";
        }
      }
      function lockComposer() {
        $("composer").classList.add("locked");
        ta.disabled = true;
        $("feed").innerHTML =
          '<div class="empty"><span class="big">⏳</span><h3>Almost there, ' +
          esc(first()) +
          '</h3>Your account is waiting for approval. Once an admin approves you, the community pool opens up here.<br><button class="loadmore" data-grace="locked">Ask Grace</button></div>';
        setTimeout(() => gOpen("locked"), 600);
      }
      async function boot() {
        if (dataMode === "fast") {
          const c = readCache();
          if (c && c.comments?.length) {
            allComments = c.comments;
            mergePending();
            render(false, true);
          }
        }
        await checkUser();
        if (!isApproved && isOnline) {
          lockComposer();
          return;
        }
        if (isOnline) await loadComments(false);
        else if (!allComments.length) loadCache();
        render(true, false);
        startPolling();
        if (getDrafts().length && isOnline) flushDrafts();
        setTimeout(graceHello, 1200);
      }

      /* ---------- announcements badge ---------- */
      async function updateAnnBadge() {
        const b = $("ann-badge");
        try {
          const d = await (
            await fetch(
              `${scriptUrl}?operation=getUnseenAnnCount&name=${encodeURIComponent(userName)}`,
            )
          ).json();
          if (d.status !== "success") throw 0;
          const n = d.unseenCount || 0;
          b.textContent = n > 99 ? "99+" : n;
          b.style.display = n > 0 ? "flex" : "none";
          lsSet("lastSeenAnnCount", d.seenUpTo || 0);
        } catch {
          b.style.display = "none";
        }
      }

      /* ---------- profile ---------- */
      const pm = $("profile-modal"),
        canvas = $("cropCanvas"),
        cx = canvas.getContext("2d");
      let newAv = "";
      ua.onclick = () => {
        $("modal-name-input").value = userName;
        $("modal-avatar").src = ua.src;
        $("modal-error").textContent = "";
        newAv = "";
        const c = lsGet("userIdCode") || "";
        const e = $("recovery-code-display");
        e.textContent = c || "No code found";
        pm.style.display = "flex";
      };
      $("modal-cancel-btn").onclick = () => (pm.style.display = "none");
      $("modal-avatar-input").onchange = (e) => {
        const f = e.target.files?.[0];
        if (!f || !f.type.startsWith("image/")) return;
        const r = new FileReader();
        r.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const s = 300;
            canvas.width = canvas.height = s;
            cx.clearRect(0, 0, s, s);
            cx.beginPath();
            cx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
            cx.clip();
            const k = Math.max(s / img.width, s / img.height),
              w = img.width * k,
              h = img.height * k;
            cx.drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
            const u = canvas.toDataURL("image/png");
            newAv = u.split(",")[1];
            $("modal-avatar").src = u;
          };
          img.src = ev.target.result;
        };
        r.readAsDataURL(f);
      };
      $("modal-save-btn").onclick = async () => {
        const nn = ($("modal-name-input").value || "").trim(),
          nc = nn && nn !== userName;
        if (!nc && !newAv) {
          pm.style.display = "none";
          return;
        }
        const b = $("modal-save-btn");
        b.disabled = true;
        b.textContent = "Saving…";
        try {
          const p = {
            operation: "updateProfile",
            oldName: userName,
            identityCode: lsGet("userIdCode"),
          };
          if (nc) p.newName = nn;
          if (newAv) {
            p.imageData = newAv;
            p.imageName = `${nn || userName}_avatar.png`;
          }
          const r = await (
            await fetch(scriptUrl, { method: "POST", body: JSON.stringify(p) })
          ).json();
          if (r.status === "success") {
            if (nc) {
              userName = r.newName || nn;
              lsSet("userName", userName);
            }
            if (newAv && r.picLink) {
              lsSet("userPicLink", r.picLink);
              ua.src = r.picLink;
            }
            toast("Profile updated");
            pm.style.display = "none";
            loadComments(false);
          } else $("modal-error").textContent = r.message || "Update failed";
        } catch {
          $("modal-error").textContent = "Connection error";
        }
        b.disabled = false;
        b.textContent = "Save changes";
      };
      $("copy-recovery-btn").onclick = () => {
        const c = $("recovery-code-display").textContent.trim();
        if (!c || c === "No code found")
          return toast("No recovery code available", "error");
        navigator.clipboard
          .writeText(c)
          .then(() => toast("Recovery code copied"))
          .catch(() => toast("Copy failed", "error"));
      };

      /* ---------- install PWA ---------- */
      let dp;
      const ib = $("installAppBtn");
      if (
        matchMedia("(display-mode: standalone)").matches ||
        navigator.standalone === true
      )
        ib.style.display = "none";
      addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        dp = e;
        ib.style.display = "flex";
      });
      ib.onclick = () => ($("installModal").style.display = "flex");
      $("installNo").onclick = () => ($("installModal").style.display = "none");
      $("installYes").onclick = async () => {
        if (!dp) return;
        dp.prompt();
        const { outcome } = await dp.userChoice;
        if (outcome === "accepted") ib.style.display = "none";
        dp = null;
        $("installModal").style.display = "none";
      };
      addEventListener("appinstalled", () => {
        ib.style.display = "none";
        $("installModal").style.display = "none";
      });

      /* ---------- start ---------- */
      setOnline(navigator.onLine);
      autoGrow();
      boot();
      updateAnnBadge();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./sw.js", { scope: "./" })
          .then(() => console.log("SW registered"))
          .catch((e) => console.error("SW failed:", e));
      }
    </script>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycby3qdljC5TNQo2xOFth13eMUm4JvpSA9yewJJ6n3xgc6J26pV_jzAeia6TGRI6ylZIe/exec";
      async function registerFcmForChat() {
        if (window.Capacitor?.isNativePlatform?.()) {
          try {
            const { PushNotifications } = window.Capacitor.Plugins;
            const perm = await PushNotifications.checkPermissions();
            let status = perm.receive;
            if (status === "prompt") {
              const req = await PushNotifications.requestPermissions();
              status = req.receive;
            }
            if (status !== "granted") return;
            await PushNotifications.register();
            PushNotifications.addListener("registration", async (token) => {
              await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                  operation: "saveFcmToken",
                  username: userName,
                  fcmToken: token.value,
                  platform: "android",
                }),
              });
            });
            PushNotifications.addListener("registrationError", (err) =>
              console.error("Native push registration error:", err),
            );
            PushNotifications.addListener(
              "pushNotificationActionPerformed",
              (n) => {
                const data = n.notification.data || {};
                if (data.callId)
                  window.location.href = `call.html?callId=${data.callId}`;
                else if (data.channelId)
                  window.location.href = `channel.html?channelId=${data.channelId}&postId=${data.postId || ""}`;
                else if (data.gameId)
                  window.location.href = `Q&A.html?gameId=${data.gameId}`;
                else if (data.announcement)
                  window.location.href = "announce.html";
              },
            );
          } catch (err) {
            console.error("Native push setup failed:", err);
          }
          return;
        }
        if (!("serviceWorker" in navigator) || !("Notification" in window))
          return;
        try {
          const swReg = await navigator.serviceWorker.register("./sw.js", {
            scope: "./",
          });
          const { initializeApp } =
            await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js");
          const { getMessaging, getToken, onMessage } =
            await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-messaging.js");
          const app = initializeApp({
            apiKey: "AIzaSyDBKHrHJ8Kz7W-4ztMCOeMf8Oakv-WZcws",
            authDomain: "dc-riverside-murera-coffee.firebaseapp.com",
            projectId: "dc-riverside-murera-coffee",
            storageBucket: "dc-riverside-murera-coffee.firebasestorage.app",
            messagingSenderId: "373863707096",
            appId: "1:373863707096:web:5e3c703655687b96e442ad",
          });
          const messaging = getMessaging(app);
          const VAPID_KEY =
            "BK5POZAyygNGKbt1HrQOGgg5M8iwhKBVMTirp8LcPb7jt_fIkz-8YOT6pxljlAJXA3CB3NrMKdwujUGlseNVPD0";
          const permission = await Notification.requestPermission();
          if (permission !== "granted") return;
          const token = await getToken(messaging, {
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: swReg,
          });
          if (token)
            await fetch(SCRIPT_URL, {
              method: "POST",
              body: JSON.stringify({
                operation: "saveFcmToken",
                username: userName,
                fcmToken: token,
                platform: "web",
              }),
            });
          onMessage(messaging, (payload) => {
            const title = payload.data?.title || "Riverside Connect",
              body = payload.data?.body || "New message",
              callId = payload.data?.callId || "";
            if (callId) {
              const banner = document.createElement("div");
              banner.style.cssText =
                "position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.4);";
              banner.innerHTML = `<div style="min-width:0;"><div style="font-weight:700;font-size:0.95rem;">${esc(title)}</div><div style="font-size:0.8rem;opacity:.85;">${esc(body)}</div></div><div style="display:flex;gap:8px;flex-shrink:0;"><button onclick="window.location.href='call.html?callId=${encodeURIComponent(callId)}'" style="padding:7px 16px;background:white;color:#16a34a;border:none;border-radius:999px;font-weight:700;cursor:pointer;font-size:0.83rem;">Join</button><button onclick="this.closest('div[style]').remove()" style="padding:7px 12px;background:rgba(255,255,255,0.2);color:white;border:none;border-radius:999px;cursor:pointer;font-size:0.83rem;">×</button></div>`;
              document.body.appendChild(banner);
              setTimeout(() => banner.remove(), 30000);
            } else {
              toast(`${title}: ${body}`, "info");
              if (isApproved) loadComments(false);
            }
          });
        } catch (err) {
          console.error("Web FCM error:", err);
        }
      }
      window.addEventListener("load", () => {
        registerFcmForChat().catch((err) =>
          console.error("FCM registration failed:", err),
        );
      });
    </script>
