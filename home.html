<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riverside Connect</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="manifest" href="./manifest.json">


 <!-- iOS Safari home screen support -->

<meta property="og:site_name" content="Riverside Connect">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Riverside Connect chat preview">
<style>
    :root {
      --bg-deep:        #080d17;
      --bg-mid:         #0d1525;
      --bg-surface:     #111d30;
      --bg-panel:       rgba(16, 26, 45, 0.72);
      --bg-glass:       rgba(20, 32, 55, 0.65);
      --border-subtle:  rgba(255,255,255,0.07);
      --border-med:     rgba(255,255,255,0.12);
      --border-blue:    rgba(80, 140, 240, 0.22);
      --accent:         #e8a84c;
      --accent-dim:     rgba(232, 168, 76, 0.18);
      --accent-glow:    rgba(232, 168, 76, 0.08);
      --blue-main:      #4a90e2;
      --blue-bright:    #6babf5;
      --blue-dim:       rgba(74, 144, 226, 0.18);
      --text-primary:   #eef2f8;
      --text-secondary: #8a9cbf;
      --text-muted:     #4a5878;
      --own-bg:         linear-gradient(135deg, #1c3a6e 0%, #1a4080 100%);
      --own-border:     rgba(107, 171, 245, 0.25);
      --radius-msg:     18px;
      --font-ui:        'Plus Jakarta Sans', system-ui, sans-serif;
      --font-serif:     'Instrument Serif', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; overflow-x: hidden;
      position: relative;
    }

    body {
      height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: var(--font-ui);
      background: var(--bg-deep);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(30, 60, 120, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(15, 40, 90, 0.25) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════
       HEADER
    ══════════════════════════════ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 13, 23, 0.82);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.25rem;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      flex: 1;
    }

    .header-logo span { color: var(--accent); }

    .hbtn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-med);
      background: var(--bg-glass);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      flex-shrink: 0;
      position: relative;
    }

    .hbtn:hover {
      border-color: var(--border-blue);
      color: var(--text-primary);
      background: var(--blue-dim);
    }

    /* Active-state highlight, used by People / All Messages / My Thread toggles */
    .hbtn.nav-active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    #user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #user-avatar:hover { box-shadow: 0 0 0 3px var(--accent-dim); }

    .badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #e05252;
      color: white;
      font-size: 0.6rem;
      font-weight: 600;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 1.5px solid var(--bg-deep);
      display: none;
    }

    /* ══════════════════════════════
       VIEW CONTEXT BAR
    ══════════════════════════════ */
    #view-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 7px 16px;
      background: rgba(8,13,23,0.6);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      color: var(--text-muted);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    #view-bar-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      letter-spacing: 0.02em;
      flex: 1;
      min-width: 0;
      justify-content: center;
    }

    #view-back-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #view-back-btn:hover { color: var(--blue-bright); }

    #view-thread-avatar {
      width: 22px; height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-med);
      display: none;
      flex-shrink: 0;
    }

    #view-bar-text {
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #view-call-btn {
      display: none;
      align-items: center;
      gap: 5px;
      background: rgba(34,197,94,0.14);
      border: 1px solid rgba(34,197,94,0.3);
      color: #4ade80;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    #view-call-btn:hover { background: rgba(34,197,94,0.22); }

    #offline-pill {
      display: none;
      align-items: center;
      gap: 5px;
      background: rgba(224,82,82,0.12);
      border: 1px solid rgba(224,82,82,0.3);
      color: #e8968f;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #offline-pill i { font-size: 0.65rem; }

    /* ══════════════════════════════
       CHAT / LIST CONTAINER
    ══════════════════════════════ */
    .chat-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .chat-container {
      flex: 1;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 20px 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar { width: 5px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

    /* ── Date Divider (kept for readability inside a feed/thread) ── */
    .date-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }

    .date-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 0 8px;
    }

    .date-divider::before, .date-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
    }

    .date-divider-label {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg-mid);
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    /* ── Messages ── */
    .message {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 78%;
      animation: msgIn 0.3s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.own { margin-left: auto; flex-direction: row-reverse; }
    .message + .message { margin-top: 6px; }
    .message.new-sender { margin-top: 16px; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--border-med);
      flex-shrink: 0;
      align-self: flex-end;
      margin-bottom: 2px;
    }

    .avatar-placeholder { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }

    .message-content {
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: var(--radius-msg);
      border-bottom-left-radius: 5px;
      max-width: calc(100% - 44px);
      position: relative;
    }

    .message.own .message-content {
      background: var(--own-bg);
      border: 1px solid var(--own-border);
      border-bottom-left-radius: var(--radius-msg);
      border-bottom-right-radius: 5px;
    }

    .message.same-sender .avatar { visibility: hidden; }

    .msg-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--blue-bright);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .message.own .msg-name { color: rgba(255,255,255,0.65); cursor: default; }
    .message.same-sender .msg-name { display: none; }

    .msg-text {
      font-size: 0.93rem;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      color: var(--text-primary);
    }

    .msg-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 5px;
      gap: 8px;
    }

    .msg-time { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
    .message.own .msg-time { color: rgba(255,255,255,0.38); }

    .msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
    .message:hover .msg-actions { opacity: 1; }

    .action-btn {
      font-size: 0.7rem;
      font-weight: 500;
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      width: auto;
      height: auto;
      padding: 3px 8px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: var(--blue-dim);
      border-color: var(--border-blue);
      color: var(--blue-bright);
    }

    .action-btn.delete-btn:hover {
      background: rgba(224,82,82,0.12);
      border-color: rgba(224,82,82,0.25);
      color: #e05252;
    }

    .quoted-msg {
      background: rgba(0,0,0,0.2);
      border-left: 2.5px solid var(--blue-bright);
      padding: 6px 10px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      max-width: 100%;
      overflow: hidden;
    }

    .message.own .quoted-msg {
      background: rgba(255,255,255,0.08);
      border-left-color: rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.65);
    }

    .quoted-msg strong { color: var(--blue-bright); }
    .message.own .quoted-msg strong { color: rgba(255,255,255,0.85); }

    .media-content { margin: 8px 0; border-radius: 10px; overflow: hidden; }
    .media-content img { max-width: 100%; max-height: 280px; display: block; border-radius: 10px; object-fit: cover; }

    .video-container { background: #000; border-radius: 10px; overflow: hidden; margin: 8px 0; }
    .video-container iframe { width: 100%; height: auto; min-height: 180px; aspect-ratio: 16/9; display: block; border: none; }
    .audio-container iframe { width: 100%; height: 80px; border: none; }

    .message:has(.video-container) { max-width: 90%; }
    .message:has(.video-container) .message-content { max-width: 100%; min-width: 260px; width: 100%; }
    .message:has(.audio-container) { max-width: 85%; }
    .message:has(.audio-container) .message-content { max-width: 100%; min-width: 220px; }

    .edit-input {
      width: 100%;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-blue);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 6px;
      resize: vertical;
    }

    /* ══════════════════════════════
       CALL CARD
    ══════════════════════════════ */
    .call-card {
      background: rgba(24,80,48,0.15);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .call-card-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: white;
      flex-shrink: 0;
      animation: callPulse 2s ease-in-out infinite;
    }

    @keyframes callPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      50%      { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
    }

    .call-card-icon.ended { background: linear-gradient(135deg, #374151, #1f2937); animation: none; }
    .call-card.ended-card { opacity: 0.5; filter: grayscale(60%); }
    .call-card-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
    .call-card-sub { font-size: 0.76rem; color: var(--text-muted); }

    .join-call-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .join-call-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.35); }
    .join-call-btn.ended { background: #374151; cursor: default; }
    .join-call-btn.ended:hover { transform: none; box-shadow: none; }

    /* ══════════════════════════════
       PEOPLE LIST (new landing view)
    ══════════════════════════════ */
    #people-search-wrap {
      padding: 2px 2px 14px;
      position: sticky;
      top: 0;
      background: linear-gradient(var(--bg-deep) 70%, transparent);
      z-index: 5;
    }

    #people-search {
      width: 100%;
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 0.88rem;
      outline: none;
    }
    #people-search:focus { border-color: var(--border-blue); }
    #people-search::placeholder { color: var(--text-muted); }

    .person-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 10px;
    }

    .person-row:hover { background: var(--bg-glass); }

    .person-row .avatar { width: 46px; height: 46px; }

    .person-info { flex: 1; min-width: 0; }

    .person-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .person-name { font-weight: 600; font-size: 0.94rem; color: var(--text-primary); }
    .person-name.self-tag::after {
      content: 'You';
      margin-left: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 1px 7px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }

    .person-snippet {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .person-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .person-time { font-size: 0.68rem; color: var(--text-muted); }

    .person-call-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.28);
      color: #4ade80;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .person-call-btn:hover { background: rgba(34,197,94,0.22); transform: scale(1.05); }

    /* ══════════════════════════════
       THREAD EMPTY / EMPTY STATE
    ══════════════════════════════ */
    .today-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      gap: 16px;
      text-align: center;
      animation: msgIn 0.4s ease both;
    }

    .today-empty-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(232,168,76,0.08);
      border: 1px solid rgba(232,168,76,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .today-empty h3 {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.3rem;
      color: var(--text-primary);
    }

    .today-empty p {
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.5;
    }

    .today-empty .open-cal-btn {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--accent-dim);
      border: 1px solid rgba(232,168,76,0.3);
      color: var(--accent);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .today-empty .open-cal-btn:hover {
      background: rgba(232,168,76,0.26);
      box-shadow: 0 4px 16px rgba(232,168,76,0.15);
    }

    /* ══════════════════════════════
       INPUT AREA
    ══════════════════════════════ */
    #reply-preview {
      display: none;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 20px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      position: relative;
      z-index: 2;
    }

    #reply-preview strong { color: var(--blue-bright); }

    .reply-cancel-btn {
      width: 22px; height: 22px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .reply-cancel-btn:hover { color: #e05252; }

    #preview-bar {
      display: none;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 20px;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    #preview-bar img, #preview-bar video { height: 48px; border-radius: 6px; }

    .input-area {
      background: rgba(6,10,18,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 20px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .input-wrapper {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      flex-shrink: 0;
      text-decoration: none;
    }

    .input-icon-btn:hover {
      border-color: var(--border-blue);
      color: var(--blue-bright);
      background: var(--blue-dim);
    }

    #callBtn { color: #4ade80; border-color: rgba(74,222,128,0.2); }
    #callBtn:hover { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.4); color: #4ade80; }

    #comment {
      flex: 1;
      min-width: 0;
      padding: 11px 18px;
      border-radius: 22px;
      background: var(--bg-glass);
      color: var(--text-primary);
      font-size: 0.93rem;
      font-family: var(--font-ui);
      border: 1px solid var(--border-subtle);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      resize: none;
      max-height: 140px;
      line-height: 1.4;
      overflow-y: auto;
    }

    #comment:focus { border-color: var(--border-blue); background: rgba(20,34,60,0.8); }
    #comment::placeholder { color: var(--text-muted); }

    #sendBtn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    #sendBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.45); }
    #sendBtn:disabled { opacity: 0.5; transform: none; box-shadow: none; }

    /* ══════════════════════════════
       TOASTS
    ══════════════════════════════ */
    #toast-container {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--bg-surface);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--border-med);
      border-left: 3px solid var(--blue-main);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.25s ease both;
      min-width: 200px;
      white-space: nowrap;
    }

    .toast.error { border-left-color: #e05252; }
    .toast.info  { border-left-color: var(--accent); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ══════════════════════════════
       PROFILE MODAL
    ══════════════════════════════ */
    #profile-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4,8,16,0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-panel {
      background: var(--bg-surface);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 28px 24px;
      border: 1px solid var(--border-med);
      animation: panelIn 0.3s cubic-bezier(.22,.68,0,1.2) both;
      max-height: 88vh;
      overflow-y: auto;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.4rem;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar-ring {
      position: relative;
      width: 120px; height: 120px;
      margin: 0 auto 24px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--accent);
    }

    .avatar-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .avatar-ring label {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      cursor: pointer;
      transition: opacity 0.2s;
      font-size: 1.5rem;
      color: white;
    }

    .avatar-ring:hover label { opacity: 1; }

    .modal-field { margin-bottom: 20px; }

    .modal-label {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .modal-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-med);
      color: var(--text-primary);
      font-size: 0.93rem;
      font-family: var(--font-ui);
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus { border-color: var(--border-blue); }

    .recovery-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .recovery-code {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: var(--accent);
      background: rgba(0,0,0,0.25);
      padding: 8px 12px;
      border-radius: 7px;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-top: 8px;
      word-break: break-all;
    }

    .modal-error { color: #e05252; font-size: 0.82rem; margin-top: 6px; min-height: 18px; }

    .btn-row { display: flex; gap: 12px; }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-med);
      color: var(--text-secondary);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover { background: rgba(255,255,255,0.09); color: var(--text-primary); }

    .btn-save {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      color: white;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-save:hover { box-shadow: 0 4px 16px rgba(37,99,235,0.4); }
    .btn-save:disabled { opacity: 0.55; }

    /* ══════════════════════════════
       CALL MODAL
    ══════════════════════════════ */
    #callModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4,8,16,0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #callModal .modal-panel { max-width: 420px; }

    .call-type-tabs { display: flex; gap: 8px; margin-bottom: 14px; }

    .call-tab {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: none;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .call-tab.active { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.3); color: #4ade80; font-weight: 600; }

    #memberListContainer {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 14px;
    }

    .call-option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .call-option-row:hover { background: rgba(255,255,255,0.05); }
    .call-option-row input[type=checkbox] { accent-color: #22c55e; width: 16px; height: 16px; cursor: pointer; }
    .call-option-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); }
    .call-option-label { font-size: 0.9rem; color: var(--text-primary); }

    .placeholder-av {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--bg-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .btn-start-call {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-start-call:hover { box-shadow: 0 4px 16px rgba(34,197,94,0.35); }
    .btn-start-call:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-outline {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      background: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.88rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-outline:hover { border-color: var(--border-med); color: var(--text-secondary); }

    /* ══════════════════════════════
       INSTALL MODAL
    ══════════════════════════════ */
    #installModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4,8,16,0.8);
      backdrop-filter: blur(10px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    /* ══════════════════════════════
       PENDING / UNAPPROVED VIEW
    ══════════════════════════════ */
    .pending-wrap {
      text-align: center;
      padding: 40px 20px 80px;
      max-width: 680px;
      margin: 0 auto;
    }

    .pending-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 2rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .pending-subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 32px; }

    .slider-track {
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      display: flex;
      gap: 14px;
      padding-bottom: 10px;
      scroll-padding: 14px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-med) transparent;
    }

    .slide-card {
      flex: 0 0 calc(min(280px, 85vw));
      scroll-snap-align: start;
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
    }

    .slide-card img { width: 100%; height: 180px; object-fit: cover; }
    .slide-card .slide-body { padding: 16px; }
    .slide-ref { font-weight: 600; color: var(--blue-bright); font-size: 0.9rem; margin-bottom: 8px; }
    .slide-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; }

    /* ══════════════════════════════
       RESPONSIVE
    ══════════════════════════════ */
    @media (max-width: 500px) {
      .chat-container { padding: 16px 12px 90px; }
      .message { max-width: 88%; }
      .message.own { max-width: 88%; }
      header { height: 56px; padding: 0 14px; }
      .header-logo { font-size: 1.1rem; }
    }

    @supports (padding-top: env(safe-area-inset-top)) {
      header { padding-top: env(safe-area-inset-top); height: calc(60px + env(safe-area-inset-top)); }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      gap: 12px;
    }

    .empty-state i { font-size: 2.5rem; opacity: 0.3; }

    /* ══════════════════════════════
       PENDING / FAILED MESSAGE STATE
    ══════════════════════════════ */
    .message.pending .message-content {
      opacity: 0.55;
    }

    .message.pending .msg-text { font-style: italic; }

    .message.failed .message-content {
      border-color: rgba(224,82,82,0.45);
    }

    .msg-time.pending-time, .msg-time.failed-time {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .msg-time.failed-time { color: #e0827a; }

    .pending-time i { animation: pendingSpin 1.6s linear infinite; }

    @keyframes pendingSpin {
      0%, 85%, 100% { opacity: 0.55; }
      42% { opacity: 1; }
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<!-- ══ HEADER ══ -->
<header>
  <div class="header-inner">
    <img id="user-avatar" src="" alt="Profile"
         onerror="this.src='https://via.placeholder.com/38?text=@';">

    <div class="header-logo">Riverside <span>Connect</span></div>

    <!-- All Messages (global feed) toggle -->
    <button id="allMsgBtn" class="hbtn" title="All Messages">
      <i class="fas fa-comments"></i>
    </button>

    <!-- People toggle — the new home / landing view -->
    <button id="peopleBtn" class="hbtn" title="People">
      <i class="fas fa-users"></i>
    </button>

    <!-- My Thread shortcut -->
    <button id="threadBtn" class="hbtn" title="My Thread">
      <i class="fas fa-user-check"></i>
    </button>

    <a href="index.html" class="hbtn" title="Home" style="text-decoration:none;">
      <i class="fas fa-home"></i>
    </a>

    <div style="position:relative;">
      <a href="announce.html" class="hbtn" title="Announcements" style="text-decoration:none;">
        <i class="fas fa-bell"></i>
        <span id="ann-badge" class="badge">0</span>
      </a>
    </div>

    <button id="installAppBtn" class="hbtn" title="Install App" style="display:none;">
      <i class="fas fa-download"></i>
    </button>
  </div>
</header>

<!-- ══ VIEW CONTEXT BAR ══ -->
<div id="view-bar">
  <button id="view-back-btn" onclick="goHome()"><i class="fas fa-chevron-left"></i></button>
  <span id="view-bar-label">
    <img id="view-thread-avatar" src="" alt="">
    <span id="view-bar-text">People</span>
  </span>
  <button id="view-call-btn" onclick="callActiveThreadUser()">
    <i class="fas fa-phone"></i> Call
  </button>
  <span id="offline-pill">
    <i class="fas fa-wifi"></i> Offline — last synced
  </span>
</div>

<!-- ══ MAIN CONTENT ══ -->
<div class="chat-wrap">
  <div class="chat-container" id="comments">
    <div class="empty-state">
      <i class="fas fa-comments"></i>
      <span>Loading…</span>
    </div>
  </div>
</div>

<!-- ══ REPLY PREVIEW ══ -->
<div id="reply-preview">
  <span style="display:flex;align-items:center;gap:8px;">
    <i class="fas fa-reply" style="font-size:0.8rem;opacity:0.6;"></i>
    <span id="reply-text">Replying to…</span>
  </span>
  <button class="reply-cancel-btn" onclick="cancelReply()"><i class="fas fa-times"></i></button>
</div>

<!-- ══ FILE PREVIEW ══ -->
<div id="preview-bar">
  <div id="file-preview-container"></div>
  <button id="removeFile" class="hbtn" style="border-color:rgba(224,82,82,0.3);color:#e05252;width:34px;height:34px;">
    <i class="fas fa-times"></i>
  </button>
</div>

<!-- ══ INPUT ══ -->
<div class="input-area">
  <div class="input-wrapper">
    <input type="file" id="fileInput" accept="image/*,video/*,audio/*" style="display:none;">
    <button id="callBtn" class="input-icon-btn" title="Start a call"><i class="fas fa-video"></i></button>
    <button id="addFileBtn" class="input-icon-btn" title="Attach file"><i class="fas fa-paperclip"></i></button>
    <textarea id="comment" placeholder="Write a message…" rows="1"></textarea>
    <button id="sendBtn"><i class="fas fa-paper-plane" style="margin-left:2px;"></i></button>
  </div>
</div>

<!-- ══ PROFILE MODAL ══ -->
<div id="profile-modal">
  <div class="modal-panel">
    <h2 class="modal-title">Your Profile</h2>
    <div class="avatar-ring">
      <img id="modal-avatar" src="" alt="Avatar">
      <label for="modal-avatar-input"><i class="fas fa-camera"></i></label>
      <input type="file" id="modal-avatar-input" accept="image/*" style="display:none;">
    </div>
    <div class="modal-field">
      <span class="modal-label">Display Name</span>
      <input type="text" id="modal-name-input" class="modal-input" placeholder="Your name">
      <div id="modal-error" class="modal-error"></div>
    </div>
    <div class="recovery-box">
      <span class="modal-label">Recovery Code</span>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;">
        <code id="recovery-code-display" class="recovery-code">Loading…</code>
        <button id="copy-recovery-btn" style="padding:6px 12px;background:var(--blue-dim);border:1px solid var(--border-blue);color:var(--blue-bright);border-radius:7px;font-size:0.8rem;font-weight:500;cursor:pointer;">Copy</button>
      </div>
      <p style="margin-top:10px;font-size:0.78rem;color:var(--text-muted);line-height:1.4;">Save this code to recover your account if you lose access.</p>
    </div>
    <div class="btn-row">
      <button id="modal-cancel-btn" class="btn-cancel">Cancel</button>
      <button id="modal-save-btn" class="btn-save">Save Changes</button>
    </div>
  </div>
</div>

<!-- ══ CALL MODAL ══ -->
<div id="callModal">
  <div class="modal-panel">
    <h2 class="modal-title" style="color:#4ade80;font-family:var(--font-ui);font-style:normal;font-size:1.2rem;">
      <i class="fas fa-phone" style="margin-right:8px;"></i>Start a Call
    </h2>
    <input type="text" id="callTitleInput" class="modal-input"
           placeholder="Call title (optional)…" style="margin-bottom:14px;">
    <div class="call-type-tabs">
      <button class="call-tab active" id="tabAll" onclick="setCallType('all')">
        <i class="fas fa-users"></i> All Members
      </button>
      <button class="call-tab" id="tabSelect" onclick="setCallType('select')">
        <i class="fas fa-user-check"></i> Select People
      </button>
    </div>
    <div id="memberListContainer" style="display:none;">
      <div id="memberList"></div>
    </div>
    <button id="startCallBtn" class="btn-start-call">
      <i class="fas fa-phone"></i> Start Call
    </button>
    <button class="btn-outline"
            onclick="document.getElementById('callModal').style.display='none'">Cancel</button>
  </div>
</div>

<!-- ══ INSTALL MODAL ══ -->
<div id="installModal">
  <div class="modal-panel" style="max-width:320px;text-align:center;">
    <i class="fas fa-mobile-alt" style="font-size:2rem;color:var(--accent);margin-bottom:16px;display:block;"></i>
    <h2 style="font-family:var(--font-serif);font-style:italic;margin-bottom:10px;">Install App</h2>
    <p style="font-size:0.88rem;color:var(--text-secondary);margin-bottom:24px;">
      Install Riverside Connect for faster access right from your home screen.
    </p>
    <div style="display:flex;gap:10px;">
      <button id="installYes" class="btn-save">Install</button>
      <button id="installNo" class="btn-cancel">Cancel</button>
    </div>
  </div>
</div>

<canvas id="cropCanvas" style="display:none;"></canvas>

<script>
const scriptUrl = 'https://script.google.com/macros/s/AKfycby3qdljC5TNQo2xOFth13eMUm4JvpSA9yewJJ6n3xgc6J26pV_jzAeia6TGRI6ylZIe/exec';

let userName = localStorage.getItem('userName');
let callType = 'all';
let allMembersCache = [];   // approved members excluding self, used by the "Start a Call" modal
let allMembers = [];        // every known member (incl. self), used by the People view
let isApproved = false;
let lastCommentCount = 0;
let pollingInterval = null;
let selectedFileData = null;
let replyingTo = null;
let memberMap = {};

/* ── View state ──
   view: 'people' | 'all' | 'thread'
   activeThreadUser: username whose thread is being viewed (only relevant when view === 'thread')
*/
let currentView = 'people';
let activeThreadUser = null;
let isOnline = navigator.onLine;

/* ── Local persistence keys ── */
const CACHE_KEY   = 'rc_cached_comments_v1';
const PENDING_KEY = 'rc_pending_drafts_v1';

if (!userName) window.location.href = 'login.html';

/* ── Load own avatar ── */
const userAvatarImg = document.getElementById('user-avatar');
const storedPicLink = localStorage.getItem('userPicLink');
if (storedPicLink) {
  const id = extractFileId(storedPicLink);
  userAvatarImg.src = id ? `https://lh3.googleusercontent.com/d/${id}` : storedPicLink;
} else {
  userAvatarImg.src = 'https://via.placeholder.com/38?text=@';

/* ════════════════════════════════
   HELPERS
════════════════════════════════ */
function extractFileId(url) {
  if (!url) return '';
  const m = url.match(/[-\w]{25,}/);
  return m ? m[0] : '';
}
function maybeFlushPending() {
  if (!isFlushingDrafts && getPendingDrafts().length) flushPendingDrafts();
}

function getLh3Link(url) {
  const id = extractFileId(url);
  return id ? `https://lh3.googleusercontent.com/d/${id}` : '';
}

function toDateStr(timestamp) {
  const d = new Date(timestamp);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function todayStr() { return toDateStr(Date.now()); }

function formatDateLabel(dateStr) {
  const today = todayStr();
  const yd = new Date(Date.now() - 86400000);
  const yStr = `${yd.getFullYear()}-${String(yd.getMonth()+1).padStart(2,'0')}-${String(yd.getDate()).padStart(2,'0')}`;
  if (dateStr === today) return 'Today';
  if (dateStr === yStr)  return 'Yesterday';
  const parts = dateStr.split('-');
  const d = new Date(+parts[0], +parts[1]-1, +parts[2]);
  return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

function formatTime(timestamp) {
  return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatRelative(timestamp) {
  const diff = Date.now() - timestamp;
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'now';
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `${hrs}h`;
  const days = Math.floor(hrs/24);
  if (days < 7) return `${days}d`;
  return new Date(timestamp).toLocaleDateString([], { month:'short', day:'numeric' });
}

function showToast(message, type='success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas fa-${type==='error'?'exclamation-circle':type==='info'?'info-circle':'check-circle'}"></i> <span>${message}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(-8px)'; t.style.transition='all 0.3s'; setTimeout(()=>t.remove(),300); }, 3000);
}

function scrollToBottom(force = false) {
  const near = Math.abs(commentsDiv.scrollHeight - commentsDiv.clientHeight - commentsDiv.scrollTop) < 150;
  if (force || near) commentsDiv.scrollTop = commentsDiv.scrollHeight;
}

function avatarSrcFor(name) {
  const pic = memberMap[name]?.picLink || (name === userName ? localStorage.getItem('userPicLink') : '');
  const id = extractFileId(pic);
  return id ? `https://lh3.googleusercontent.com/d/${id}` : 'https://via.placeholder.com/40?text=@';
}

/* ════════════════════════════════
   VIEW STATE (people / all / thread)
════════════════════════════════ */
function setNavActive() {
  document.getElementById('peopleBtn').classList.toggle('nav-active', currentView === 'people');
  document.getElementById('allMsgBtn').classList.toggle('nav-active', currentView === 'all');
  document.getElementById('threadBtn').classList.toggle('nav-active', currentView === 'thread' && activeThreadUser === userName);
}

function updateViewBar() {
  const label      = document.getElementById('view-bar-text');
  const backBtn    = document.getElementById('view-back-btn');
  const callBtn    = document.getElementById('view-call-btn');
  const threadAv   = document.getElementById('view-thread-avatar');
  const offlinePill = document.getElementById('offline-pill');

  if (currentView === 'people') {
    label.textContent = 'People';
    backBtn.style.display = 'none';
    callBtn.style.display = 'none';
    threadAv.style.display = 'none';
  } else if (currentView === 'all') {
    label.textContent = 'All Messages';
    backBtn.style.display = 'none';
    callBtn.style.display = 'none';
    threadAv.style.display = 'none';
  } else if (currentView === 'thread') {

    label.textContent = isSelf ? 'My Thread' : `${activeThreadUser}'s Thread`;

    threadAv.style.display = 'inline-block';
    threadAv.src = avatarSrcFor(activeThreadUser);
    threadAv.onerror = () => threadAv.style.display = 'none';

  }

  setNavActive();

function goHome() {
  currentView = 'people';
  activeThreadUser = null;
  renderPeopleList();
  updateViewBar();
}

function showAllMessages() {
  currentView = 'all';
  activeThreadUser = null;
  cancelReply();
  renderComments(allComments);
  updateViewBar();
}

function openUserThread(username) {
  currentView = 'thread';
  activeThreadUser = username;
  const thread = getThreadFor(username);
  renderComments(thread, false, { isThread: true, threadUser: username });
  updateViewBar();

  // Prefill a reply to that person's most recent message so replying feels natural —
  // the visitor can still cancel it or tap Reply on a specific message instead.
  if (username !== userName) {
    const lastByThem = [...thread].reverse().find(c => c.name === username && c.comment && !c.comment.startsWith('{"type":"call"'));
    if (lastByThem) setReplySafe(username, lastByThem.comment);
    else cancelReply();
  } else {
    cancelReply();
  }
}

document.getElementById('peopleBtn').addEventListener('click', goHome);
document.getElementById('allMsgBtn').addEventListener('click', showAllMessages);
document.getElementById('threadBtn').addEventListener('click', () => openUserThread(userName));

/* ════════════════════════════════
   THREAD FILTER — messages authored by a user, plus replies to them
════════════════════════════════ */
function getThreadFor(username) {
  return allComments.filter(c => {
    if (c.name === username) return true;
    if (c.replyTo && c.replyTo.name === username) return true;
    return false;
  });
}

/* ════════════════════════════════
   PEOPLE LIST RENDER
════════════════════════════════ */
function lastRealMessage(username) {
  for (let i = allComments.length - 1; i >= 0; i--) {
    const c = allComments[i];
    if (c.name !== username) continue;
    if (c.comment && c.comment.startsWith('{"type":"call"')) {
      return { snippet: 'Started a call', timestamp: c.timestamp };
    }
    return { snippet: c.comment || '', timestamp: c.timestamp };
  }
  return null;
}

function renderPeopleList(filterText = '') {
  commentsDiv.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.id = 'people-search-wrap';
  wrap.innerHTML = `<input type="text" id="people-search" placeholder="Search people…" value="${filterText.replace(/"/g,'&quot;')}">`;
  commentsDiv.appendChild(wrap);

  const q = filterText.trim().toLowerCase();
  let people = allMembers.filter(m => !q || m.name.toLowerCase().includes(q));

  // Sort: self first, then by most recent activity
  people = people.map(m => ({ ...m, last: lastRealMessage(m.name) }))
    .sort((a, b) => {
      if (a.name === userName) return -1;
      if (b.name === userName) return 1;
      const ta = a.last ? a.last.timestamp : 0;
      const tb = b.last ? b.last.timestamp : 0;
      return tb - ta;
    });

  if (!people.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<i class="fas fa-user-slash"></i><span>No people found</span>`;
    commentsDiv.appendChild(empty);
  } else {
    people.forEach(p => {
      const row = document.createElement('div');
      row.className = 'person-row';
      const isSelf = p.name === userName;
      const av = avatarSrcFor(p.name);
      row.innerHTML = `
        <img src="${av}" class="avatar" onerror="this.src='https://via.placeholder.com/46?text=@'">
        <div class="person-info">
          <div class="person-name-row">
            <span class="person-name ${isSelf ? 'self-tag' : ''}">${p.name}</span>
          </div>
          <div class="person-snippet">${p.last ? p.last.snippet.substring(0,60) : (isSelf ? 'Visit your thread' : 'No messages yet')}</div>
        </div>
        <div class="person-meta">
          <span class="person-time">${p.last ? formatRelative(p.last.timestamp) : ''}</span>
          ${!isSelf ? `<button class="person-call-btn" title="Call ${p.name}" data-call="${p.name}"><i class="fas fa-phone"></i></button>` : `<span style="width:32px;height:32px;"></span>`}
        </div>`;
      row.addEventListener('click', (e) => {
        if (e.target.closest('.person-call-btn')) return;
        openUserThread(p.name);
      });
      const callIcon = row.querySelector('.person-call-btn');
      if (callIcon) callIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        quickCall(p.name);
      });
      commentsDiv.appendChild(row);
    });
  }

  document.getElementById('people-search').addEventListener('input', (e) => {
    renderPeopleList(e.target.value);
    document.getElementById('people-search').focus();
    const el = document.getElementById('people-search');
    el.setSelectionRange(el.value.length, el.value.length);
  });
}

/* ════════════════════════════════
   RENDER — used by "All Messages" and Thread views
════════════════════════════════ */
function renderComments(msgsIn, silent = false, opts = {}) {
  const wasAtBottom = Math.abs(commentsDiv.scrollHeight - commentsDiv.clientHeight - commentsDiv.scrollTop) < 150;

  let msgs = msgsIn;
  commentsDiv.innerHTML = '';

  if (!msgs.length) {
    const isThread = opts.isThread;
    const tUser = opts.threadUser;
    commentsDiv.innerHTML = `
      <div class="today-empty">
        <div class="today-empty-icon">
          <i class="fas fa-${isThread ? 'user-check' : 'moon'}"></i>
        </div>
        <h3>${isThread ? (tUser === userName ? 'No messages yet' : `Nothing from ${tUser} yet`) : 'Quiet in here'}</h3>
        <p>${isThread
          ? (tUser === userName
              ? 'Messages you send, and replies to them, will show up here.'
              : `Messages ${tUser} sends, and replies to them, will show up here. Say hello to start the conversation.`)
          : 'No messages have been sent yet. Be the first to say something!'
        }</p>
      </div>`;
    return;
  }

  const grouped = {};
  msgs.forEach(c => {
    const ds = toDateStr(c.timestamp);
    if (!grouped[ds]) grouped[ds] = [];
    grouped[ds].push(c);
  });

  Object.keys(grouped).sort().forEach(ds => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'date-group';

    const divider = document.createElement('div');
    divider.className = 'date-divider';
    divider.innerHTML = `<span class="date-divider-label">${formatDateLabel(ds)}</span>`;
    groupDiv.appendChild(divider);

    let prevSender = null;

    grouped[ds].forEach(c => {
      /* ── Call card ── */
      if (c.comment && c.comment.startsWith('{"type":"call"')) {
        try {
          const callData = JSON.parse(c.comment);
          if (callData.type === 'call') {
            const isOwn = c.name === userName;
            const isInvited = callData.isAllUsers || (callData.invitees||[]).some(i => i.username === userName);
            if (!isInvited && !isOwn) return;

            const msg = document.createElement('div');
            msg.className = `message ${isOwn ? 'own' : ''} new-sender`;
            msg.innerHTML = buildCallCard(c, callData);

            if (isOwn) {
              const acts = document.createElement('div');
              acts.className = 'msg-actions';
              acts.style.opacity = '0';
              acts.innerHTML = `<button class="action-btn delete-btn" onclick="deleteMsg('${c.timestamp}')"><i class="fas fa-trash"></i> Delete</button>`;
              const mc = msg.querySelector('.message-content');
              if (mc) mc.appendChild(acts);
              msg.addEventListener('mouseenter', () => acts.style.opacity = '1');
              msg.addEventListener('mouseleave', () => acts.style.opacity = '0');
            }
            groupDiv.appendChild(msg);
            prevSender = null;
            return;
          }
        } catch(e) {}
      }

      const isOwn     = c.name === userName;
      const isSame    = (prevSender === c.name);
      const mediaLink = getLh3Link(c.fileLink);

      let mediaHtml = '';
      if (mediaLink) {
        const ext = (c.fileLink||'').toLowerCase();
        if (ext.match(/\.(mp4|mov|webm|m4v)$/i) || (c.fileType&&c.fileType.includes('video'))) {
          mediaHtml = `<div class="video-container"><iframe src="${c.fileLink}" allowfullscreen allow="autoplay;fullscreen;picture-in-picture" loading="lazy"></iframe></div>`;
        } else if (ext.match(/\.(mp3|wav|ogg|aac|m4a)$/i) || (c.fileType&&c.fileType.includes('audio'))) {
          mediaHtml = `<div class="audio-container"><iframe src="${c.fileLink}" allow="autoplay" loading="lazy" style="height:80px;"></iframe></div>`;
        } else {
          mediaHtml = `<div class="media-content"><img src="${mediaLink}" loading="lazy"></div>`;
        }
      }

      const replyHtml = c.replyTo ? `
        <div class="quoted-msg">
          <strong>@${c.replyTo.name}</strong>: ${c.replyTo.text.substring(0,60)}${c.replyTo.text.length>60?'…':''}
        </div>` : '';

      const isPending = !!c.pending;
      const isFailed  = !!c.failed;

      const actionsHtml = isPending ? '' : `
        <div class="msg-actions">
          <button class="action-btn" onclick="setReply('${c.name}','${(c.comment||'').replace(/'/g,"\\'")}')"><i class="fas fa-reply"></i> Reply</button>
          ${isOwn ? `
            <button class="action-btn" onclick="startEdit('${c.timestamp}','${(c.comment||'').replace(/'/g,"\\'")}')"><i class="fas fa-edit"></i> Edit</button>
            <button class="action-btn delete-btn" onclick="deleteMsg('${c.timestamp}')"><i class="fas fa-trash"></i></button>
          ` : ''}
        </div>`;

      const timeHtml = isFailed
        ? `<span class="msg-time failed-time"><i class="fas fa-exclamation-circle"></i> Failed — will retry</span>`
        : isPending
          ? `<span class="msg-time pending-time"><i class="fas fa-clock"></i> Sending…</span>`
          : `<span class="msg-time">${formatTime(c.timestamp)}</span>`;

      const avSrc = `https://lh3.googleusercontent.com/d/${extractFileId(c.picLink)}`;

      const msg = document.createElement('div');
      msg.className = `message ${isOwn ? 'own' : ''} ${!isSame ? 'new-sender' : 'same-sender'} ${isPending ? 'pending' : ''} ${isFailed ? 'failed' : ''}`;

      msg.innerHTML = `
        ${!isOwn ? `<img src="${avSrc}" class="avatar" onerror="this.style.visibility='hidden'">` : ''}
        <div class="message-content">
          ${!isSame ? `<div class="msg-name" onclick="${isOwn ? '' : `openUserThread('${c.name.replace(/'/g,"\\'")}')`}">
            ${c.name}
            <img src="${(memberMap[c.name]?.isAdmin) ? 'admin-icon.svg' : 'member-icon.svg'}"
                 style="width:16px;height:16px;vertical-align:middle;margin-left:4px;opacity:0.85;position:relative;top:-1px;">
          </div>` : ''}
          ${replyHtml}
          ${mediaHtml}
          <div class="msg-text" id="text-${c.timestamp}">${c.comment}</div>
          <div class="msg-footer">
            ${timeHtml}
            ${actionsHtml}
          </div>
        </div>
        ${isOwn ? `<img src="${avSrc}" class="avatar ${isSame ? 'same-sender' : ''}" onerror="this.style.visibility='hidden'">` : ''}
      `;

      groupDiv.appendChild(msg);
      prevSender = c.name;
    });

    commentsDiv.appendChild(groupDiv);
  });

  if (!silent || wasAtBottom) scrollToBottom(true);
}

/* ════════════════════════════════
   RE-RENDER CURRENT VIEW (after new data arrives)
════════════════════════════════ */
function refreshCurrentView(silent) {
  if (currentView === 'people') {
    const q = document.getElementById('people-search')?.value || '';
    renderPeopleList(q);
  } else if (currentView === 'all') {
    renderComments(allComments, silent);
  } else if (currentView === 'thread' && activeThreadUser) {
    renderComments(getThreadFor(activeThreadUser), silent, { isThread: true, threadUser: activeThreadUser });
  }
  updateViewBar();
}

/* ════════════════════════════════
   LOAD COMMENTS FROM SERVER
════════════════════════════════ */
let allComments = []; // oldest first

async function loadComments(silent = true) {
  try {
    const response = await fetch(`${scriptUrl}?operation=getData`);
    const data = await response.json();

    if (data.offline) throw new Error('offline-response');

    if (silent && data.comments.length === lastCommentCount) {
      setOnlineStatus(true);
      maybeFlushPending();
      return;
    }
    lastCommentCount = data.comments.length;

    if (data.announcements) updateAnnBadge(data.announcements.length);

    allComments = [...data.comments].reverse(); // oldest first
    cacheComments(allComments, data.announcements);
    setOnlineStatus(true);
    mergeInPendingDrafts();
    maybeFlushPending();

    refreshCurrentView(silent);
  } catch(err) {
    console.error('Failed to load messages:', err);
    setOnlineStatus(false);
    if (!silent) loadFromCache();
  }
}

/* ════════════════════════════════
   OFFLINE CACHE (view)
════════════════════════════════ */
function cacheComments(comments, announcements) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      comments, announcements: announcements || [], cachedAt: Date.now()
    }));
  } catch(e) { /* storage full/unavailable — fail quietly */ }
}

function loadFromCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) {
      if (!allComments.length) {
        commentsDiv.innerHTML = `<div class="empty-state"><i class="fas fa-wifi"></i><span>No cached messages yet. Connect once to sync.</span></div>`;
      }
      return;
    }
    const cached = JSON.parse(raw);
    allComments = cached.comments || [];
    mergeInPendingDrafts();
    refreshCurrentView(true);
    showToast('Offline — showing last synced messages', 'info');
  } catch(e) { /* corrupted cache — ignore */ }
}

function setOnlineStatus(online) {
  const wasOnline = isOnline;
  isOnline = online;
  updateViewBar();
  if (!wasOnline && online) flushPendingDrafts();
}

/* ════════════════════════════════
   OFFLINE DRAFTS (send)
════════════════════════════════ */
function getPendingDrafts() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch(e) { return []; }
}

function savePendingDrafts(list) {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch(e) {}
}

function mergeInPendingDrafts() {
  const pending = getPendingDrafts();
  if (!pending.length) return;
  const existingIds = new Set(allComments.map(c => String(c.timestamp)));
  pending.forEach(p => {
    if (!existingIds.has(String(p.timestamp))) {
      allComments.push({
        name: userName,
        comment: p.comment,
        timestamp: p.timestamp,
        picLink: localStorage.getItem('userPicLink') || '',
        fileLink: '', fileType: '',
        replyTo: p.replyTo || null,
        pending: true,
        failed: !!p.failed
      });
    }
  });
  allComments.sort((a, b) => a.timestamp - b.timestamp);
}

function queueDraft(text) {
  const draft = {
    localId: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    timestamp: Date.now(),
    comment: text,
    replyTo: replyingTo,
    failed: false
  };
  const pending = getPendingDrafts();
  pending.push(draft);
  savePendingDrafts(pending);
  mergeInPendingDrafts();
  registerBackgroundSync();
}

let isFlushingDrafts = false;
async function flushPendingDrafts() {
  if (isFlushingDrafts) return;
  isFlushingDrafts = true;
  try {
    let pending = getPendingDrafts();
    if (!pending.length) return;

    for (const draft of [...pending]) {
      try {
        const res = await fetch(scriptUrl, {
          method: 'POST',
          body: JSON.stringify({ operation: 'postComment', name: userName, comment: draft.comment, file: null, replyTo: draft.replyTo })
        });
        const r = await res.json();
        if (r.status === 'success') {
          pending = pending.filter(p => p.localId !== draft.localId);
          savePendingDrafts(pending);
        } else if (r.status === 'queued' || r.offline) {
          break;
        } else {
          draft.failed = true;
        }
      } catch (e) {
        break;
      }
    }
    savePendingDrafts(pending);
    await loadComments(false);
  } finally {
    isFlushingDrafts = false;
  }
}

async function registerBackgroundSync() {
  try {
    if ('serviceWorker' in navigator && 'SyncManager' in window) {
      const reg = await navigator.serviceWorker.ready;
      await reg.sync.register('sync-pending-messages');
    }
  } catch(e) { /* background sync unsupported — 'online' listener still covers it */ }
}

window.addEventListener('online', () => {
  showToast('Back online — syncing…', 'info');
  setOnlineStatus(true);
  if (isApproved) { loadComments(true); startPolling(); }
});

window.addEventListener('offline', () => {
  setOnlineStatus(false);
  if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data?.type === 'FLUSH_PENDING_MESSAGES') flushPendingDrafts();
  });
}

/* ════════════════════════════════
   STATUS CHECK
════════════════════════════════ */
async function checkUserStatus() {
  try {
    const res  = await fetch(`${scriptUrl}?operation=getUserStatus&name=${encodeURIComponent(userName)}`);
    const data = await res.json();
    if (data.status !== 'success') { showToast('Cannot verify account', 'error'); return; }

    const status = data.userStatus.toLowerCase();
    isApproved = (status === 'approved');
    localStorage.setItem('rc_last_approved', isApproved ? '1' : '0');
    setOnlineStatus(true);

    memberMap[userName] = { isAdmin: data.isAdmin, role: data.role, picLink: localStorage.getItem('userPicLink') || '' };
    allMembers = [{ name: userName, isAdmin: data.isAdmin, role: data.role, picLink: localStorage.getItem('userPicLink') || '' }];

    try {
      const mres = await fetch(`${scriptUrl}?operation=getMembers`);
      const mdata = await mres.json();
      (mdata.users || []).forEach(u => {
        memberMap[u.name] = { isAdmin: u.isAdmin, role: u.role, picLink: u.picLink || '' };
        if (u.name !== userName) allMembers.push({ name: u.name, isAdmin: u.isAdmin, role: u.role, picLink: u.picLink || '', status: u.status });
      });
    } catch(e) {}

    if (isApproved) {
      await loadComments(false);
      renderPeopleList();
      updateViewBar();
      startPolling();
      commentInput.focus();
    } else {
      commentsDiv.innerHTML = buildPendingView(userName, status);
      commentInput.disabled = true;
      commentInput.placeholder = 'Account awaiting approval…';
      commentInput.style.opacity = '0.5';
      sendBtn.disabled = true;
      sendBtn.style.opacity = '0.4';
      addFileBtn.disabled = true;
      addFileBtn.style.opacity = '0.4';
      if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
      showToast('Your account is awaiting approval', 'info');
    }
  } catch(err) {
    console.error(err);
    setOnlineStatus(false);
    const lastApproved = localStorage.getItem('rc_last_approved') === '1';
    if (lastApproved) {
      isApproved = true;
      loadFromCache();
      commentInput.focus();
      startPolling();
    } else {
      commentsDiv.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><span>Could not verify account. Please try again.</span></div>`;
    }
  }
}

/* ════════════════════════════════
   SEND MESSAGE
════════════════════════════════ */
async function sendMessage() {
  const text = commentInput.value.trim();
  if (!text && !selectedFileData) return;

  if (!isOnline && !selectedFileData) {
    queueDraft(text);
    commentInput.value = '';
    commentInput.style.height = 'auto';
    cancelReply();
    if (currentView !== 'people') refreshCurrentView(false);
    showToast('No connection — message will send automatically once you\'re back online', 'info');
    return;
  }

  sendBtn.disabled = true;
  try {
    const res = await fetch(scriptUrl, {
      method: 'POST',
      body: JSON.stringify({ operation:'postComment', name:userName, comment:text, file:selectedFileData, replyTo:replyingTo })
    });
    const r = await res.json();
    if (r.status==='success') {
      commentInput.value = '';
      commentInput.style.height = 'auto';
      cancelReply();
      if (selectedFileData) removeFileBtn.click();
      setOnlineStatus(true);
      await loadComments(false);
    } else if (r.status === 'queued' || r.offline) {
      setOnlineStatus(false);
      queueDraft(text);
      commentInput.value = '';
      commentInput.style.height = 'auto';
      cancelReply();
      if (currentView !== 'people') refreshCurrentView(false);
      showToast('No connection — message queued to send', 'info');
    } else showToast(r.message||'Failed to send','error');
  } catch {
    setOnlineStatus(false);
    queueDraft(text);
    commentInput.value = '';
    commentInput.style.height = 'auto';
    cancelReply();
    if (currentView !== 'people') refreshCurrentView(false);
    showToast('Connection lost — message queued to send', 'info');
  }
  finally { sendBtn.disabled = false; }
}

sendBtn.addEventListener('click', sendMessage);
commentInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  // Shift+Enter inserts a newline naturally — paragraphs are supported.
});

function startPolling() {
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(() => loadComments(true), 8000);

document.addEventListener('visibilitychange', () => {

function openProfileModal() {

  modalAvatar.src = userAvatarImg.src;
  modalError.textContent = '';

modalAvatarInput.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const size = 300;
      canvas.width = canvas.height = size;
      ctx.clearRect(0,0,size,size);
      ctx.beginPath();
      ctx.arc(size/2,size/2,size/2,0,Math.PI*2);
      ctx.closePath();
      ctx.clip();
      let dw,dh,dx,dy;
      if (img.width > img.height) { dh=size; dw=img.width*(size/img.height); dx=-(dw-size)/2; dy=0; }
      else { dw=size; dh=img.height*(size/img.width); dx=0; dy=-(dh-size)/2; }
      ctx.drawImage(img,dx,dy,dw,dh);
      const dataUrl = canvas.toDataURL('image/png');
      processedAvatarBase64 = dataUrl.split(',')[1];
      modalAvatar.src = dataUrl;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

modalSaveBtn.addEventListener('click', async () => {
  const newName = (modalNameInput.value||'').trim();
  const nameChanged   = newName && newName !== userName;
  const avatarChanged = !!processedAvatarBase64;

  modalSaveBtn.disabled = true;
  modalSaveBtn.textContent = 'Saving…';
  try {
    const payload = { operation:'updateProfile', oldName:userName, identityCode:localStorage.getItem('userIdCode') };
    if (nameChanged) payload.newName = newName;
    if (avatarChanged) { payload.imageData = processedAvatarBase64; payload.imageName = `${newName||userName}_avatar.png`; }
    const res  = await fetch(scriptUrl, { method:'POST', body:JSON.stringify(payload) });
    const result = await res.json();
    if (result.status==='success') {
      if (nameChanged) { localStorage.setItem('userName', result.newName||newName); userName = result.newName||newName; }
      if (avatarChanged && result.picLink) {
        localStorage.setItem('userPicLink', result.picLink);
        userAvatarImg.src = result.picLink;
      }
      showToast('Profile updated');
      processedAvatarBase64 = '';
      closeProfileModal();
      loadComments(false);
    } else { modalError.textContent = result.message||'Update failed'; }
  } catch { modalError.textContent = 'Connection error'; }
  finally { modalSaveBtn.disabled = false; modalSaveBtn.textContent = 'Save Changes'; }
});

  const picLink = memberMap[username]?.picLink || '';
  showToast(`Calling ${username}…`, 'info');

        username: userName,
        picLink: localStorage.getItem('userPicLink') || '',
