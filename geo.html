<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Events &amp; Directions — Riverside Connect</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Riverside Connect" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="maskable_icon_x192.png"
    />
    <style>
      :root {
        --ink: #e2e8f0;
        --paper: #0a0f1e;
        --sf: #0f172a;
        --lift: #1a2540;
        --wire: rgba(96, 165, 250, 0.18);
        --steel: #64748b;
        --lead: #94a3b8;
        --a: #3b82f6;
        --a2: #60a5fa;
        --gold: #facc15;
        --red: #ef4444;
        --green: #10b981;
        --bar: 52px;
        --top: calc(var(--bar) + env(safe-area-inset-top, 0px));
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.45 "DM Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--a2);
        outline-offset: 2px;
      }
      svg {
        flex-shrink: 0;
        vertical-align: -3px;
      }
      #top {
        position: fixed;
        inset: 0 0 auto;
        height: var(--top);
        padding: env(safe-area-inset-top, 0px) 8px 0;
        background: rgba(10, 15, 30, 0.92);
        border-bottom: 1px solid var(--wire);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(16px);
      }
      .ib {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: none;
        border: 0;
        border-radius: 9px;
        color: var(--lead);
        cursor: pointer;
        text-decoration: none;
      }
      .ib:hover {
        background: var(--lift);
        color: var(--a2);
      }
      .ib.spin svg {
        animation: sp 0.8s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .ttl {
        font:
          400 1.2rem "Bebas Neue",
          Impact,
          "Arial Narrow",
          sans-serif;
        letter-spacing: 0.06em;
        color: var(--a2);
        flex: 1;
        white-space: nowrap;
      }
      .pill {
        font-size: 0.64rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 99px;
        background: rgba(96, 165, 250, 0.14);
        color: var(--a2);
      }
      .pill.admin {
        background: rgba(250, 204, 21, 0.14);
        color: var(--gold);
      }
      #off {
        display: none;
        background: rgba(250, 204, 21, 0.14);
        color: var(--gold);
      }
      body.offline #off {
        display: inline-block;
      }
      main {
        padding: calc(var(--top) + 12px) 14px 96px;
        max-width: 1120px;
        margin: auto;
        display: grid;
        gap: 16px;
      }
      @media (min-width: 900px) {
        main {
          grid-template-columns: 1fr 390px;
          padding-bottom: 20px;
          align-items: start;
        }
        #grace {
          position: sticky;
          top: calc(var(--top) + 12px);
          height: calc(100dvh - var(--top) - 32px);
        }
        #fab-g,
        #gx,
        #bub {
          display: none !important;
        }
      }
      @media (max-width: 899px) {
        #grace {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 82dvh;
          border-radius: 18px 18px 0 0;
          transform: translateY(105%);
          transition: transform 0.25s;
          z-index: 60;
        }
        #grace.open {
          transform: none;
        }
      }
      h1 {
        font:
          400 1.7rem "Bebas Neue",
          Impact,
          sans-serif;
        letter-spacing: 0.04em;
      }
      .sub {
        color: var(--lead);
        font-size: 0.85rem;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .loc {
        margin-top: 10px;
        padding: 10px 12px;
        background: rgba(59, 130, 246, 0.08);
        border: 1px solid var(--wire);
        border-radius: 10px;
        font-size: 0.8rem;
        color: var(--lead);
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .srch {
        position: relative;
        margin-top: 12px;
      }
      .srch svg {
        position: absolute;
        left: 12px;
        top: 11px;
        color: var(--steel);
      }
      #q {
        width: 100%;
        background: var(--sf);
        border: 1px solid var(--wire);
        border-radius: 10px;
        padding: 10px 38px;
        font-size: 0.9rem;
      }
      #q:focus {
        outline: 0;
        border-color: var(--a2);
      }
      #qx {
        position: absolute;
        right: 6px;
        top: 6px;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 50%;
        background: var(--lift);
        color: var(--lead);
        display: none;
        place-items: center;
        cursor: pointer;
      }
      #qx.on {
        display: grid;
      }
      #list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .ev {
        background: var(--sf);
        border: 1px solid var(--wire);
        border-radius: 14px;
        padding: 14px;
        transition:
          box-shadow 0.3s,
          border-color 0.3s;
      }
      .ev.hl {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.3);
      }
      .et {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
      }
      .et b {
        font-size: 1.02rem;
      }
      .dist {
        font-size: 0.72rem;
        color: var(--green);
        background: rgba(16, 185, 129, 0.12);
        padding: 3px 9px;
        border-radius: 99px;
        white-space: nowrap;
      }
      .dist.na {
        color: var(--steel);
        background: rgba(100, 116, 139, 0.12);
      }
      .desc {
        margin-top: 6px;
        font-size: 0.86rem;
        color: var(--lead);
        white-space: pre-wrap;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        cursor: pointer;
      }
      .desc.open {
        display: block;
      }
      .tm {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-top: 12px;
      }
      .tm button {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 7px 2px;
        border-radius: 10px;
        background: var(--lift);
        border: 1px solid var(--wire);
        color: var(--lead);
        font-size: 0.7rem;
        cursor: pointer;
      }
      .tm button span {
        font-size: 1.05rem;
      }
      .tm button b {
        color: var(--ink);
        font-size: 0.74rem;
      }
      .tm button.on {
        border-color: var(--gold);
        background: rgba(250, 204, 21, 0.1);
      }
      .act {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .b {
        flex: 1;
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        padding: 10px;
        border-radius: 10px;
        border: 0;
        background: var(--a);
        color: #fff;
        font-weight: 700;
        font-size: 0.84rem;
        text-decoration: none;
        cursor: pointer;
      }
      .b.g {
        background: var(--lift);
        color: var(--lead);
        flex: 0 0 auto;
        padding: 10px 14px;
      }
      .empty {
        padding: 30px 10px;
        text-align: center;
        color: var(--steel);
        font-size: 0.85rem;
      }
      #grace {
        background: rgba(15, 23, 42, 0.98);
        border: 1px solid var(--wire);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 18px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
      }
      .gh {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--wire);
      }
      .av {
        position: relative;
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--a), #6366f1);
        display: grid;
        place-items: center;
        font-size: 1.1rem;
      }
      .av i {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        border: 2px solid var(--sf);
      }
      body.offline .av i {
        background: var(--gold);
      }
      .gh > div:nth-child(2) {
        flex: 1;
        min-width: 0;
        line-height: 1.2;
      }
      .gh small {
        display: block;
        color: #34d399;
        font-size: 0.7rem;
      }
      body.offline .gh small {
        color: var(--gold);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
      }
      .m {
        max-width: 92%;
        padding: 8px 12px;
        border-radius: 14px;
        font-size: 0.86rem;
        line-height: 1.5;
        animation: in 0.25s both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .m.bot {
        align-self: flex-start;
        background: var(--lift);
        border-bottom-left-radius: 4px;
      }
      .m.me {
        align-self: flex-end;
        background: var(--a);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .m b {
        color: var(--gold);
      }
      .m.me b {
        color: #fff;
      }
      .dots {
        display: flex;
        gap: 4px;
        padding: 5px 2px;
      }
      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--a2);
        animation: bn 1.1s infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bn {
        0%,
        80%,
        100% {
          transform: none;
          opacity: 0.4;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      .ec {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
        padding: 10px;
        border: 1px solid var(--wire);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
      }
      .ec span {
        font-size: 0.76rem;
        color: var(--lead);
      }
      #chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 6px 12px;
        scrollbar-width: none;
      }
      #chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex-shrink: 0;
        padding: 6px 12px;
        border-radius: 99px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.28);
        color: var(--a2);
        font-size: 0.78rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .chip.hl {
        border-color: var(--gold);
        color: var(--gold);
      }
      .send {
        display: flex;
        gap: 8px;
        padding: 6px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      }
      .send input {
        flex: 1;
        min-width: 0;
        background: var(--paper);
        border: 1px solid var(--wire);
        border-radius: 99px;
        padding: 9px 14px;
      }
      .send input:focus {
        outline: 0;
        border-color: var(--a2);
      }
      .send button {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 0;
        background: var(--a);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      #fab-g {
        position: fixed;
        right: 16px;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid rgba(96, 165, 250, 0.45);
        background: linear-gradient(135deg, var(--a), #6366f1);
        font-size: 1.5rem;
        z-index: 55;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      #bub {
        position: fixed;
        right: 16px;
        bottom: calc(86px + env(safe-area-inset-bottom, 0px));
        max-width: min(280px, calc(100vw - 32px));
        background: rgba(15, 23, 42, 0.97);
        border: 1px solid var(--wire);
        border-radius: 14px 14px 4px 14px;
        padding: 9px 12px;
        font-size: 0.82rem;
        display: none;
        z-index: 55;
        cursor: pointer;
        animation: in 0.25s;
      }
      #bub.on {
        display: block;
      }
      .mbd {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 100;
        display: none;
        align-items: flex-end;
      }
      .mbd.on {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 560px;
        margin: auto auto 0;
        max-height: 90dvh;
        background: var(--sf);
        border-radius: 18px 18px 0 0;
        border-top: 1px solid var(--wire);
        display: flex;
        flex-direction: column;
      }
      @media (min-width: 900px) {
        .mbd {
          align-items: center;
        }
        .sheet {
          border-radius: 18px;
          margin: auto;
        }
      }
      .sh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--wire);
      }
      .sh h2 {
        font:
          400 1.25rem "Bebas Neue",
          Impact,
          sans-serif;
        letter-spacing: 0.05em;
      }
      .sb {
        padding: 16px;
        overflow-y: auto;
      }
      .f {
        margin-bottom: 12px;
      }
      .f label {
        display: block;
        font-size: 0.74rem;
        color: var(--steel);
        margin-bottom: 5px;
      }
      .f input,
      .f textarea {
        width: 100%;
        background: var(--lift);
        border: 1px solid var(--wire);
        border-radius: 9px;
        padding: 10px 12px;
        resize: vertical;
      }
      .f small {
        display: block;
        font-size: 0.7rem;
        color: var(--steel);
        margin-top: 4px;
      }
      .two {
        display: flex;
        gap: 8px;
      }
      .two .f {
        flex: 1;
      }
      .st {
        font-size: 0.72rem;
        padding: 6px 10px;
        border-radius: 7px;
        margin-top: 6px;
        display: none;
      }
      .st.on {
        display: block;
      }
      .st.ok {
        background: rgba(16, 185, 129, 0.12);
        color: var(--green);
      }
      .st.er {
        background: rgba(239, 68, 68, 0.12);
        color: var(--red);
      }
      .sf {
        padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--wire);
        display: flex;
        gap: 10px;
      }
      .sf .b.del {
        background: rgba(239, 68, 68, 0.12);
        color: var(--red);
      }
      #toast {
        position: fixed;
        top: calc(var(--top) + 8px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 200;
        display: grid;
        gap: 6px;
        pointer-events: none;
      }
      .tt {
        padding: 9px 16px;
        border-radius: 99px;
        font-size: 0.78rem;
        font-weight: 700;
        color: #fff;
        animation: in 0.25s;
      }
      .tt.ok {
        background: rgba(16, 185, 129, 0.95);
      }
      .tt.er {
        background: rgba(239, 68, 68, 0.95);
      }
      .tt.inf {
        background: rgba(59, 130, 246, 0.95);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header id="top">
      <a class="ib" href="index.html" title="Back" id="i-back"></a>
      <div class="ttl">EVENTS &amp; DIRECTIONS</div>
      <span class="pill" id="off">OFFLINE</span
      ><span class="pill" id="role">MEMBER</span>
      <button class="ib" id="ref" title="Refresh"></button>
    </header>

    <main>
      <section>
        <div class="row">
          <div style="flex: 1">
            <h1>Fellowships &amp; Locations</h1>
            <p class="sub">
              Search an event to see how far it is, how long it takes, and get
              going in Google Maps.
            </p>
          </div>
          <button
            class="b"
            id="add"
            style="display: none; flex: 0 0 auto"
            title="New event"
          ></button>
        </div>
        <div class="loc" id="loc">
          <span id="i-loc"></span
          ><span id="loct"
            >Tap to share your location so I can show distance and travel
            time</span
          >
        </div>
        <div class="srch">
          <span id="i-s"></span
          ><input
            id="q"
            type="search"
            placeholder="Search events…"
            autocomplete="off"
          /><button id="qx" title="Clear"></button>
        </div>
        <div id="list"><div class="empty">Loading events…</div></div>
      </section>

      <aside id="grace" aria-label="Grace, your guide">
        <div class="gh">
          <div class="av">🕊️<i></i></div>
          <div><b>Grace</b><small id="gsub">online</small></div>
          <button class="ib" id="gx" aria-label="Close"></button>
        </div>
        <div id="log" aria-live="polite"></div>
        <div id="chips"></div>
        <form class="send" id="gf">
          <input
            id="gin"
            placeholder="Ask Grace about any event…"
            autocomplete="off"
            maxlength="200"
            aria-label="Message Grace"
          /><button aria-label="Send" id="i-send"></button>
        </form>
      </aside>
    </main>

    <button id="fab-g" aria-label="Chat with Grace">🕊️</button>
    <div id="bub" role="status"></div>

    <div class="mbd" id="mb">
      <div class="sheet">
        <div class="sh">
          <h2 id="mt">New Event</h2>
          <button class="ib" id="mx"></button>
        </div>
        <div class="sb">
          <div class="f">
            <label>EVENT TITLE</label
            ><input id="ft" placeholder="Sunday Fellowship — Riverside Park" />
          </div>
          <div class="f">
            <label>DESCRIPTION (day, time, what to bring)</label
            ><textarea id="fd" rows="4"></textarea>
          </div>
          <button
            type="button"
            class="b g"
            id="ul"
            style="width: 100%; margin-bottom: 10px"
          ></button>
          <div class="f">
            <label>OR PASTE A GOOGLE MAPS LINK</label
            ><input id="fm" placeholder="https://maps.app.goo.gl/…" /><small
              >Google Maps → Share → Copy link.</small
            >
            <div class="st" id="fs"></div>
          </div>
          <div class="two">
            <div class="f">
              <label>LATITUDE</label><input id="fa" placeholder="auto-filled" />
            </div>
            <div class="f">
              <label>LONGITUDE</label
              ><input id="fo" placeholder="auto-filled" />
            </div>
          </div>
        </div>
        <div class="sf">
          <button class="b del" id="fdel" style="display: none">Remove</button
          ><button class="b" id="fsave">Save event</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>

    <script>
      "use strict";
      /* Only your own Apps Script backends are used. No map, routing or AI service.
   Directions open in Google Maps through a normal link. */
      const EVENTS_URL =
        "https://script.google.com/macros/s/AKfycbxqAd5h07uJYow9sWkYCTZbrMF9WWSvcMYM9r7Yn6Ib6FvlsqZ5K_VQq4q07WJcSLIQ/exec";
      const USER_URL =
        "https://script.google.com/macros/s/AKfycbwWv2rfL2mpy-62lwwPDBFVvTklnu43tVQ-IHMz-FW_h58slnPLSRWQ8HhS2UJoVIym/exec";
      const userName = localStorage.getItem("userName") || "";
      if (!userName) location.href = "login.html";
      const first = userName.split(" ")[0] || "friend";
      const $ = (s) => document.querySelector(s),
        sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const LS = {
        get(k, d) {
          try {
            const v = JSON.parse(localStorage.getItem(k));
            return v == null ? d : v;
          } catch {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch {}
        },
      };
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",

      function toast(m, t = "inf", d = 2800) {

      /* ── state ── */
      let events = LS.get("rm_events_cache", []),

      const wide = () => matchMedia("(min-width:900px)").matches;

      /* ── geo helpers ── */
      function hav(a, b) {
        const R = 6371,
          r = Math.PI / 180,
          dl = (b.lat - a.lat) * r,
          dg = (b.lng - a.lng) * r,
          x =
            Math.sin(dl / 2) ** 2 +
            Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dg / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));

      const ok = (e) =>
        e &&
        e.lat !== "" &&
        e.lng !== "" &&

        !isNaN(parseFloat(e.lng));
      function ll(url) {
        if (!url) return null;
        for (const re of [
          /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
          /@(-?\d+\.\d+),(-?\d+\.\d+)/,
          /[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/,
          /[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/,
        ]) {
          const m = url.match(re);
          if (m) return { lat: +m[1], lng: +m[2] };

        return null;
      }
      const M = {
        walk: {
          n: "Walking",
          e: "🚶",
          v: 5,
          tr: 0,
          w: 0,
          g: "walking",
          by: "on foot",
        },
        boda: {
          n: "Boda boda",
          e: "🏍️",
          v: 32,
          tr: 0.8,
          w: 3,
          g: "two-wheeler",
          by: "by boda boda",
        },
        matatu: {
          n: "Matatu",
          e: "🚐",
          v: 22,
          tr: 1,
          w: 8,
          g: "transit",
          by: "by matatu",
        },
        car: {
          n: "Car / taxi",
          e: "🚗",
          v: 30,
          tr: 1,
          w: 2,
          g: "driving",
          by: "by car",
        },
      };
      const MK = Object.keys(M);
      function traffic() {
        const d = new Date(),
          h = d.getHours() + d.getMinutes() / 60,
          wd = d.getDay(),
          w = wd > 0 && wd < 6;
        if (w && ((h >= 6.5 && h < 9.5) || (h >= 16.5 && h < 20)))
          return { f: 0.6, l: "rush hour" };
        if (h >= 22 || h < 5) return { f: 1.15, l: "quiet night roads" };
        if (w && h >= 9.5 && h < 16.5) return { f: 0.85, l: "daytime traffic" };
        return { f: 1, l: "light traffic" };
      }
      const mins = (km, k) => {
        const m = M[k],

          km,
          t: Object.fromEntries(MK.map((k) => [k, mins(km, k)])),

      }
      const fastest = (i) => MK.reduce((a, b) => (i.t[b] < i.t[a] ? b : a));
      function gm(e, k) {

          return `https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}&travelmode=${g}`;
        return e.mapLink || "#";
      }

      /* ── role ── */

      /* ── events list ── */

          return;

        L.innerHTML = f
          .map((e) => {
            const i = info(e);

      /* ═════════ GRACE — on-device conversation, no outside service ═════════ */
      const G = {
        q: Promise.resolve(),

      const log = $("#log"),

        return a[i];
      };
      const fmt = (t) =>

          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")

      const isOpen = () => wide() || G.open;
      function gsub() {

      }
      function say(text, o = {}) {

          .then(async () => {

              '<div class="dots"><span></span><span></span><span></span></div>';

          .catch(() => {});

      }
      function meSay(t) {

      const rEv = () =>

      function ask(t) {

      $("#gf").onsubmit = (e) => {

        const m = a.length,
          n = b.length;
        if (!m) return n;
        if (!n) return m;

        for (let i = 1; i <= m; i++) {
          const c = [i];
          for (let j = 1; j <= n; j++)
            c[j] = Math.min(
              p[j] + 1,
              c[j - 1] + 1,
              p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
            );
          p = c;
        }
        return p[n];

      function tm(t, w) {
        if (t === w) return 1;
        if (t.length >= 4 && w.length >= 4) {

          const d = lev(t, w);

          qt.forEach((w) => {

            tt.forEach((t) => (b = Math.max(b, tm(t, w))));

          say(
            P("sn", [
              `Nothing matches “${s}”. Try a shorter word, or ask me — I can match misspellings.`,
              `No events for “${s}”. Want the full list instead?`,
            ]),
            { chips: [{ l: "📋 List events", f: () => ask("list events") }] },
          );
        else if (n === 1 && me) {
          const e = filtered()[0],
            i = info(e);
          if (i)
            say(
              `Only one match: **${short(e.title)}** — ${fk(i.km)} away, about ${dur(i.t[mode])} ${M[mode].by}.`,
              { ev: e, quiet: true },
            );
        }
      };
      G.afterSave = (t, ed) =>
        say(
          ed
            ? `Updated **${t}** — members will see the change.`
            : `**${t}** is posted. Members can now search it and get directions.`,
          { quiet: false },
        );
      addEventListener("online", () => {
        gsub();
        document.body.classList.remove("offline");
        loadEvents();
        checkRole();
        say(
          P("on", [
            "Back online — I've refreshed the events.",
            "Connection's back. Events are up to date.",
          ]),
        );
      });
      addEventListener("offline", () => {
        gsub();
        document.body.classList.add("offline");
        say(
          P("of", [
            "We're offline. I still have your saved events and can estimate trips.",
            "Lost the connection — no worries, I'm still here with the last events I loaded.",
          ]),
        );
      });
      document.body.classList.toggle("offline", !navigator.onLine);
      /* idle nudges: a gentle, different line each time, never more than three */
      setInterval(() => {
        if (
          G.nudges >= 3 ||
          Date.now() - G.idle < 70000 ||
          document.hidden ||
          !events.length
        )
          return;
        G.nudges++;
        G.idle = Date.now();
        const e = rEv();
        say(
          P("nd", [
            `Thinking of going to **${short(e.title)}**? I can tell you how long it takes.`,
            `Psst — ${e.title.length < 40 ? "“" + e.title + "”" : "one of the events"} might be worth a look. Want the details?`,
            `Still planning, ${first}? Just name an event and I'll do the rest.`,
          ]),
          {
            chips: [
              {
                l: "ℹ️ Tell me about it",
                hl: true,
                f: () => ask("tell me about " + e.title),
              },
              ...defChips().slice(0, 3),
            ],
          },
        );
      }, 15000);

      async function gInit() {
        gsub();
        setChips(defChips());
        await Promise.race([checkRole(), sleep(1500)]);
        const seen = LS.get("rm_grace_seen", false),
          n = events.length,
          t = traffic();
        if (!seen) {
          if (!wide()) openG();
          await say(`${greet()}, **${first}**! 👋 I'm **Grace**, your guide.`);
          await say(
            `Search or pick any event and I'll tell you **how far** it is and **how long** it takes by foot, boda, matatu or car. When you're ready, **Start journey** opens Google Maps.${isAdmin ? " You're an **admin**, so I can also help you add and edit events." : ""}`,
          );
          await say(
            "Tap **Share location** (or allow it when asked) so I can measure the trip. I work offline too.",
            {
              quiet: true,
              chips: [
                {
                  l: "📍 Share location",
                  hl: true,
                  f: () => ask("use my location"),
                },
                { l: "📋 List events", f: () => ask("list events") },
                { l: "❓ Help", f: () => ask("help") },
              ],
            },
          );
          LS.set("rm_grace_seen", true);
        } else {
          const lines = [
            `${greet()}, ${first}. ${n ? `There ${n > 1 ? "are" : "is"} **${n}** event${n > 1 ? "s" : ""} on.` : "No events are posted yet."} Where are you headed?`,
            `Welcome back, ${first}! ${t.f < 0.8 ? "Heads up: it's " + t.l + " right now." : "Pick an event and I'll get you there."}`,
            `${greet()}! Ask me about any event — distance, time or directions.`,
          ];
          const l = P("init", lines);
          await say(l, { quiet: wide() ? false : false });
        }
      }
      if ("serviceWorker" in navigator)
        addEventListener("load", () =>
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .catch(() => {}),
        );
      roleUI();
      render();
      loadEvents().then(gInit);
      if (navigator.permissions && navigator.permissions.query)
        navigator.permissions
          .query({ name: "geolocation" })
          .then((r) => {
            if (r.state === "granted") locate();
          })
          .catch(() => {});
    </script>
  </body>
</html>
