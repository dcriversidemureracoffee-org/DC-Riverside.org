<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riverside Mapping — Riverside Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="manifest" href="./manifest.json">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Riverside Connect">
  <link rel="apple-touch-icon" sizes="180x180" href="maskable_icon_x192.png">

  <style>
    :root {
      --ink:       #e2e8f0;
      --paper:     #0a0f1e;
      --surface:   #0f172a;
      --lift:      #1a2540;
      --wire:      rgba(96,165,250,0.18);
      --steel:     #64748b;
      --lead:      #94a3b8;
      --accent:    #3b82f6;
      --accent2:   #60a5fa;
      --gold:      #facc15;
      --danger:    #ef4444;
      --green:     #10b981;
      --trail-color: #f8fafc;

      --font-head: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;

      --bar-h: 50px;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      height: 100dvh;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--bar-h);
      background: rgba(10,15,30,0.92);
      border-bottom: 1px solid var(--wire);
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      backdrop-filter: blur(16px);
    }
    .tb-icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; border-radius: 9px;
      color: var(--lead); cursor: pointer; font-size: 0.95rem;
      transition: all 0.15s; flex-shrink: 0; text-decoration: none;
    }
    .tb-icon-btn:hover { color: var(--accent2); background: var(--lift); }
    .tb-icon-btn.on { color: var(--accent2); background: var(--lift); box-shadow: 0 0 0 1px var(--accent2) inset; }
    .tb-title {
      font-family: var(--font-head);
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      color: var(--accent2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tb-spacer { flex: 1; }

    #scroll-area {
      position: fixed;
      top: var(--bar-h); left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 90px;
    }

    .geo-intro { padding: 16px 16px 4px; }
    .geo-intro h1 {
      font-family: var(--font-head);
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    .geo-intro p { font-size: 0.82rem; color: var(--lead); margin-top: 2px; }

    .loc-permission-row {
      margin: 10px 16px 0;
      padding: 10px 12px;
      background: rgba(59,130,246,0.08);
      border: 1px solid var(--wire);
      border-radius: 10px;
      font-size: 0.78rem;
      color: var(--lead);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .loc-permission-row i { color: var(--accent2); }

    /* ── SEARCH BAR ─────────────────────────────────────────────── */
    .search-row {
      margin: 12px 16px 0;
      position: relative;
    }
    .search-row i.fa-magnifying-glass {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--steel);
      font-size: 0.85rem;
      pointer-events: none;
    }
    #event-search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--wire);
      border-radius: 10px;
      padding: 10px 36px;
      color: var(--ink);
      font-size: 0.85rem;
      font-family: var(--font-body);
    }
    #event-search:focus { outline: none; border-color: var(--accent2); }
    .search-clear-btn {
      position: absolute;
      right: 6px; top: 50%;
      transform: translateY(-50%);
      width: 26px; height: 26px;
      border: none;
      background: var(--lift);
      color: var(--lead);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .search-clear-btn.show { display: flex; }

    #events-list { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; }

    .event-card {
      background: var(--surface);
      border: 1px solid var(--wire);
      border-radius: 14px;
      padding: 14px;
    }
    .event-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .event-title { font-weight: 700; font-size: 1rem; color: var(--ink); }
    .event-distance {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--green);
      background: rgba(16,185,129,0.12);
      padding: 3px 9px;
      border-radius: 100px;
      white-space: nowrap;
    }
    .event-distance.unknown { color: var(--steel); background: rgba(100,116,139,0.12); }

    .event-desc { margin-top: 6px; font-size: 0.85rem; line-height: 1.5; color: var(--lead); white-space: pre-wrap; }

    .event-actions { margin-top: 12px; display: flex; gap: 8px; }
    .event-btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: var(--font-body);
      transition: all .15s;
      text-decoration: none;
    }
    .event-btn.primary { background: var(--accent); color: #fff; }
    .event-btn.primary:hover { background: #2563eb; }
    .event-btn.ghost { background: var(--lift); color: var(--lead); }
    .event-btn.ghost:hover { color: var(--accent2); }

    .list-empty, .list-error-inline {
      padding: 30px 16px;
      text-align: center;
      color: var(--steel);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }
    .list-error-inline { color: var(--danger); }

    #fab-add {
      position: fixed;
      right: 18px;
      bottom: 24px;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 1.3rem;
      display: none;
      align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(59,130,246,0.45);
      cursor: pointer;
      z-index: 800;
    }
    #fab-add.visible { display: flex; }
    #fab-add:active { transform: scale(0.94); }

    #modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
    }
    #modal-backdrop.show { display: flex; }
    #modal-sheet {
      width: 100%;
      max-height: 88vh;
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      border-top: 1px solid var(--wire);
      display: flex;
      flex-direction: column;
      animation: sheetUp 0.2s ease;
    }
    @keyframes sheetUp { from { transform: translateY(24px); opacity:0; } to { transform: translateY(0); opacity:1; } }

    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--wire); flex-shrink: 0; }
    .modal-header h2 { font-family: var(--font-head); font-size: 1.2rem; letter-spacing: 0.05em; color: var(--ink); }
    .modal-close { width: 30px; height: 30px; border-radius: 50%; background: var(--lift); border: none; color: var(--lead); cursor: pointer; }

    .modal-body { padding: 16px; overflow-y: auto; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.72rem; font-family: var(--font-mono); letter-spacing: 0.06em; color: var(--steel); margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%;
      background: var(--lift);
      border: 1px solid var(--wire);
      border-radius: 9px;
      padding: 10px 12px;
      color: var(--ink);
      font-size: 0.88rem;
      font-family: var(--font-body);
      resize: vertical;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent2); }
    .field-hint { font-size: 0.7rem; color: var(--steel); margin-top: 4px; }
    .latlng-row { display: flex; gap: 8px; }
    .latlng-row .field { flex: 1; margin-bottom: 0; }
    .latlng-status { margin-top: 8px; font-family: var(--font-mono); font-size: 0.7rem; padding: 6px 10px; border-radius: 7px; display: none; }
    .latlng-status.show { display: block; }
    .latlng-status.ok { background: rgba(16,185,129,0.12); color: var(--green); }
    .latlng-status.err { background: rgba(239,68,68,0.12); color: var(--danger); }

    /* ── USE MY LOCATION BUTTON ───────────────────────────────────── */
    .use-location-btn {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      border-radius: 9px;
      border: 1px dashed var(--wire);
      background: rgba(59,130,246,0.08);
      color: var(--accent2);
      font-size: 0.82rem;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .use-location-btn:active { transform: scale(0.98); }
    .use-location-btn:disabled { opacity: 0.5; }
    .field-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      color: var(--steel);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }
    .field-divider::before, .field-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--wire);
    }

    .modal-footer { padding: 12px 16px 20px; border-top: 1px solid var(--wire); display: flex; gap: 10px; flex-shrink: 0; }
    .modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.88rem; border: none; cursor: pointer; font-family: var(--font-body); }
    .modal-btn.save { background: var(--accent); color: #fff; }
    .modal-btn.save:disabled { opacity: 0.5; }
    .modal-btn.delete { background: rgba(239,68,68,0.12); color: var(--danger); }

    #toast-area {
      position: fixed; top: calc(var(--bar-h) + 10px); left: 50%;
      transform: translateX(-50%); z-index: 9999;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none; align-items: center;
    }
    .toast-msg {
      padding: 9px 16px; border-radius: 100px;
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.06em; color: white; white-space: nowrap;
      animation: toastIn 0.25s ease; pointer-events: auto; max-width: 90vw;
    }
    .toast-msg.ok  { background: rgba(16,185,129,0.92); }
    .toast-msg.err { background: rgba(239,68,68,0.92); }
    .toast-msg.inf { background: rgba(59,130,246,0.92); }
    @keyframes toastIn { from { opacity:0; transform: translateY(-8px) scale(0.95);} to { opacity:1; transform: translateY(0) scale(1);} }

    /* ════════════════════════════════════════════════════════════
       RIVERSIDEMAP — live, in-house navigation overlay.
       Namespaced with "rm-" so none of it collides with the list
       view above. No external map tiles/SDK anywhere in here.
    ════════════════════════════════════════════════════════════ */
    #rm-view {
      position: fixed; inset: 0;
      background: var(--paper);
      z-index: 950;
      display: none;
      flex-direction: column;
    }
    #rm-view.show { display: flex; }

    #rm-bar {
      height: var(--bar-h); flex-shrink: 0;
      background: rgba(10,15,30,0.92);
      border-bottom: 1px solid var(--wire);
      display: flex; align-items: center; gap: 4px; padding: 0 8px;
      backdrop-filter: blur(16px);
      position: relative; z-index: 10;
    }
    #rm-nav-status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--steel); flex-shrink: 0; margin-right: 2px;
      transition: background .2s;
    }
    #rm-nav-status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #rm-nav-status-dot.tracking { background: var(--gold); box-shadow: 0 0 6px var(--gold); animation: rmBlink 1s infinite; }
    @keyframes rmBlink { 50% { opacity: .35; } }

    #rm-wrap {
      position: relative; flex: 1; overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.06), transparent 55%),
        var(--paper);
      touch-action: none;
      cursor: grab;
    }
    #rm-wrap.grabbing { cursor: grabbing; }
    #rm-svg { width: 100%; height: 100%; display: block; }

    .rm-grid-line { stroke: rgba(148,163,184,0.06); stroke-width: 1; }

    .rm-spoke {
      fill: none; stroke: var(--wire); stroke-width: 2;
      stroke-dasharray: 5 6;
    }
    .rm-nav-line-bg { fill: none; stroke: var(--paper); stroke-width: 7; stroke-linecap: round; }
    .rm-nav-line     { fill: none; stroke: var(--gold); stroke-width: 3.2; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(250,204,21,0.35)); }
    .rm-nav-line.arrived { stroke: var(--green); filter: drop-shadow(0 0 6px rgba(16,185,129,0.45)); }

    /* live in-progress trail: thin, no dark halo underneath so nothing
       "double-lines" or overlaps at corners */
    .rm-trail { fill: none; stroke: var(--accent2); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .92; }

    /* saved past-walk trails: one uniform colour, solid (no dashes/dots,
       no background halo), drawn as an exact polyline so every real
       corner is preserved, kept thin (and non-scaling so it never gets
       fat at high zoom and blur corners into each other) */
    .rm-trail-past { fill: none; stroke: var(--trail-color); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .82; }
    .rm-trail-past.rm-trail-focused { stroke-width: 2.4; opacity: 1; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }

    /* tiny directional arrowheads dropped along a trail so you can see
       which way it was walked, without adding any extra bulk to the line */
    .rm-trail-arrow { fill: var(--trail-color); opacity: .8; }
    .rm-trail-arrow-live { fill: var(--accent2); opacity: .85; }

    .rm-dist-bg { fill: var(--surface); stroke: var(--gold); stroke-width: 1; }
    .rm-dist-txt { font-family: var(--font-mono); font-size: 11px; fill: var(--gold); font-weight: 700;
      text-anchor: middle; dominant-baseline: middle; }

    .rm-node { stroke: var(--paper); stroke-width: 3; cursor: pointer; transition: r .15s, filter .15s; }
    .rm-node.place { fill: var(--accent2); r: 8; }
    .rm-node.place:hover { r: 10; }
    .rm-node.place.active-target { fill: var(--gold); r: 11; filter: drop-shadow(0 0 8px rgba(250,204,21,.6)); }
    .rm-node.me { fill: var(--green); r: 9; }
    .rm-node-pulse { fill: none; stroke: var(--green); stroke-width: 2; opacity: .6; pointer-events: none;
      animation: rmPulse 2.2s ease-out infinite; }
    @keyframes rmPulse { from { r: 9; opacity: .55; } to { r: 28; opacity: 0; } }

    /* Google-Maps-style heading "beam" — a soft cone that fans out
       ahead of the "You" dot in the direction you're facing/moving */
    .rm-me-beam { fill: var(--green); opacity: 0.16; pointer-events: none; }

    .rm-node-label {
      font-family: var(--font-body); font-weight: 700; font-size: 12px; fill: var(--ink);
      paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round;
      pointer-events: none;
    }
    .rm-node-label.me { fill: var(--green); }

    #rm-compass {
      position: absolute; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 50%;
      background: rgba(15,23,42,0.85); border: 1px solid var(--wire); backdrop-filter: blur(6px); z-index: 40;
    }
    #rm-compass svg { width: 100%; height: 100%; }

    #rm-scale {
      position: absolute; left: 12px; bottom: 14px; display: flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 11px; color: var(--lead); z-index: 40;
    }
    #rm-scale .bar { height: 4px; background: var(--accent2); border-radius: 2px; }

    #rm-controls {
      position: absolute; right: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 40;
    }
    .rm-ctl-btn {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(15,23,42,0.9); border: 1px solid var(--wire); color: var(--lead);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: .9rem;
      backdrop-filter: blur(6px);
    }
    .rm-ctl-btn:active { transform: scale(.93); }
    .rm-ctl-btn.on { color: var(--accent2); border-color: var(--accent2); }

    /* ── floating pill to reopen the sheet when collapsed ─────── */
    #rm-places-pill {
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: rgba(15,23,42,0.92); border: 1px solid var(--wire); color: var(--accent2);
      font-family: var(--font-mono); font-size: .74rem; font-weight: 700; letter-spacing: .04em;
      padding: 9px 16px; border-radius: 100px; z-index: 45; cursor: pointer;
      display: none; align-items: center; gap: 8px; backdrop-filter: blur(8px);
    }
    #rm-places-pill.show { display: flex; }

    /* ── bottom sheet: list / detail / nav-hud / trails, one container ─── */
    #rm-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: rgba(15,23,42,0.97);
      border-top: 1px solid var(--wire);
      border-radius: 18px 18px 0 0;
      max-height: 62%;
      display: flex; flex-direction: column;
      transform: translateY(0);
      transition: transform .22s ease;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    #rm-sheet.collapsed { transform: translateY(100%); }
    #rm-sheet-handle {
      width: 40px; height: 4px; background: var(--wire); border-radius: 100px;
      margin: 8px auto 2px; cursor: pointer; flex-shrink: 0;
    }
    #rm-sheet-collapse-btn {
      position: absolute; top: 6px; right: 8px;
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--lift); border: none; color: var(--lead);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: .78rem; z-index: 2;
    }
    #rm-sheet-collapse-btn:active { transform: scale(.93); }
    #rm-sheet-body { overflow-y: auto; padding: 8px 14px calc(14px + env(safe-area-inset-bottom,0px)); }

    .rm-sheet-title { font-family: var(--font-head); letter-spacing: .04em; font-size: 1.05rem; color: var(--ink); padding: 4px 2px 8px; }
    .rm-sheet-subhead { font-size: .74rem; font-weight: 700; color: var(--ink); margin: 10px 2px 4px; }

    .rm-point-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 10px; border-radius: 11px; background: var(--surface);
      border: 1px solid var(--wire); margin-bottom: 8px; cursor: pointer;
    }
    .rm-point-row:active { transform: scale(.99); }
    .rm-point-name { font-weight: 700; font-size: .88rem; color: var(--ink); }
    .rm-point-sub { font-size: .74rem; color: var(--lead); margin-top: 2px; }
    .rm-point-dist { font-family: var(--font-mono); font-size: .68rem; color: var(--green);
      background: rgba(16,185,129,0.12); padding: 3px 8px; border-radius: 100px; white-space: nowrap; flex-shrink:0; }
    .rm-point-dist.unknown { color: var(--steel); background: rgba(100,116,139,0.12); }

    .rm-detail-actions, .rm-nav-actions { display: flex; gap: 8px; margin-top: 10px; }
    .rm-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px; border-radius: 10px; font-size: .84rem; font-weight: 700; cursor: pointer;
      border: none; font-family: var(--font-body); text-decoration: none;
    }
    .rm-btn.primary { background: var(--accent); color: #fff; }
    .rm-btn.gold { background: var(--gold); color: #1a1400; }
    .rm-btn.ghost { background: var(--lift); color: var(--lead); }
    .rm-btn.danger { background: rgba(239,68,68,0.14); color: var(--danger); }

    /* ── navigation HUD (shown while a route is active) ────────── */
    #rm-hud-arrow-wrap {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.3);
      display: flex; align-items: center; justify-content: center; margin: 4px auto 10px;
    }
    #rm-hud-arrow {
      font-size: 1.8rem; color: var(--gold);
      transition: transform .25s ease;
    }
    #rm-hud-dist { text-align: center; font-family: var(--font-head); font-size: 1.7rem; letter-spacing: .03em; color: var(--ink); }
    #rm-hud-instruction { text-align: center; font-family: var(--font-mono); font-size: .78rem; color: var(--accent2); margin-top: 2px; letter-spacing: .03em; }
    #rm-hud-meta { display:flex; justify-content:center; gap:16px; margin-top:8px; font-family: var(--font-mono); font-size:.68rem; color: var(--steel); }

    .rm-compass-perm {
      margin-top: 8px; width: 100%; padding: 9px; border-radius: 9px;

    }
  </style>
</head>

<!-- ════════════════════════════════════════════════════════════
     RIVERSIDEMAP — full-screen live navigation overlay.
     Pure SVG/CSS/JS. No map tiles, no external map API.
════════════════════════════════════════════════════════════ -->

    <div id="rm-compass">

        <line x1="50" y1="10" x2="50" y2="90" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
        <line x1="10" y1="50" x2="90" y2="50" stroke="rgba(148,163,184,0.25)" stroke-width="1"/>
        <polygon points="50,12 44,50 50,42 56,50" fill="#ef4444"/>
        <polygon points="50,88 44,50 50,58 56,50" fill="#94a3b8"/>

      </svg>

    <div id="rm-scale">

      <button class="rm-ctl-btn" id="rm-zoom-in"><i class="fas fa-plus"></i></button>
