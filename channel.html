<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Channels · Riverside</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Riverside Connect" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="maskable_icon_x192.png"
    />
    <link rel="apple-touch-icon" href="maskable_icon_x192.png" />
    <meta property="og:title" content="Riverside Connect" />
    <meta
      property="og:description"
      content="Join the conversation in Riverside Connect. Share thoughts, media & more."
    />
    <meta
      property="og:image"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/maskable_icon_x192.png"
    />
    <meta
      property="og:url"
      content="https://dcriversidemureracoffee-org.github.io/DC-Riverside.org/"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* ═══ TOKENS — dark slate-blue, one accent, flat surfaces, no glow ═══ */
      :root {
        --ink: #e2e8f0;
        --paper: #0f172a;
        --cream: #1e293b;
        --wire: rgba(96, 165, 250, 0.18);
        --steel: #94a3b8;
        --lead: #cbd5e1;
        --accent: #60a5fa;
        --danger: #f87171;
        --head:
          Impact, "Arial Narrow Bold", "Haettenschweiler",
          "Franklin Gothic Medium", sans-serif;
        --body:
          system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --spring: cubic-bezier(0.34, 1.46, 0.64, 1);
        --ease: cubic-bezier(0.22, 0.8, 0.25, 1);
        --bar-h: 56px;
        --ticker-h: 36px;
        --top: calc(var(--bar-h) + var(--ticker-h));
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font: 15px var(--body);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
        transition:
          transform 0.2s var(--spring),
          background 0.2s,
          color 0.2s,
          opacity 0.2s,
          border-color 0.2s;
      }
      button:active,
      .press:active {
        transform: scale(0.94);
      }
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      .ic {
        width: 1.15em;
        height: 1.15em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
        vertical-align: -0.2em;
        transition: fill 0.2s;
      }
      .ic.on {
        fill: currentColor;
      }
      .ic.f {
        fill: currentColor;
        stroke: none;
      }
      .hd,
      h3,
      h4 {
        font-family: var(--head);
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .av {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: var(--s, 38px);
        height: var(--s, 38px);
        border-radius: 50%;
        background: var(--cream);
        color: var(--accent);
        border: 1px solid var(--wire);
        overflow: hidden;
        flex: none;
        font: 700 calc(var(--s, 38px) * 0.42) var(--body);
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .rise {
        animation: rise 0.55s var(--spring) both;
        animation-delay: calc(var(--i, 0) * 60ms);
      }
      /* masthead + ticker */
      #masthead {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--bar-h);
        background: var(--paper);
        border-bottom: 1px solid var(--wire);
        z-index: 900;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .mh-back {
        height: 100%;
        width: 56px;
        display: grid;
        place-items: center;
        border-right: 1px solid var(--wire);
        color: var(--accent);
        text-decoration: none;
        flex: none;
      }
      .mh-info {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
      }
      .mh-name {
        font: 1.3rem/1 var(--head);
        letter-spacing: 0.05em;
        color: var(--accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mh-meta {
        font: 0.68rem var(--mono);
        color: var(--steel);
        letter-spacing: 0.06em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 3px;
      }
      .mh-tools {
        display: flex;
        height: 100%;
        border-left: 1px solid var(--wire);
        flex: none;
      }
      .mh-btn {
        height: 100%;
        width: 50px;
        display: grid;
        place-items: center;
        border-right: 1px solid var(--wire);
        font-size: 1.05rem;
      }
      .mh-btn:last-child {
        border: 0;
      }
      .mh-btn:hover,
      .mh-btn.active {
        background: var(--cream);
        color: var(--accent);
      }
      #channel-ticker {
        position: fixed;
        top: var(--bar-h);
        inset-inline: 0;
        height: var(--ticker-h);
        background: var(--paper);
        border-bottom: 1px solid var(--wire);
        z-index: 899;
        display: flex;
      }
      .ticker-label {
        padding: 0 14px;
        background: var(--accent);
        color: var(--paper);
        font: 0.8rem var(--head);
        letter-spacing: 0.12em;
        display: flex;
        align-items: center;
      }
      .ticker-scroll {
        flex: 1;
        overflow-x: auto;
        display: flex;
        scrollbar-width: none;
      }
      .ticker-scroll::-webkit-scrollbar {
        display: none;
      }
      .ticker-ch {
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--steel);
        font: 0.78rem var(--mono);
        letter-spacing: 0.06em;
        cursor: pointer;
        border-right: 1px solid var(--wire);
        white-space: nowrap;
        position: relative;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .ticker-ch::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--accent);
        transform: scaleX(0);
        transition: transform 0.35s var(--spring);
      }
      .ticker-ch.active {
        color: #fff;
        background: var(--cream);
      }
      .ticker-ch.active::after {
        transform: none;
      }
      .ticker-ch:hover {
        color: #fff;
      }
      .ticker-add {
        width: 44px;
        display: grid;
        place-items: center;
        color: var(--steel);
        border-left: 1px solid var(--wire);
      }
      .ticker-add:hover {
        color: var(--accent);
      }
      /* stage + rail (swipe untouched) */
      #stage {
        position: fixed;
        top: var(--top);
        inset-inline: 0;
        bottom: 0;
        overflow: hidden;
      }
      #post-rail {
        display: flex;
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      #post-rail::-webkit-scrollbar {
        display: none;
      }
      .post-view {
        width: 100vw;
        height: 100%;
        flex: 0 0 100vw;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--wire);
        position: relative;
      }
      @media (min-width: 1200px) {
        .post-view {
          width: 50vw;
          flex-basis: 50vw;
        }
      }
      @media (min-width: 1800px) {
        .post-view {
          width: 33.333vw;
          flex-basis: 33.333vw;
        }
      }
      .post-body {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: rgba(96, 165, 250, 0.4) transparent;
      }
      .post-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--wire);
        background: var(--paper);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .post-author-block {
        flex: 1;
        min-width: 0;
      }
      .post-author {
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--accent);
      }
      .post-time,
      .post-index {
        font: 0.68rem var(--mono);
        color: var(--steel);
        letter-spacing: 0.06em;
        margin-top: 2px;
      }
      .post-delete-btn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: var(--steel);
      }
      .post-delete-btn:hover {
        color: var(--danger);
      }
      .post-text {
        padding: 20px 18px 14px;
        font-size: 1.04rem;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* media previews */
      .post-media {
        padding: 16px 18px 0;
        display: grid;
        gap: 8px;
      }
      .post-media.multi {
        grid-template-columns: 1fr 1fr;
      }
      .thumb {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        overflow: hidden;
        background: #0b1220;
        border: 1px solid var(--wire);
        padding: 0;
      }
      .multi .thumb {
        aspect-ratio: 1;
      }
      .thumb.sm {
        width: 200px;
        max-width: 100%;
        aspect-ratio: 4/3;
        margin-top: 6px;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s var(--ease);
      }
      .thumb:hover img {
        transform: scale(1.04);
      }
      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .play svg {
        width: 54px;
        height: 54px;
        padding: 15px 13px 15px 17px;
        background: var(--accent);
        color: var(--paper);
        border-radius: 50%;
        transition: transform 0.3s var(--spring);
      }
      .thumb:hover .play svg {
        transform: scale(1.1);
      }
      .tfail {
        display: none;
        position: absolute;
        inset: 0;
        place-items: center;
        font: 0.7rem var(--mono);
        color: var(--steel);
        letter-spacing: 0.08em;
      }
      .thumb.bad .tfail {
        display: grid;
      }
      /* calendar */
      .cal {
        margin: 18px;
        border: 1px solid var(--wire);
      }
      .cal-head {
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--wire);
        touch-action: pan-y;
        user-select: none;
      }
      .cal-nav {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: var(--accent);
      }
      .cal-nav:hover {
        background: var(--cream);
      }
      .cal-title {
        flex: 1;
        text-align: center;
        font: 1rem var(--head);
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      .cal-wd,
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }
      .cal-wd span {
        text-align: center;
        font: 0.6rem var(--mono);
        color: var(--steel);
        padding: 6px 0;
      }
      .cal-viewport {
        overflow: hidden;
      }
      .cal-grid {
        padding: 2px;
      }
      .cal-grid.sl-r {
        animation: slr 0.45s var(--spring);
      }
      .cal-grid.sl-l {
        animation: sll 0.45s var(--spring);
      }
      @keyframes slr {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes sll {
        from {
          transform: translateX(-40px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .cd {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        font-size: 0.8rem;
        color: var(--lead);
        border: 1px solid transparent;
      }
      .cd.past {
        opacity: 0.38;
      }
      .cd.today {
        border-color: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      .cd.has {
        cursor: pointer;
      }
      .cd.has:hover {
        background: var(--cream);
      }
      .cd em {
        font-style: normal;
        font: 700 0.62rem var(--mono);
        color: var(--accent);
        line-height: 1;
      }
      .cd em:empty {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }
      .cal-up {
        border-top: 1px solid var(--wire);
        padding: 10px 14px;
      }
      .cal-up h5 {
        font: 0.62rem var(--mono);
        letter-spacing: 0.1em;
        color: var(--steel);
        margin-bottom: 6px;
        font-weight: 400;
      }
      .up-item {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        width: 100%;
        text-align: left;
        border-top: 1px solid var(--wire);
      }
      .up-item b {
        font: 0.68rem var(--mono);
        color: var(--accent);
        min-width: 56px;
      }
      .up-item span {
        font-size: 0.86rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* footer actions + comments */
      .post-foot {
        display: flex;
        border-top: 1px solid var(--wire);
        background: var(--paper);
        height: 46px;
        flex: none;
      }
      .post-action {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font: 0.72rem var(--mono);
        letter-spacing: 0.06em;
        color: var(--steel);
        border-right: 1px solid var(--wire);
      }
      .post-action:last-child {
        border: 0;
      }
      .post-action:hover {
        color: var(--ink);
        background: var(--cream);
      }
      .post-action.liked {
        color: var(--accent);
      }
      .post-action.liked .ic {
        animation: pop 0.5s var(--spring);
      }
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.5);
        }
        100% {
          transform: scale(1);
        }
      }
      .comment-panel {
        display: flex;
        flex-direction: column;
        height: 0;
        overflow: hidden;
        background: var(--paper);
        flex: none;
        transition: height 0.45s var(--spring);
      }
      .comment-panel.open {
        height: 44%;
        border-top: 1px solid var(--accent);
      }
      .comment-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scrollbar-width: thin;
      }
      .c-msg {
        display: flex;
        gap: 10px;
      }
      .c-msg.own {
        flex-direction: row-reverse;
      }
      .c-bubble {
        max-width: 80%;
        background: var(--cream);
        border: 1px solid var(--wire);
        padding: 8px 12px;
        position: relative;
      }
      .c-msg.own .c-bubble {
        background: var(--accent);
        color: var(--paper);
        border-color: transparent;
      }
      .c-name {
        font: 700 0.7rem var(--mono);
        letter-spacing: 0.04em;
        color: var(--accent);
        margin-bottom: 3px;
      }
      .c-msg.own .c-name {
        color: var(--paper);
      }
      .c-text {
        font-size: 0.88rem;
        line-height: 1.5;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .c-time {
        font: 0.62rem var(--mono);
        opacity: 0.65;
        margin-top: 4px;
        display: block;
      }
      .c-del {
        position: absolute;
        top: 6px;
        right: 6px;
        opacity: 0;
        font-size: 0.7rem;
      }
      .c-bubble:hover .c-del {
        opacity: 0.8;
      }
      .c-reactions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
        flex-wrap: wrap;
      }
      .c-react-menu {
        position: relative;
      }
      .c-react-toggle {
        border: 1px solid currentColor;
        opacity: 0.7;
        padding: 2px 6px;
        height: 22px;
      }
      .c-react-picker {
        position: absolute;
        bottom: 28px;
        left: 0;
        background: var(--paper);
        border: 1px solid var(--wire);
        display: flex;
        z-index: 50;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        transform: scale(0.6) translateY(8px);
        transform-origin: bottom left;
        opacity: 0;
        visibility: hidden;
        transition:
          transform 0.3s var(--spring),
          opacity 0.2s,
          visibility 0.2s;
      }
      .c-react-picker.open {
        transform: none;
        opacity: 1;
        visibility: visible;
      }
      .c-react-picker button {
        font-size: 1.2rem;
        width: 40px;
        height: 36px;
        color: var(--ink);
      }
      .c-react-picker button:hover,
      .c-react-picker button.active {
        background: var(--cream);
      }
      .c-react-count {
        font: 0.72rem var(--mono);
        display: none;
      }
      .c-react-count.visible {
        display: inline;
      }
      .comment-input-bar {
        display: flex;
        align-items: center;
        border-top: 1px solid var(--wire);
        flex: none;
      }
      .comment-input-bar input {
        flex: 1;
        height: 44px;
        padding: 0 14px;
        border: 0;
        background: none;
        outline: 0;
        font-size: 0.88rem;
      }
      .comment-send {
        width: 50px;
        height: 44px;
        background: var(--accent);
        color: var(--paper);
        display: grid;
        place-items: center;
      }
      .dove {
        width: 34px;
        height: 34px;
        display: inline-grid;
        place-items: center;
        font-size: 1.05rem;
        border: 1px solid var(--wire);
        flex: none;
      }
      .dove:hover {
        background: var(--cream);
      }
      /* nav */
      #nav-prev,
      #nav-next {
        position: fixed;
        top: 50%;
        margin-top: -40px;
        width: 40px;
        height: 80px;
        background: var(--paper);
        border: 1px solid var(--wire);
        display: grid;
        place-items: center;
        z-index: 800;
        opacity: 0.45;
      }
      #nav-prev {
        left: 0;
      }
      #nav-next {
        right: 0;
      }
      #nav-prev:hover,
      #nav-next:hover {
        opacity: 1;
        background: var(--cream);
      }
      @media (max-width: 768px) {
        #nav-prev,
        #nav-next {
          display: none;
        }
      }
      #post-progress {
        position: fixed;
        bottom: 0;
        inset-inline: 0;
        height: 3px;
        background: var(--wire);
        z-index: 900;
      }
      #post-progress-fill {
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.5s var(--spring);
      }
      #post-nav-info {
        position: fixed;
        bottom: 10px;
        right: 14px;
        font: 0.65rem var(--mono);
        letter-spacing: 0.1em;
        color: var(--steel);
        z-index: 800;
        pointer-events: none;
        background: var(--paper);
        padding: 3px 8px;
        border: 1px solid var(--wire);
      }
      /* panels + sheets */
      #write-panel,
      #channel-drawer {
        position: fixed;
        inset-inline: 0;
        background: var(--paper);
        overflow-y: auto;
        transition: transform 0.55s var(--spring);
      }
      #write-panel {
        bottom: 0;
        border-top: 1px solid var(--accent);
        z-index: 950;
        transform: translateY(105%);
        max-height: 82vh;
      }
      #write-panel.open {
        transform: none;
      }
      #channel-drawer {
        top: var(--top);
        border-bottom: 1px solid var(--accent);
        z-index: 850;
        transform: translateY(-105%);
        max-height: 65vh;
      }
      #channel-drawer.open {
        transform: none;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--wire);
        position: sticky;
        top: 0;
        background: var(--paper);
        z-index: 2;
      }
      .bar h3,
      .bar h4 {
        font-size: 1.1rem;
        color: var(--accent);
        flex: 1;
      }
      .x {
        width: 34px;
        height: 34px;

    <script>
      "use strict";
      /* ═══ CONFIG & STATE ═══ */
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwdt4glYcp4zY3mFunF_xNn4v4JnJXkCnonCDzLkQKo6k3UxX1sCo3dLsQ2fenHVeJm/exec";
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDBKHrHJ8Kz7W-4ztMCOeMf8Oakv-WZcws",
        authDomain: "dc-riverside-murera-coffee.firebaseapp.com",
        projectId: "dc-riverside-murera-coffee",
        storageBucket: "dc-riverside-murera-coffee.firebasestorage.app",
        messagingSenderId: "373863707096",
        appId: "1:373863707096:web:5e3c703655687b96e442ad",
      };
      const VAPID_KEY =
        "BK5POZAyygNGKbt1HrQOGgg5M8iwhKBVMTirp8LcPb7jt_fIkz-8YOT6pxljlAJXA3CB3NrMKdwujUGlseNVPD0";
      const currentUser = localStorage.getItem("userName") || "";
      if (!currentUser) location.href = "index.html";
      let allChannels = [],
        currentChannel = null,
        currentPosts = [],
        isAuthorised = false,
        isAdmin = false,
        channelPolling = null,
        editingChannel = null,
        stagedEvents = [],
        evImageData = null,
        stagedMedia = null,
        chAvatarData = null;
      const CH_CACHE_KEY = "rv_channels_v2",
        CH_CACHE_TTL = 600000,
        viewedPosts = new Set();
      const $ = (id) => document.getElementById(id);
      const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const sleep = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));

      /* ═══ UTILITIES ═══ */
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ic = (n, c = "") =>
        `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
      function av(name, src, s = 38) {
        const i = (name || "?").trim().charAt(0).toUpperCase() || "?";
        return `<span class="av" style="--s:${s}px"><b>${esc(i)}</b>${src ? `<img src="${esc(src)}" alt="" onerror="this.remove()">` : ""}</span>`;
      }
      const fileId = (u) =>
        (String(u || "").match(/[-\w]{25,}/) || [])[0] || "";
      const lh3 = (u) => {
        if (!u) return "";
        const id = fileId(u);
        return id ? `https://lh3.googleusercontent.com/d/${id}` : u;
      };
      const fmtTime = (t) =>
        new Date(t).toLocaleString([], {
          hour: "2-digit",
          minute: "2-digit",
          day: "numeric",
          month: "short",
        });
      const fmtDate = (t) =>
        new Date(t).toLocaleDateString([], {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (d) =>
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      document
        .querySelectorAll("[data-i]")
        .forEach((el) => (el.innerHTML = ic(el.dataset.i)));

      function toast(msg, type = "ok", dur = 3200) {
        const el = document.createElement("div");
        el.className = `toast-msg ${type}`;
        el.textContent = msg;
        $("toast-area").appendChild(el);
        setTimeout(() => {
          el.classList.add("out");
          setTimeout(() => el.remove(), 260);
        }, dur);
      }
      /* Destructive actions are confirmed in Grace's voice; she never acts on her own */
      function graceConfirm(title, consequence, ok = "DELETE") {
        return new Promise((res) => {
          const el = document.createElement("div");
          el.className = "toast-msg confirm";
          el.innerHTML = `<div class="cf-h">🕊️ ${esc(title)}</div><div class="cf-s">${esc(consequence)} I won't do anything unless you say so.</div><div class="cf-b"><button class="conf-btn" data-r="0">KEEP IT</button><button class="conf-btn danger" data-r="1">${ok}</button></div>`;
          $("toast-area").appendChild(el);
          el.onclick = (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            el.classList.add("out");
            setTimeout(() => el.remove(), 260);
            res(b.dataset.r === "1");
          };
        });
      }

      function getCachedChannels() {
        try {
          const d = JSON.parse(localStorage.getItem(CH_CACHE_KEY) || "null");
          if (!d) return null;
          if (Date.now() - d.t > CH_CACHE_TTL) {
            localStorage.removeItem(CH_CACHE_KEY);
            return null;
          }
          return d.channels || [];
        } catch {
          return null;
        }
      }
      function cacheChannels(c) {
        try {
          localStorage.setItem(
            CH_CACHE_KEY,
            JSON.stringify({ t: Date.now(), channels: c }),
          );
        } catch {}
      }
      async function api(params) {
        return (
          await fetch(`${SCRIPT_URL}?${new URLSearchParams(params)}`)
        ).json();
      }
      async function post(body) {
        return (
          await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(body),
          })
        ).json();
      }

      /* ═══ OVERLAYS ═══ */
      const openOv = (id) => $(id).classList.add("open");
      document.querySelectorAll(".ov").forEach((o) =>
        o.addEventListener("click", (e) => {
          if (e.target === o)
            (
              o.querySelector("[data-close]") || {
                click: () => o.classList.remove("open"),
              }
            ).click();
        }),
      );
      ["viewers-overlay", "event-modal"].forEach((id) =>
        $(id)
          .querySelector("[data-close]")
          .addEventListener("click", () => $(id).classList.remove("open")),
      );

      /* ═══ CHANNELS ═══ */
      async function loadChannels(force = false) {
        checkAdminStatus();
        const c = force ? null : getCachedChannels();
        if (c) {
          allChannels = c;
          renderChannelUI(c);
          fetchChannelsFresh();
        } else await fetchChannelsFresh();
        const usp = new URLSearchParams(location.search),
          cid = usp.get("channelId"),
          pid = usp.get("postId");
        const target = cid
          ? allChannels.find((c) => c.id === cid)
          : allChannels.find(
              (c) => c.id === localStorage.getItem("rv_last_ch"),
            ) || allChannels[0];
        if (target) openChannel(target, pid || null);
        else
          $("post-rail").innerHTML =
            '<div class="state-view"><div class="empty-label">NO CHANNELS YET</div><div class="empty-sub">AN ADMIN CAN CREATE THE FIRST ONE</div></div>';
        setTimeout(pushNudge, 5000);
      }
      async function fetchChannelsFresh() {
        try {
          const d = await api({ operation: "getAllChannels" });
          allChannels = d.channels || [];
          cacheChannels(allChannels);
          renderChannelUI(allChannels);
        } catch (e) {
          console.warn("channels fetch failed", e);
        }
      }
      function renderChannelUI(ch) {
        renderTicker(ch);
        renderDrawer(ch);
      }
      function renderTicker(chs) {
        const s = $("ticker-scroll");
        s.innerHTML = "";
        chs.forEach((ch) => {
          const el = document.createElement("div");
          el.className =
            "ticker-ch" + (currentChannel?.id === ch.id ? " active" : "");
          el.dataset.id = ch.id;
          el.textContent = ch.name.toUpperCase();
          el.onclick = () => {
            openChannel(ch);
            closeDrawer();
          };
          s.appendChild(el);
        });
      }
      function renderDrawer(chs) {
        const g = $("channel-grid");
        g.innerHTML = "";
        chs.forEach((ch, i) => {
          const el = document.createElement("div");
          el.className =
            "ch-item rise" + (currentChannel?.id === ch.id ? " active" : "");
          el.style.setProperty("--i", Math.min(i, 8));
          const owner = ch.creator === currentUser;
          el.innerHTML = `${av(ch.name, ch.picLink ? lh3(ch.picLink) : "", 44)}<div class="ch-item-text"><div class="ch-item-name">${esc(ch.name)}</div><div class="ch-item-desc">${esc(ch.description || "No description")}</div><div class="ch-item-creator">BY ${esc((ch.creator || "").toUpperCase())} · ${fmtDate(ch.created)}</div></div>${owner ? `<button class="x ch-item-edit" title="Edit channel">${ic("edit")}</button>` : ""}`;
          el.onclick = (e) => {
            if (e.target.closest(".ch-item-edit")) return;
            openChannel(ch);
            closeDrawer();
          };
          el.querySelector(".ch-item-edit")?.addEventListener("click", (e) => {
            e.stopPropagation();
            closeDrawer();
            openChModal("edit", ch);
          });
          g.appendChild(el);
        });
      }
      const openDrawer = () => $("channel-drawer").classList.add("open"),
        closeDrawer = () => $("channel-drawer").classList.remove("open");
      $("btn-channels").onclick = openDrawer;
      $("ticker-add").onclick = openDrawer;
      $("drawer-close").onclick = closeDrawer;

      async function openChannel(ch, scrollToPostId = null) {
        if (channelPolling) {
          clearInterval(channelPolling);
          channelPolling = null;
        }
        currentChannel = ch;
        localStorage.setItem("rv_last_ch", ch.id);
        $("mh-av").innerHTML = av(
          ch.name,
          ch.picLink ? lh3(ch.picLink) : "",
          34,
        );
        $("mh-ch-name").textContent = ch.name.toUpperCase();
        $("mh-ch-meta").textContent =
          `BY ${(ch.creator || "").toUpperCase()} · ${fmtDate(ch.created)}`;
        document
          .querySelectorAll(".ticker-ch")
          .forEach((el) =>
            el.classList.toggle("active", el.dataset.id === ch.id),
          );
        document
          .querySelector(`.ticker-ch[data-id="${ch.id}"]`)
          ?.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center",
          });
        await checkAuth(ch.id);
        await renderPosts(ch.id, scrollToPostId);
        startPolling();
        if (scrollToPostId) {
          const p = currentPosts.find((x) => x.postId === scrollToPostId);
          if (p)
            whisper(
              `I brought you to ${p.author}'s post from ${fmtTime(p.created)}.`,
            );
        }
      }
      async function checkAuth(channelId) {
        try {
          const d = await api({
            operation: "isAuthorised",
            username: currentUser,
            channelId,
          });
          isAuthorised = d.status === "success" && d.isAuthorised === true;
        } catch {
          isAuthorised = false;
        }
        $("btn-write").style.display = isAuthorised ? "grid" : "none";
        updateRole();
      }
      async function checkAdminStatus() {
        try {
          const d = await api({
            operation: "getUserStatus",
            name: currentUser,
          });
          isAdmin = !!d.isAdmin;
        } catch {
          isAdmin = false;
        }
        $("drawer-create-btn").style.display = isAdmin ? "flex" : "none";
        updateRole();
      }

      /* ═══ POSTS ═══ */
      async function renderPosts(channelId, scrollToPostId = null) {
        const rail = $("post-rail");
        rail.innerHTML =
          '<div class="state-view"><div class="ld-line"></div><div class="empty-sub">FETCHING POSTS…</div></div>';
        try {
          const d = await api({
            operation: "getChannelPosts",
            channelId,
            username: currentUser,
          });
          currentPosts = d.posts || [];
          if (!currentPosts.length) {
            rail.innerHTML = `<div class="state-view"><div class="empty-label">NO POSTS YET</div><div class="empty-sub">${isAuthorised ? "PRESS THE EDIT BUTTON TO POST" : "NOTHING HERE YET"}</div></div>`;
            updateProgress(0, 0);
            updateNavInfo(0, 0);
            return;
          }
          rail.innerHTML = "";
          currentPosts.forEach((p, i) =>
            rail.appendChild(buildPostView(p, i, currentPosts.length)),
          );
          updateProgress(0, currentPosts.length);
          updateNavInfo(1, currentPosts.length);
          setupViewTracking();
          if (scrollToPostId)
            setTimeout(() => scrollToPost(scrollToPostId), 300);
          else if (currentPosts.length > 1)
            setTimeout(
              () =>
                whisper(
                  "Swipe sideways to read more. Tap me for a quick demo.",
                  "swipe",
                  () => topic("swipe"),
                ),
              1500,
            );
        } catch (err) {
          console.error(err);
          rail.innerHTML =
            '<div class="state-view"><div class="empty-label">LOAD FAILED</div><div class="empty-sub">CHECK CONNECTION AND REFRESH</div></div>';
        }
      }
      const mediaList = (m) => [].concat(m || []).filter((x) => x && x.link);
      function thumbHtml(m, cls = "") {
        const img = (m.type || "").startsWith("image"),
          id = fileId(m.link);
        const pic = img
          ? `<img src="${esc(lh3(m.link))}" loading="lazy" alt="" onerror="this.parentNode.classList.add('bad');this.remove()">`
          : id
            ? `<img src="https://drive.google.com/thumbnail?id=${id}&sz=w640" loading="lazy" alt="" onerror="this.remove()">`
            : "";
        return `<button class="thumb ${cls}" data-m="${esc(m.link)}" data-t="${img ? "image" : "video"}" aria-label="${img ? "Open image" : "Play video"}">${pic}${img ? "" : `<span class="play">${ic("play")}</span>`}<span class="tfail">COULDN'T LOAD</span></button>`;
      }
      function buildPostView(p, idx, total) {
        const w = document.createElement("div");
        w.className = "post-view";
        w.dataset.postId = p.postId;
        const own = p.author === currentUser,
          ml = mediaList(p.media);
        const media = ml.length

      /* ═══ CALENDAR — one month grid; swipe lives on the header only so the rail swipe is never hijacked ═══ */
      function evParts(ev) {
        const raw = (ev.title || "Untitled").trim(),
          i = raw.indexOf("/");
        return i < 0
          ? [raw, ""]
          : [raw.slice(0, i).trim() || raw, raw.slice(i + 1).trim()];
      }
      function initCal(box, evs) {
        const by = {};
        evs.forEach((e) => {
          if (e.date) (by[e.date] = by[e.date] || []).push(e);
        });
        const keys = Object.keys(by).sort(),
          now = new Date(),
          thisM = new Date(now.getFullYear(), now.getMonth(), 1);
        const firstM = keys[0]
          ? new Date(+keys[0].slice(0, 4), +keys[0].slice(5, 7) - 1, 1)
          : thisM;
        let cur = new Date(Math.min(firstM, thisM));
        const grid = box.querySelector(".cal-grid"),
          title = box.querySelector(".cal-title"),
          up = box.querySelector(".cal-up");
        function render(dir = 0) {
          const y = cur.getFullYear(),
            m = cur.getMonth(),
            fd = new Date(y, m, 1).getDay(),
            dim = new Date(y, m + 1, 0).getDate(),
            today = ymd(new Date());
          title.textContent = cur
            .toLocaleString([], { month: "long", year: "numeric" })
            .toUpperCase();
          let h = "";
          for (let i = 0; i < fd; i++) h += "<i></i>";
          for (let d = 1; d <= dim; d++) {
            const ds = `${y}-${pad(m + 1)}-${pad(d)}`,
              n = (by[ds] || []).length;
            h += `<${n ? "button" : "div"} class="cd${ds === today ? " today" : ""}${ds < today ? " past" : ""}${n ? " has" : ""}" ${n ? `data-date="${ds}"` : ""}><span>${d}</span>${n ? `<em>${n > 1 ? n : ""}</em>` : ""}</${n ? "button" : "div"}>`;
          }
          grid.className = "cal-grid";
          grid.innerHTML = h;
          void grid.offsetWidth;
          if (dir && !RM) grid.classList.add(dir > 0 ? "sl-r" : "sl-l");
        }
        const today = ymd(new Date()),
          upc = keys.filter((k) => k >= today).slice(0, 4);
        up.innerHTML =
          `<h5>UPCOMING</h5>` +
          (upc.length
            ? upc
                .map((k) => {
                  const e = by[k][0];
                  return `<button class="up-item" data-date="${k}"><b>${new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8)).toLocaleDateString([], { month: "short", day: "numeric" }).toUpperCase()}</b><span>${esc(evParts(e)[0])}</span></button>`;
                })
                .join("")
            : '<div style="font-size:.8rem;color:var(--steel);padding:4px 0">Nothing coming up.</div>');
        box.addEventListener("click", (e) => {
          const n = e.target.closest(".cal-nav");
          if (n) {
            cur = new Date(cur.getFullYear(), cur.getMonth() + +n.dataset.d, 1);
            render(+n.dataset.d);
            return;
          }
          const d = e.target.closest("[data-date]");
          if (d) {
            tip(
              "cal",
              "Days with a dot have events. Tap one for the day's agenda — you can add it to your calendar too.",
            );
            openDay(d.dataset.date, by[d.dataset.date] || []);
          }
        });
        let sx = null;
        const head = box.querySelector(".cal-head");
        head.addEventListener("pointerdown", (e) => (sx = e.clientX));
        head.addEventListener("pointerup", (e) => {
          if (sx === null) return;
          const dx = e.clientX - sx;
          sx = null;
          if (Math.abs(dx) > 40) {
            const d = dx < 0 ? 1 : -1;
            cur = new Date(cur.getFullYear(), cur.getMonth() + d, 1);
            render(d);
          }
        });
        render();
        setTimeout(
          () =>
            tip(
              "cal",
              "Calendar here! Dots mark event days — tap a day to see what's on.",
            ),
          2500,
        );
      }
      function openDay(date, events) {
        const [y, m, d] = date.split("-");
        $("event-modal-date").textContent = new Date(y, m - 1, d)
          .toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric",
          })
          .toUpperCase();
        const list = $("event-modal-list");
        list.innerHTML = "";
        if (!events.length)
          list.innerHTML =
            '<div style="color:var(--steel);font-size:.85rem">No events on this day</div>';
        events.forEach((ev, i) => {
          const [t, ds] = evParts(ev),
            img = ev.imageUrl ? lh3(ev.imageUrl) : "";
          const it = document.createElement("div");
          it.className = "ev-item rise";
          it.style.setProperty("--i", i);
          it.innerHTML = `<div class="ev-title">${esc(t)}</div>${ds ? `<div class="ev-desc">${esc(ds)}</div>` : ""}${img ? thumbHtml({ link: img, type: "image" }) : ""}<button class="ics-btn">${ic("cal")} ADD TO CALENDAR</button>`;
          it.querySelector(".ics-btn").onclick = () => downloadIcs(ev, date);
          list.appendChild(it);
        });
        openOv("event-modal");
      }
      /* .ics export — built locally, no backend, no outside service */
      function downloadIcs(ev, date) {
        const [t, d] = evParts(ev),
          a = date.replace(/-/g, ""),
          b = ymd(
            new Date(
              +date.slice(0, 4),
              +date.slice(5, 7) - 1,
              +date.slice(8, 10) + 1,
            ),
          ).replace(/-/g, "");
        const f = (s) =>
          String(s)
            .replace(/\\/g, "\\\\")
            .replace(/\n/g, "\\n")
            .replace(/[,;]/g, "\\$&");
        const txt = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Riverside//Channels//EN",
          "BEGIN:VEVENT",
          `UID:${a}-${Math.random().toString(36).slice(2)}@riverside`,
          `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g, "")}`,
          `DTSTART;VALUE=DATE:${a}`,
          `DTEND;VALUE=DATE:${b}`,
          `SUMMARY:${f(t)}`,
          d ? `DESCRIPTION:${f(d)}` : "",
          "END:VEVENT",
          "END:VCALENDAR",
        ]
          .filter(Boolean)
          .join("\r\n");
        const url = URL.createObjectURL(
            new Blob([txt], { type: "text/calendar" }),
          ),
          l = document.createElement("a");
        l.href = url;
        l.download = (t.slice(0, 30).replace(/\W+/g, "-") || "event") + ".ics";
        document.body.appendChild(l);
        l.click();
        l.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast("Calendar file saved", "ok");
      }

      /* ═══ MEDIA VIEWER ═══ */
      const VW = { items: [], i: 0, s: 1, x: 0, y: 0, src: null, base: 1 };
      document.addEventListener("click", (e) => {
        const t = e.target.closest(".thumb[data-m]");
        if (!t) return;
        const grp = t.closest("[data-grp]") || t.parentNode;
        const els = [...grp.querySelectorAll(".thumb[data-m]")];
        openViewer(
          els.map((x) => ({ link: x.dataset.m, type: x.dataset.t })),
          els.indexOf(t),
          t,
        );
      });
      function openViewer(items, i, src) {
        VW.items = items;
        VW.i = i;
        VW.src = src;
        $("vw").classList.add("open");
        showItem(true);
        whisperLater(
          "viewer",
          "Double-tap or pinch to zoom, swipe down or press Esc to close.",
        );
      }
      function applyT(anim) {
        const im = $("vw-stage").querySelector(".vw-img");
        if (!im) return;
        im.style.transition = anim ? "transform .3s var(--spring)" : "none";
        im.style.transform = `translate(${VW.x}px,${VW.y}px) scale(${VW.s})`;
      }
      function showItem(fromThumb) {
        const it = VW.items[VW.i],
          st = $("vw-stage"),
          id = fileId(it.link);
        VW.s = 1;
        VW.x = VW.y = 0;
        $("vw-count").textContent =
          VW.items.length > 1 ? `${VW.i + 1} / ${VW.items.length}` : "";
        $("vw-drive").href = id
          ? `https://drive.google.com/file/d/${id}/view`
          : it.link;
        st.className = "ld";
        [...st.querySelectorAll(".vw-img,iframe")].forEach((n) => n.remove());
        if (it.type === "image") {
          const im = new Image();
          im.className = "vw-img";
          im.draggable = false;
          im.onload = () => {
            st.classList.remove("ld");
            if (fromThumb && VW.src && !RM) {
              const a = VW.src.getBoundingClientRect(),
                b = im.getBoundingClientRect();
              if (b.width) {
                im.style.transition = "none";
                im.style.transform = `translate(${a.left + a.width / 2 - b.left - b.width / 2}px,${a.top + a.height / 2 - b.top - b.height / 2}px) scale(${a.width / b.width})`;
                void im.offsetWidth;
                im.style.transition = "transform .6s var(--spring)";
                im.style.transform = "";
              }
            }
          };
          im.onerror = () => (st.className = "bad");
          im.src = lh3(it.link);
          st.appendChild(im);
        } else if (id) {
          const f = document.createElement("iframe");
          f.allow = "autoplay;fullscreen";
          f.allowFullscreen = true;
          f.onload = () => st.classList.remove("ld");
          f.src = `https://drive.google.com/file/d/${id}/preview`;
          st.appendChild(f);
        } else st.className = "bad";
      }
      function closeViewer() {
        $("vw").classList.remove("open");
        setTimeout(() => {
          $("vw-stage")
            .querySelectorAll(".vw-img,iframe")
            .forEach((n) => n.remove());
        }, 320);
      }
      const goItem = (n) => {
        VW.i = (VW.i + n + VW.items.length) % VW.items.length;
        showItem(false);
      };
      $("vw-close").onclick = closeViewer;
      (function () {
        const st = $("vw-stage"),
          P = new Map();
        let pd = 0,
          sx = 0,
          sy = 0,
          ox = 0,
          oy = 0,
          mv = 0,
          last = 0;
        st.addEventListener("pointerdown", (e) => {
          P.set(e.pointerId, e);
          st.setPointerCapture?.(e.pointerId);
          if (P.size === 2) {
            const [a, b] = [...P.values()];
            pd = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            VW.base = VW.s;
          } else {
            sx = e.clientX;
            sy = e.clientY;
            ox = VW.x;
            oy = VW.y;
            mv = 0;
          }
        });
        st.addEventListener("pointermove", (e) => {
          if (!P.has(e.pointerId)) return;
          P.set(e.pointerId, e);
          if (P.size === 2 && pd) {
            const [a, b] = [...P.values()];
            VW.s = Math.min(
              5,
              Math.max(
                1,
                (VW.base *
                  Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)) /
                  pd,
              ),
            );
            applyT(false);
            mv = 99;
          } else if (P.size === 1) {
            const dx = e.clientX - sx,
              dy = e.clientY - sy;
            mv = Math.max(mv, Math.abs(dx), Math.abs(dy));
            if (VW.s > 1) {
              VW.x = ox + dx;
              VW.y = oy + dy;
            } else {
              VW.x = dx;
              VW.y = dy;
            }
            applyT(false);
          }
        });
        const end = (e) => {
          if (!P.has(e.pointerId)) return;
          P.delete(e.pointerId);
          if (P.size) return;
          pd = 0;
          const dx = e.clientX - sx,
            dy = e.clientY - sy;
          if (VW.s > 1) {
            if (VW.s < 1.05) {
              VW.s = 1;
              VW.x = VW.y = 0;
            }
            applyT(true);
            return;
          }
          if (dy > 90 && dy > Math.abs(dx)) {
            closeViewer();
            return;
          }
          if (
            Math.abs(dx) > 60 &&
            Math.abs(dx) > Math.abs(dy) &&
            VW.items.length > 1
          ) {
            VW.x = VW.y = 0;
            goItem(dx < 0 ? 1 : -1);
            return;
          }
          VW.x = VW.y = 0;
          applyT(true);
          if (mv < 8) {
            const n = Date.now();
            if (document.elementFromPoint(e.clientX, e.clientY) === st) {
              closeViewer();
              return;
            }
            if (n - last < 320 && $("vw-stage").querySelector(".vw-img")) {
              VW.s = 2.5;
              applyT(true);
            }
            last = n;
          }
        };
        st.addEventListener("pointerup", end);
        st.addEventListener("pointercancel", end);
      })();

      /* ═══ SCROLL, VIEW TRACKING, NAV ═══ */
      $("post-rail").addEventListener(
        "scroll",
        () => {
          const r = $("post-rail"),
            vw = r.querySelector(".post-view")?.clientWidth || r.clientWidth;
          if (!vw) return;
          const i = Math.round(r.scrollLeft / vw);
          updateProgress(i, currentPosts.length);
          updateNavInfo(i + 1, currentPosts.length);
        },
        { passive: true },
      );
      const updateProgress = (i, t) =>
        ($("post-progress-fill").style.width =
          t > 1 ? `${(i / (t - 1)) * 100}%` : "100%");
      const updateNavInfo = (c, t) =>
        ($("post-nav-info").textContent = t ? `${c} / ${t}` : "");
      function setupViewTracking() {
        const ob = new IntersectionObserver(
          (es) =>
            es.forEach((en) => {
              if (!en.isIntersecting) return;
              const id = en.target.dataset.postId;
              if (!id || viewedPosts.has(id)) return;
              viewedPosts.add(id);
              recordView(id);
            }),
          { threshold: 0.6 },
        );
        document
          .querySelectorAll(".post-view[data-post-id]")
          .forEach((el) => ob.observe(el));
      }
      async function recordView(postId) {
        try {
          await post({
            operation: "recordChannelPostView",
            postId,
            username: currentUser,
            channelId: currentChannel?.id,
          });
          refreshViewCount(postId);
        } catch {}
      }
      async function refreshViewCount(postId) {
        try {
          const d = await api({ operation: "getChannelPostViewCount", postId });
          if (d.status === "success") {
            const el = document.querySelector(
              `.post-view[data-post-id="${postId}"] .view-count-label`,
            );
            if (el) el.textContent = d.count || 0;
          }

      const railBy = (n) => {
        const r = $("post-rail");

      $("nav-prev").onclick = () => railBy(-1);
      $("nav-next").onclick = () => railBy(1);
      function scrollToPost(postId) {
        const el = document.querySelector(
          `.post-view[data-post-id="${postId}"]`,
        );
        if (!el) return;
        el.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "start",
        });
        spot(el);
      }

      /* ═══ LIKES ═══ */
      async function toggleLike(postId, btn) {
        const liked = btn.dataset.liked === "1",
          ce = btn.querySelector(".like-count"),
          icn = btn.querySelector(".ic");
        let c = parseInt(ce.textContent) || 0;
        const set = (l, n) => {
          btn.dataset.liked = l ? "1" : "0";
          btn.classList.toggle("liked", l);
          icn.classList.toggle("on", l);
          ce.textContent = n;
        };
        set(!liked, liked ? Math.max(0, c - 1) : c + 1);
        try {
          await post({
            operation: "toggleChannelPostLike",
            postId,
            username: currentUser,
          });
        } catch {
          set(liked, c);
          toast("Like failed", "err");
        }
      }

      /* ═══ COMMENTS & REACTIONS ═══ */

          const d = await api({ operation: "getChannelCommentCount", postId });

      async function loadComments(postId) {

          list.dataset.lastDeleteTime &&

              operation: "getChannelComments",

            ? ""
            : '<div style="text-align:center;padding:20px;color:var(--steel);font:.72rem var(--mono);letter-spacing:.08em">NO COMMENTS YET</div>';
          cs.forEach((c, i) => {
            const own = c.author === currentUser,
              m = mediaList(c.media)[0];
            const msg = document.createElement("div");
            msg.className = `c-msg rise ${own ? "own" : ""}`;
            msg.style.setProperty("--i", Math.min(i, 6));
            msg.dataset.commentId = c.id;
            const R = c.reactions || {};
            msg.innerHTML = `${av(c.author, c.picLink ? lh3(c.picLink) : "", 28)}<div class="c-bubble"><div class="c-name">${esc(c.author.toUpperCase())}</div>${m ? `<div data-grp>${thumbHtml(m, "sm")}</div>` : ""}<div class="c-text">${esc(c.content)}</div><span class="c-time">${fmtTime(c.created)}</span>${own ? `<button class="c-del" title="Delete">${ic("trash")}</button>` : ""}
        <div class="c-reactions"><div class="c-react-menu"><button class="c-react-toggle" title="React">${ic("smile")}</button><div class="c-react-picker" id="rp-${c.id}">${[
          ["fire", "🔥"],
          ["love", "❤️"],
          ["thanks", "🙏"],
        ]
          .map(
            ([k, e]) =>
              `<button data-emoji="${k}" class="${R.myReaction === k ? "active" : ""}">${e}</button>`,
          )
          .join("")}</div></div>
        ${[
          ["fire", "🔥"],
          ["love", "❤️"],
          ["thanks", "🙏"],
        ]
          .map(
            ([k, e]) =>
              `<span class="c-react-count ${(R[k] || 0) > 0 ? "visible" : ""}" data-type="${k}">${R[k] || 0} ${e}</span>`,
          )
          .join("")}</div></div>`;
            msg
              .querySelector(".c-del")
              ?.addEventListener("click", () =>
                deleteComment(c.id, postId, msg, list),
              );
            const tg = msg.querySelector(".c-react-toggle"),
              pk = msg.querySelector(".c-react-picker");
            tg.addEventListener("click", (e) => {

                );

              b.addEventListener("click", () => {
                toggleReaction(c.id, postId, b.dataset.emoji, msg);
                pk.classList.remove("open");
              }),
            );
            list.appendChild(msg);
          });

      function coachText() {

          m +=

        return m + " “PUBLISH” and “DONE — POST” both publish the whole post.";

      /* ═══ GRACE — rule-based guide, no AI calls. Identity: 🕊️ ═══ */
      const G = {

        quiet: localStorage.getItem("rv_g_quiet") === "1",
        seen: new Set(JSON.parse(localStorage.getItem("rv_g_seen") || "[]")),
        chips: [],
      };
      const gMark = (k) => {
        G.seen.add(k);

      };
      const role = () =>
        isAdmin
          ? "admin"
          : currentChannel && currentChannel.creator === currentUser
            ? "creator"
            : isAuthorised
              ? "author"
              : "reader";
      const ROLE_TXT = {
        reader: "reading here",

      };
      function updateRole() {
        $("g-role").textContent = ROLE_TXT[role()];

      $("g-quiet").classList.toggle("on", G.quiet);

      /* FIX: say() opens the panel via gToggle(true, true) so it never re-triggers greet().
         Previously gToggle → greet → say → gToggle → greet … recursed forever (stack overflow)
         because #g-body is still empty until the first bubble is appended. */
      function gToggle(open, noGreet = false) {
        const g = $("grace"),
          o = open ?? !g.classList.contains("open");
        g.classList.toggle("open", o);
        $("btn-grace").classList.toggle("active", o);
        if (o) {
          $("g-whisper").classList.remove("show");
          if (!noGreet && !$("g-body").children.length) greet();
        }
      }
      $("btn-grace").onclick = () => gToggle();
      $("g-close").onclick = () => gToggle(false);
      $("g-quiet").onclick = (e) => {
        G.quiet = !G.quiet;
        localStorage.setItem("rv_g_quiet", G.quiet ? "1" : "0");
        e.currentTarget.classList.toggle("on", G.quiet);
        say(
          G.quiet
            ? "Quiet mode on — I'll stay silent unless you open me."
            : "I'm back to whispering the odd tip.",
        );
      };

      /* Messages type out like someone texting: dots, a pause, then the bubble pops in */
      async function say(lines, chips = []) {
        gToggle(true, true);
        const t = ++G.tok,
          body = $("g-body"),
          cw = $("g-chips");
        cw.innerHTML = "";
        for (const l of [].concat(lines)) {
          const b = document.createElement("div");
          b.className = "g-msg typing";
          b.innerHTML = "<i></i><i></i><i></i>";
          body.appendChild(b);
          body.scrollTop = body.scrollHeight;
          await sleep(380 + Math.min(l.length * 14, 1200));
          if (t !== G.tok) {
            b.remove();
            return;
          }
          b.className = "g-msg";
          b.textContent = l;
          body.scrollTop = body.scrollHeight;
          await sleep(220);
        }
        while (body.children.length > 40) body.firstChild.remove();
        chips.forEach((c, i) => {
          const b = document.createElement("button");
          b.textContent = c.t;
          b.style.setProperty("--i", i);
          b.onclick = () => c.f();
          cw.appendChild(b);
        });
      }
      function userBubble(t) {
        const b = document.createElement("div");
        b.className = "g-msg me";
        b.textContent = t;
        $("g-body").appendChild(b);
        $("g-body").scrollTop = 1e6;
      }
      let wT;
      function whisper(text, key = null, act = null) {
        if (G.quiet || (key && G.seen.has(key))) return;
        if (key) gMark(key);
        if ($("grace").classList.contains("open")) return;
        const w = $("g-whisper");
        w.textContent = "🕊️ " + text;
        w.onclick = () => {
          w.classList.remove("show");
          act ? act() : topic("menu");
        };
        w.classList.add("show");
        clearTimeout(wT);
        wT = setTimeout(() => w.classList.remove("show"), 7000);
      }
      const tip = (k, t) => whisper(t, k);
      const whisperLater = (k, t) => setTimeout(() => whisper(t, k), 900);

      function spot(sel) {
        const el = typeof sel === "string" ? document.querySelector(sel) : sel;
        if (!el) return;
        el.scrollIntoView?.({
          behavior: RM ? "auto" : "smooth",
          block: "nearest",
          inline: "start",
        });
        el.classList.remove("spot");
        void el.offsetWidth;
        el.classList.add("spot");
        setTimeout(() => el.classList.remove("spot"), 3200);
      }
      function curPost() {
        const r = $("post-rail"),
          v = r.querySelector(".post-view");
        return v
          ? r.querySelectorAll(".post-view")[
              Math.round(r.scrollLeft / v.clientWidth)
            ]
          : null;
      }
      /* “Show me”: scroll the rail to the right post first, then spotlight the control */
      function showMe(sel) {
        const p = curPost(),
          el = p?.querySelector(sel) || document.querySelector(sel);
        if (!el) return say("I can't find that on screen right now.");
        gToggle(false);
        setTimeout(() => spot(el), 250);
      }
      async function swipeDemo() {
        const rail = $("post-rail");
        if (currentPosts.length < 2) {
          say("There's only one post here, so nothing to swipe to yet.");
          return;
        }
        gToggle(false);
        const f = document.createElement("div");
        f.className = "finger";
        document.body.appendChild(f);
        const s0 = rail.scrollLeft;
        rail.style.scrollSnapType = "none";
        await sleep(350);
        rail.scrollTo({
          left: s0 + Math.min(110, rail.clientWidth / 4),
          behavior: "smooth",
        });
        await sleep(850);
        rail.scrollTo({ left: s0, behavior: "smooth" });
        await sleep(700);
        rail.style.scrollSnapType = "";
        f.remove();
      }
      const topicChips = () =>
        [
          ["Why can't I post?", "role"],
          ["Scheduling", "schedule"],
          ["Events", "event"],
          ["Who saw this?", "viewers"],
          ["New channel", "channel"],
          ["Reactions", "react"],
          ["Swipe demo", "swipe"],
          ["Notifications", "push"],
        ].map(([t, k]) => ({ t, f: () => topic(k) }));
      function greet() {
        const r = role();
        say(
          [
            `Hi ${currentUser} 🕊️ I'm Grace.`,
            {
              reader:
                "You're reading along here — I can explain how things work.",
              author:
                "You can post in this channel, so I can coach you when you write.",
              creator:
                "This is your channel: you can post, edit and delete it.",
              admin:
                "You're an admin, so you can create channels. I'll keep an eye on the details.",
            }[r],
            "What would you like to know?",
          ],
          topicChips(),
        );
      }

      function topic(k) {
        const r = role(),
          n = currentChannel?.name || "this channel";
        const T = {
          menu: () => say("What can I help with?", topicChips()),
          role: () =>
            r === "reader"
              ? say([
                  "Posting is a per-channel permission — that's why there's no write button for you in " +
                    n +
                    ".",
                  "An admin or the channel's creator can authorise you. Until then, reading, liking, commenting and reacting all work.",
                ])
              : say(
                  [
                    `You're allowed to post in ${n}. The pencil in the top bar opens the write panel.`,
                  ],
                  [{ t: "Show me", f: () => showMe("#btn-write") }],
                ),
          write: () => {
            const ls = [coachText()];
            if (stagedEvents.length)
              ls.push(
                "Events staged: " +
                  stagedEvents
                    .map((e) => `${e.date} — ${evParts(e)[0]}`)
                    .join("; ") +
                  ".",
              );
            ls.push(
              "Nothing goes out until you press PUBLISH or DONE — POST. I never publish for you.",
            );
            say(ls);
          },
          schedule: () =>
            say([
              "Tap the clock in the write panel to pick a time. The post goes live then instead of now.",
              "Choose a time in the future — a past time means it would publish straight away.",
            ]),
          event: () =>
            say([
              "Events: pick a date, then type the title. Add a description after a “/” — like “Clean-up day / Bring gloves”.",
              "Add as many as you like; they appear in a list you can review and remove. “DONE — POST” then publishes the whole post, not only the events.",
            ]),
          viewers: () =>
            say("Tap the eye on any post to see who has viewed it and when.", [
              { t: "Show me", f: () => showMe(".post-view-badge") },
            ]),
          channel: () =>
            say(
              isAdmin
                ? [
                    "Open the channel drawer (layers icon) and choose “Create new channel”.",
                  ]
                : [
                    "Only admins can create channels. If you made a channel, you can edit or delete it from the drawer's pencil.",
                  ],
            ),
          react: () =>
            say(
              "Open a post's comments, then tap the smiley on a comment. You get one reaction per comment; tap again to remove it.",
              [
                {
                  t: "Show me comments",
                  f: () => showMe(".comment-toggle-btn"),
                },
              ],
            ),
          swipe: () => swipeDemo(),
          media: () =>
            say(
              "Tap any picture or video to open it full screen. Double-tap or pinch to zoom, swipe down or press Esc to close.",
            ),
          comment: () =>
            say([
              "Comments are for everyone in the channel. Enter sends; the smiley under a comment adds a reaction.",
              "Only you can delete your own comments — and deleting is permanent.",
            ]),
          chform: () =>
            say(
              editingChannel
                ? [
                    "Editing: change the name, description or icon, then save.",
                    "Deleting a channel removes every post and comment in it. I'll ask you to confirm first.",
                  ]
                : [
                    "Give your channel a short name and, if you like, a description and icon.",
                    "If you skip the icon I'll draw a tile with the first letter.",
                  ],
            ),
          push: () => {
            if (!("Notification" in window))
              return say("This browser doesn't support notifications.");
            if (Notification.permission === "granted")
              return say("Notifications are already on for this device. 🕊️");
            if (Notification.permission === "denied")
              return say(
                "Notifications are blocked in your browser settings. Allow them there and I can set it up.",
              );
            say(
              [
                "Want a nudge when someone posts or replies? You'll hear about it even when this page is closed.",
                "Tapping the button asks your browser for permission.",
              ],
              [
                { t: "Turn on notifications", f: () => enablePush() },
                {
                  t: "Not now",
                  f: () => {
                    localStorage.setItem("rv_push_ask", "1");
                    say("No problem. Ask me any time.");
                  },
                },
              ],
            );
          },
          delete: () =>
            say(
              "Deleting a post removes its comments too. Deleting a channel removes everything inside. I always ask first and never delete by myself.",
            ),
        };
        (T[k] || T.menu)();
      }
      function ask(q) {
        q = q.trim();
        if (!q) return;
        userBubble(q);
        const s = q.toLowerCase();
        const R = [
          [
            /can'?t post|cannot post|no write|write button|why.*(post|write)|permission|authori/,
            "role",
          ],
          [/schedul|later|future/, "schedule"],
          [/event|calendar/, "event"],
          [/who saw|viewer|seen|views?\b/, "viewers"],
          [/new channel|create channel|make.*channel/, "channel"],
          [/react|emoji/, "react"],
          [/notif|push|alert/, "push"],
          [/swipe|scroll|next post/, "swipe"],
          [/media|image|video|photo|zoom/, "media"],
          [/post|write|publish/, "write"],
          [/delete|remove/, "delete"],
          [/^(hi|hello|hey|menu|help)\b/, "menu"],
        ];
        for (const [re, k] of R) if (re.test(s)) return topic(k);
        const toks = s
          .replace(/^(go to|open|find|search)\s+/, "")
          .split(/\s+/)
          .filter((w) => w.length > 2);
        const hits = allChannels
          .filter((c) => toks.some((t) => c.name.toLowerCase().includes(t)))
          .slice(0, 4);
        if (hits.length)
          return say(
            `I found ${hits.length} channel${hits.length > 1 ? "s" : ""} that might match.`,
            hits.map((c) => ({
              t: c.name,
              f: () => {
                openChannel(c);
                say(`Here you go — ${c.name}.`);
              },
            })),
          );
        say(
          "Hmm, I didn't quite understand that. Here's what I can help with:",
          topicChips(),
        );
      }
      $("g-go").onclick = () => {
        ask($("g-in").value);
        $("g-in").value = "";
      };
      $("g-in").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          ask(e.target.value);
          e.target.value = "";
        }
      });
      document.addEventListener("click", (e) => {
        const d = e.target.closest("[data-g]");
        if (d) topic(d.dataset.g);
      });

      /* ═══ PUSH — Firebase is loaded lazily, only after the user taps Grace's button ═══ */
      async function enablePush(silent = false) {
        try {
          if (!("serviceWorker" in navigator) || !("Notification" in window))
            return;
          const perm = await Notification.requestPermission();
          localStorage.setItem("rv_push_ask", "1");
          if (perm !== "granted") {
            if (!silent)
              say(
                "No problem — you can switch notifications on later in your browser settings.",
              );
            return;
          }
          const swReg = await navigator.serviceWorker.register("./sw.js", {
            scope: "./",
          });
          await navigator.serviceWorker.ready;
          const { initializeApp } =
            await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js");
          const { getMessaging, getToken, onMessage } =
            await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-messaging.js");
          const app = initializeApp(FIREBASE_CONFIG),
            messaging = getMessaging(app);
          const token = await getToken(messaging, {
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: swReg,
          });
          if (token) {
            await post({
              operation: "saveFcmToken",
              username: currentUser,
              fcmToken: token,
            });
            localStorage.setItem("rv_push_t", Date.now());
          }
          onMessage(messaging, (p) => {
            toast(
              `${p.data?.title || "New activity"} — ${p.data?.body || ""}`,
              "ok",
              5000,
            );
            if (currentChannel) renderPosts(currentChannel.id);
          });
          if (!silent)
            say("All set — I'll let you know when something new lands. 🕊️");
        } catch (err) {
          console.warn("FCM setup failed:", err);
          if (!silent)
            say("I couldn't finish setting that up. Please try again later.");
        }
      }
      function pushNudge() {
        if (!("Notification" in window)) return;
        if (Notification.permission === "granted") {
          if (Date.now() - (+localStorage.getItem("rv_push_t") || 0) > 6048e5)
            enablePush(true);
          return;
        }
        if (
          Notification.permission === "default" &&
          !localStorage.getItem("rv_push_ask")
        )
          whisper(
            "Want a nudge when something new is posted? Tap me.",
            "push",
            () => topic("push"),
          );
      }

      /* ═══ KEYS + NOTIFICATION CLICKS + INIT ═══ */
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if ($("vw").classList.contains("open")) return closeViewer();
          const o = [...document.querySelectorAll(".ov.open")].pop();
          if (o) return o.querySelector("[data-close]")?.click();
          if ($("write-panel").classList.contains("open"))
            return closeWritePanel();
          if ($("grace").classList.contains("open")) return gToggle(false);
          return closeDrawer();
        }
        if ($("vw").classList.contains("open")) {
          if (e.key === "ArrowRight" && VW.items.length > 1) goItem(1);
          if (e.key === "ArrowLeft" && VW.items.length > 1) goItem(-1);
          return;
        }
        if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName))
          return;
        if (e.key === "ArrowRight") railBy(1);
        if (e.key === "ArrowLeft") railBy(-1);
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .catch(() => {}),
        );
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data?.type === "NOTIFICATION_CLICK") {
            const url = new URL(event.data.url || event.data),
              cid = url.searchParams.get("channelId"),
              pid = url.searchParams.get("postId");
            if (cid) {
              const ch = allChannels.find((c) => c.id === cid);
              if (ch) openChannel(ch, pid || null);
            } else if (pid) scrollToPost(pid);
          }
        });
      }
      window.addEventListener("DOMContentLoaded", () => loadChannels());
    </script>
  </body>
</html>
